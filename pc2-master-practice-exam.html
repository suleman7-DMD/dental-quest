e. A is wrong — inhaled anesthetics cause vasodilation, not vasoconstriction. C is wrong — they depress respiration, not stimulate it. D is wrong — they are myocardial depressants, not stimulants. E is partially correct on vasodilation but wrong on respiratory stimulation."}, {"q": "NSAIDs help to reduce peripheral sensitization produced by COX-2. This statement is:", "choices": ["True", "False"], "correct": 0, "explain": "TRUE. COX-2 is induced at sites of tissue injury and inflammation, producing prostaglandins that sensitize peripheral nociceptors (lowering their activation threshold). NSAIDs inhibit COX-2 at the peripheral site, reducing prostaglandin production and thereby decreasing peripheral sensitization. Additionally, COX-2 is widely induced in the CNS by peripheral inflammation, contributing to central sensitization — NSAIDs may also help attenuate this."}, {"q": "When pre-oxygenating a patient with 100% oxygen, the nitrogen in the lungs is replaced with oxygen. This denitrogenation occurs primarily in which lung volume compartment?", "choices": ["Inspiratory capacity", "Vital capacity", "Functional residual capacity (residual volume)", "Tidal volume", "Expiratory reserve volume"], "correct": 2, "explain": "When administering 100% oxygen, the goal is to replace the nitrogen gas trapped in the functional residual capacity (FRC), which includes the residual volume — the air remaining in the lungs after maximal expiration. This denitrogenation creates an oxygen reservoir in the lungs, providing a buffer against desaturation during brief periods of apnea (e.g., during intubation). A is wrong — inspiratory capacity is the volume that can be inhaled from FRC. B is wrong — vital capacity is the maximum volume that can be exhaled after maximum inhalation. D is wrong — tidal volume is exchanged with each normal breath. E is wrong — ERV is only part of the FRC."}, {"q": "A patient is allergic to aspirin. Which of the following pain medications could safely be prescribed?", "choices": ["Vicoprofen (hydrocodone + ibuprofen)", "Percodan (oxycodone + aspirin)", "Percocet (oxycodone + acetaminophen)", "Motrin (ibuprofen)", "Excedrin (aspirin + acetaminophen + caffeine)"], "correct": 2, "explain": "Percocet contains oxycodone + acetaminophen — no aspirin and no NSAID. In aspirin-allergic patients, cross-reactivity with other NSAIDs (ibuprofen, naproxen) is possible due to shared COX inhibition, so all NSAIDs should generally be avoided. Acetaminophen is safe because it works through a different mechanism. A is wrong — Vicoprofen contains ibuprofen, an NSAID with cross-reactivity risk. B is wrong — Percodan contains aspirin directly. D is wrong — Motrin is ibuprofen, an NSAID. E is wrong — Excedrin contains aspirin."}, {"q": "The ‘concentration effect’ of nitrous oxide refers to:", "choices": ["The higher the concentration of N₂O inhaled, the more rapidly the arterial tension rises", "The effect of N₂O on increasing the uptake of a second inhaled anesthetic", "Post-sedation headache and nausea from N₂O", "The maximum concentration limited to 70% by modern equipment", "N₂O being concentrated in enclosed gas spaces"], "correct": 0, "explain": "The concentration effect is described in the slides as a ‘vacuum-type effect’ — the higher the concentration of gas inhaled, the more rapidly the arterial tension of that gas increases. It is significant at concentrations >70% and not significant at lower concentrations. This is distinct from the second gas effect, which involves N₂O enhancing the uptake of a co-administered inhalation anesthetic. B is wrong — this describes the second gas effect. C is wrong — this describes diffusion hypoxia symptoms. D is wrong — this is a safety feature, not the concentration effect. E is wrong — this relates to N₂O expansion in closed spaces."}, {"q": "The ‘second gas effect’ occurs when:", "choices": ["N₂O is combined with other inhalation agents, increasing the concentration of the second gas", "N₂O is rapidly eliminated at the end of sedation", "Two different N₂O concentrations are delivered alternately", "A second dose of N₂O is administered after the first wears off", "N₂O replaces CO₂ in the alveoli"], "correct": 0, "explain": "Per the slides: the second gas effect ‘occurs when other inhalation agents are combined with N₂O/O₂,’ resulting in ‘increased concentration of the second gas.’ This is advantageous during GA because it minimizes the required concentration of the other inhalation agent (e.g., sevoflurane). The rapid uptake of large volumes of N₂O creates a vacuum effect that concentrates whatever other gas is present. B is wrong — this describes the process leading to diffusion hypoxia. C, D, and E do not describe the second gas effect."}, {"q": "The ‘rebound’ or ‘second peak’ effect of diazepam, where sedation recurs approximately one hour after the patient’s first meal, is caused by:", "choices": ["Lack of oxygen delivery to the brain", "Release of diazepam stored in muscle tissue", "Normal postprandial drowsiness unrelated to the drug", "Gallbladder contraction releasing bile containing unmetabolized diazepam, which is reabsorbed in the small intestine", "Renal tubular reabsorption of the drug"], "correct": 3, "explain": "After IV diazepam, some unmetabolized drug is excreted into bile and stored in the gallbladder. When the patient eats, the gallbladder contracts (cholecystokinin-mediated), releasing its bile contents — including unmetabolized diazepam — into the small intestine, where the drug is reabsorbed into the systemic circulation. This enterohepatic recirculation produces a ‘second peak’ of sedation. A is wrong — cerebral hypoxia is not the mechanism. B is wrong — while redistribution occurs, this doesn’t explain the meal-triggered timing. C is wrong — this is directly drug-related, not normal postprandial drowsiness. E is wrong — renal reabsorption is not the mechanism."}, {"q": "Benzodiazepines enhance the inhibitory effect of GABA on neuronal excitability by increasing neuronal membrane permeability to which ion?", "choices": ["Sodium", "Potassium", "Chloride", "Calcium", "Magnesium"], "correct": 2, "explain": "Benzodiazepines bind to the GABA-A receptor complex and enhance GABA’s ability to open chloride (Cl⁻) channels. Increased chloride influx hyperpolarizes the neuron, making it more resistant to excitation. This is the fundamental mechanism behind the anxiolytic, sedative, anticonvulsant, and muscle relaxant properties of all benzodiazepines. A is wrong — sodium influx causes depolarization (excitation), not inhibition. B is wrong — potassium is involved in repolarization but not the GABA-BZD mechanism. D is wrong — calcium is involved in neurotransmitter release and muscle contraction. E is wrong — magnesium is not the primary ion in GABA-mediated inhibition."}, {"q": "A 20%:80% mixture of N₂O:O₂ produces analgesic effectiveness equivalent to approximately what dose of morphine?", "choices": ["2.5 mg", "5 mg", "10 to 15 mg", "30 mg", "50 mg"], "correct": 2, "explain": "The slides state: ‘20% concentration = 10–15 mg morphine.’ This demonstrates that even at low therapeutic concentrations, N₂O provides clinically significant analgesia. This morphine-equivalence helps explain why N₂O is effective for managing mild-to-moderate procedural pain and why it’s considered a valuable adjunct to local anesthesia. A and B are too low. D and E are too high for a 20% N₂O concentration."}, {"q": "Which IV agent’s formulation can support bacterial growth?", "choices": ["Midazolam", "Ketamine", "Propofol", "Etomidate", "Fentanyl"], "correct": 2, "explain": "Propofol’s lipid emulsion formulation (Intralipid — soybean oil, glycerol, egg lecithin) can support bacterial growth if contamination occurs. This is why propofol must be handled with strict aseptic technique, used within a limited time after opening, and never stored for later use. This is a unique and clinically important safety concern among IV anesthetics. A is wrong — midazolam is water-soluble and does not support bacterial growth. B is wrong — ketamine’s formulation does not support bacterial growth. D is wrong — etomidate’s unique concern is cortisol/aldosterone suppression, not bacteria. E is wrong — fentanyl’s formulation does not support bacterial growth."}, {"q": "Etomidate’s major adverse effect is:", "choices": ["Malignant hyperthermia", "Bacterial contamination risk", "Transient inhibition of cortisol and aldosterone synthesis", "Severe bronchospasm", "Prolonged QT interval"], "correct": 2, "explain": "Etomidate transiently inhibits enzymes involved in cortisol and aldosterone synthesis (11β-hydroxylase), causing temporary adrenocortical suppression. This is clinically significant in critically ill patients or with prolonged infusions. Despite this, etomidate is valued for its hemodynamic stability — it causes minimal cardiovascular depression, making it useful for induction in hemodynamically unstable patients. A is wrong — MH is not associated with etomidate. B is wrong — bacterial growth risk is associated with propofol. D is wrong — etomidate does not cause bronchospasm. E is wrong — QT prolongation is not a primary etomidate concern."}, {"q": "A patient who is allergic to codeine needs a pain medication after periodontal surgery. Which of the following could you safely prescribe?", "choices": ["Percodan (oxycodone + aspirin)", "Vicodin (hydrocodone + acetaminophen)", "Tylenol #3 (acetaminophen + codeine)", "Meperidine (Demerol)", "Both A and D"], "correct": 3, "explain": "True codeine allergy (not intolerance/side effects) does not necessarily cross-react with all opioids because different opioids have different chemical structures. Meperidine (Demerol) is a synthetic opioid structurally unrelated to codeine, making it the safest choice. Vicodin contains hydrocodone (a codeine derivative), and Tylenol #3 contains codeine directly. Percodan’s oxycodone is semi-synthetic but derived from thebaine, not codeine, though caution is still warranted. Meperidine is the most clearly safe option. A has some cross-reactivity concern. B is wrong — hydrocodone is structurally related to codeine. C is wrong — it contains codeine directly. E is debatable — meperidine alone is the safest single choice."}, {"q": "During IV sedation with midazolam (2 mg) and fentanyl (100 mcg), you notice the patient’s respirations are very shallow and slow (~7/min). The appropriate management is:", "choices": ["Administer 100% O₂, assist ventilation, give naloxone to reverse fentanyl, and flumazenil to reverse midazolam", "Administer 100% O₂, assist ventilation, give naloxone to reverse midazolam, and flumazenil to reverse fentanyl", "Administer a muscle relaxant and intubate immediately", "Do nothing if pulse oximetry shows normal readings", "Administer epinephrine and call 911"], "correct": 0, "explain": "The correct management is: (1) 100% O₂ and assisted ventilation first, then (2) naloxone (Narcan) to reverse fentanyl’s respiratory depressant effects, and (3) flumazenil to reverse midazolam’s sedative effects. Naloxone is the opioid antagonist; flumazenil is the benzodiazepine antagonist. Never confuse which reversal agent matches which drug class. B is wrong — it reverses the drug-antagonist pairing. C is wrong — intubation is premature when pharmacologic reversal is available. D is dangerously wrong — shallow respirations at 7/min require immediate intervention regardless of SpO₂. E is wrong — this is not an anaphylactic or cardiac event."}, {"q": "Which sedation technique provides the operator with the MOST control over the clinical action of the drug?", "choices": ["Inhalation sedation (N₂O/O₂)", "Oral sedation", "Rectal sedation", "Intramuscular sedation", "Intravenous sedation"], "correct": 4, "explain": "IV sedation provides the MOST control because it offers the most rapid onset, precise titration, ability to incrementally increase dosage, and ability to use reversal agents. However, N₂O (inhalation) provides excellent moment-to-moment control of sedation depth but cannot reach deep sedation. The key distinction: IV provides the most overall control including reaching deeper sedation levels; N₂O provides the most control within minimal-to-moderate sedation only. B, C, and D are all non-titratable routes with delayed, unpredictable absorption and no ability to adjust dosing in real time."}, {"q": "NSAIDs exhibit a plateau (ceiling) effect for analgesia, meaning:", "choices": ["They become more effective the longer they are used", "Analgesic effect cannot be increased by increasing the dose beyond a maximum amount", "They must be taken with food to work", "Their analgesic effect is limited to the first 24 hours", "They are only effective for mild pain"], "correct": 1, "explain": "NSAIDs have an analgesic ceiling — once the maximum effective dose is reached, increasing the dose further does NOT provide additional pain relief but DOES increase the risk of adverse effects (GI bleeding, renal toxicity, cardiovascular events). This is clinically important: if a maximum-dose NSAID is not controlling pain, adding an additional drug class (acetaminophen, opioid) is more appropriate than simply increasing the NSAID dose. A is wrong — prolonged NSAID use increases side effects, not efficacy. C is wrong — food reduces GI side effects but doesn’t affect the ceiling concept. D is wrong — NSAIDs work beyond 24 hours. E is wrong — NSAIDs are effective for mild-to-moderate pain."}, {"q": "Short-acting barbiturates (e.g., thiopental) are rapidly removed from the brain primarily by:", "choices": ["Hepatic biotransformation", "Renal excretion", "Redistribution from the brain to other tissues", "Plasma esterase hydrolysis", "Pulmonary excretion"], "correct": 2, "explain": "Barbiturates are highly lipid-soluble, which facilitates their rapid redistribution from the blood and brain to other tissues (particularly muscle and fat). This redistribution — not metabolism — is primarily responsible for the rapid termination of their CNS effects. The drug hasn’t been eliminated; it has simply moved to inactive storage sites. This is why the α-half-life (redistribution) determines apparent clinical duration. A is wrong — hepatic metabolism is too slow to account for the rapid offset of action. B is wrong — renal excretion plays a minimal immediate role. D is wrong — plasma esterases metabolize ester-type drugs (like succinylcholine), not barbiturates. E is wrong — barbiturates are not eliminated through the lungs."}, {"q": "For IV sedation monitoring, which type of stethoscope is recommended for dental sedation?", "choices": ["Esophageal stethoscope", "Preauricular stethoscope", "Precordial stethoscope", "Pretracheal stethoscope", "Standard binaural stethoscope only"], "correct": 3, "explain": "The slides list three types of stethoscopes for IV sedation monitoring: precordial, pretracheal, and esophageal. For dental sedation specifically, the pretracheal stethoscope is recommended because it can simultaneously monitor heart sounds, breath sounds, and detect airway obstruction or laryngospasm — all critical parameters when the airway is shared with the dental operator. A is wrong — esophageal stethoscopes are used during GA with intubation, not routine dental sedation. B is wrong — preauricular stethoscope is not a standard sedation monitoring tool. C is an option but pretracheal is preferred in dental settings. E is wrong — while useful for pre-op assessment, a standard stethoscope doesn’t provide continuous monitoring during the procedure."}, {"q": "One day after periodontal surgery, a patient reports significantly more pain and noticeable swelling compared to the first day. The most appropriate analgesic to recommend is:", "choices": ["Tricyclic antidepressants", "Anticonvulsants", "Sodium channel blockers", "Opioids (e.g., hydrocodone/acetaminophen)", "Benzodiazepines"], "correct": 3, "explain": "Postoperative pain peaking on day 1–2 with increasing swelling is consistent with an expected inflammatory response. Opioid-containing analgesics are appropriate for moderate-to-severe acute postoperative dental pain. Tricyclic antidepressants and anticonvulsants are used for chronic/neuropathic pain, not acute postoperative pain. The ideal approach would be multimodal (NSAID + opioid), but among the choices, opioids address moderate-to-severe acute pain. A is wrong — TCAs are for chronic neuropathic pain. B is wrong — anticonvulsants (gabapentin, pregabalin) are for neuropathic pain. C is wrong — Na channel blockers (local anesthetics) are not practical for ongoing postoperative analgesia at home. E is wrong — benzodiazepines are for anxiety, not pain."}, {"q": "Which drug is indicated for premedication before general anesthesia in a precooperative patient?", "choices": ["Propofol", "Ketamine", "Diazepam (Valium) or midazolam", "Thiopental (Pentothal)", "Fentanyl"], "correct": 2, "explain": "Benzodiazepines (diazepam/Valium or midazolam/Versed) are the drugs of choice for premedication before general anesthesia. They provide anxiolysis, amnesia, and sedation without significant cardiovascular or respiratory depression at premedication doses. The slides also note IM/PO midazolam can be given ‘as a pediatric premed.’ Propofol and thiopental are induction agents, not premedicants. A is wrong — propofol is an induction agent given IV at the time of anesthesia, not premedication. B — ketamine can be used as IM premed in pediatrics but BZDs are the standard answer. D is wrong — thiopental is an IV induction agent. E is wrong — fentanyl is an intraoperative analgesic, not standard premedication."}, {"q": "Ketamine produces which type of anesthesia?", "choices": ["Balanced anesthesia", "Neuroleptanesthesia", "Dissociative anesthesia", "Minimal sedation", "Regional anesthesia"], "correct": 2, "explain": "Ketamine produces dissociative anesthesia — a cataleptic state with profound analgesia, amnesia, and apparent unconsciousness while maintaining protective reflexes. Patients may have open eyes and involuntary movements. Disadvantages include hallucinations, increased HR/BP, and emergence reactions. A is wrong — balanced anesthesia uses multiple drug classes combined. B is wrong — neuroleptanesthesia uses a neuroleptic + opioid. D is wrong — ketamine produces much deeper than minimal sedation. E is wrong — regional anesthesia involves nerve blocks, not systemic drugs."}, {"q": "EXTRA CREDIT — Prescription Writing: A healthy 22-year-old male (NKDA, no significant PMH) presents for extraction of teeth #1 and #16. Expected mild-to-moderate post-operative pain. What is the most appropriate analgesic prescription?", "choices": ["Oxycodone 10mg, #30, 1 tab q4-6h PRN pain", "Ibuprofen 600mg, #20, 1 tab q6h PRN pain + Acetaminophen 500mg, #20, 1 tab q6h PRN", "Acetaminophen with codeine #3, #30, 1-2 tabs q4-6h PRN pain", "Morphine 15mg, #20, 1 tab q4h PRN pain", "Aspirin 325mg, #30, 2 tabs q4h PRN pain"], "correct": 1, "explain": "For a healthy young adult with mild-to-moderate pain after third molar extractions, multimodal non-opioid therapy is first-line: ibuprofen 600mg q6h + acetaminophen 500mg q6h alternating provides superior analgesia to most opioid combinations. This follows current best-practice guidelines emphasizing non-opioid first-line therapy for dental pain. A is wrong — Oxycodone 10mg is excessive for mild-moderate pain. C is wrong — Codeine combination is reasonable but opioids are no longer first-line. D is wrong — Morphine is grossly excessive. E is wrong — Aspirin increases bleeding post-extraction."}, {"q": "The S1 (first heart sound) is produced by closure of which valves?", "choices": ["Aortic and pulmonic valves", "Mitral and tricuspid valves (AV valves)", "Mitral and aortic valves", "Tricuspid and pulmonic valves", "All four valves simultaneously"], "correct": 1, "explain": "S1 is produced by closure of the atrioventricular (AV) valves — the mitral and tricuspid valves — at the beginning of systole. S2 is produced by closure of the semilunar valves (aortic and pulmonic) at the end of systole. S1 marks the start of ventricular contraction; S2 marks the start of ventricular relaxation (diastole). A is wrong — aortic and pulmonic closure produces S2. C/D mix AV and semilunar valves incorrectly. E is wrong — the valves close in pairs, not simultaneously."}, {"q": "The S2 (second heart sound) is produced by closure of which valves and marks the beginning of which phase of the cardiac cycle?", "choices": ["AV valves; beginning of systole", "AV valves; beginning of diastole", "Semilunar valves (aortic and pulmonic); beginning of diastole", "Semilunar valves; beginning of systole", "Mitral valve only; mid-systole"], "correct": 2, "explain": "S2 results from closure of the semilunar valves (aortic and pulmonic) and marks the beginning of diastole (ventricular relaxation and filling). Physiologic splitting of S2 can occur during inspiration when pulmonic valve closure is delayed. S3 and S4 are adventitious sounds — S3 is associated with CHF, S4 with decreased ventricular compliance. A/B describe S1. D has wrong phase. E is incomplete."}, {"q": "Preload is best defined as:", "choices": ["The vascular resistance against which the heart must contract", "The stretch of cardiac muscle fibers prior to contraction", "The rate of electrical conduction through the AV node", "The amount of oxygen delivered to the myocardium", "The heart rate multiplied by stroke volume"], "correct": 1, "explain": "Per the slides, preload is the 'stretch of cardiac muscle prior to contraction' — essentially the volume of blood filling the ventricle at end-diastole. Afterload is 'the vascular resistance against which the cardiac muscle must contract.' These are two key determinants of cardiac output along with heart rate and contractility. A defines afterload. C describes conduction velocity. D describes myocardial oxygen supply. E describes cardiac output."}, {"q": "Mean Arterial Pressure (MAP) is calculated using which formula?", "choices": ["MAP = (SBP + DBP) / 2", "MAP = SBP – DBP", "MAP = (SBP + 2 × DBP) / 3", "MAP = 2 × SBP + DBP", "MAP = Cardiac Output × Heart Rate"], "correct": 2, "explain": "Per the slides: MAP = SBP + 2(DBP) / 3. For example, if BP = 110/80: MAP = [110 + 2(80)] / 3 = 270/3 = 90 mmHg. MAP represents the average arterial pressure during one cardiac cycle and is weighted toward diastole because diastole is longer than systole. Pulse pressure = SBP – DBP (a separate calculation). A is a simple average, not weighted. B calculates pulse pressure. D/E are incorrect formulas."}, {"q": "A patient classified as ASA II would have which of the following conditions?", "choices": ["No systemic disease (normal healthy patient)", "Well-controlled asthma, well-controlled hypertension, or healthy pregnancy", "Unstable angina or MI within the past 6 months", "Uncontrolled COPD or severe CHF", "End-stage cardiac or hepatic disease"], "correct": 1, "explain": "Per the slides, ASA II = 'mild systemic disease' — examples include healthy pregnant patient, well-controlled asthma, well-controlled hypertension, well-controlled NIDDM, and well-controlled epilepsy. ASA I = normal healthy patient. ASA III = severe disease limiting activity (stable angina, controlled COPD). ASA IV = incapacitating disease threatening life. ASA V = not expected to survive 24 hours."}, {"q": "A patient with unstable angina pectoris, MI within the past 6 months, uncontrolled hypertension, or severe CHF would be classified as:", "choices": ["ASA I", "ASA II", "ASA III", "ASA IV", "ASA V"], "correct": 3, "explain": "ASA IV = 'incapacitating systemic disease that is a constant threat to life.' Examples from the slides: unstable angina, MI or stroke in past 6 months, uncontrolled HTN, severe CHF or COPD, uncontrolled epilepsy, uncontrolled diabetes mellitus. ASA III patients have severe but non-incapacitating disease (stable angina, controlled COPD, well-controlled IDDM, mild CHF). A/B are less severe. E = not expected to survive 24 hours."}, {"q": "In the Mallampati Classification, Class I airway is characterized by visualization of:", "choices": ["Only the hard palate", "Only the soft palate", "Soft palate, uvula, and anterior and posterior tonsillar pillars", "Soft palate and base of uvula only", "No pharyngeal structures visible"], "correct": 2, "explain": "Mallampati Class I: soft palate, entire uvula, and anterior/posterior tonsillar pillars all visible — predicts easy intubation. Class II: tonsillar pillars and tip of uvula hidden by tongue base. Class III: only soft palate visible — predicts difficult intubation. Class IV: only hard palate visible — technically difficult or impossible intubation. The exam is performed with patient sitting upright, mouth maximally open, tongue protruded, no phonation."}, {"q": "Mallampati Class III, where only the soft palate is visible, predicts:", "choices": ["Easy intubation", "Moderate intubation difficulty", "Difficult intubation — consider awake intubation", "Normal airway with no concerns", "Impossible intubation requiring surgical airway"], "correct": 2, "explain": "Per the slides, Mallampati Class III shows 'only the soft palate is visible' and 'a difficult intubation is predicted — consider awake intubation.' Class IV (only hard palate visible) is expected to be 'technically difficult or impossible.' Class I (full visualization) predicts easy intubation. This classification helps the clinician anticipate and plan for airway management challenges."}, {"q": "The Stress Reduction Protocol for a normal, healthy, anxious patient (ASA I) includes all of the following EXCEPT:", "choices": ["Recognition of anxiety", "Premedication with CNS depressant the night before, as needed", "Appointment scheduled in the morning", "Preoperative and postoperative vital signs monitored and recorded", "Minimization of office waiting time"], "correct": 3, "explain": "Preoperative and postoperative vital signs monitoring is part of the ASA II-IV medical risk protocol, NOT the ASA I anxious patient protocol. The ASA I protocol includes: recognition of anxiety, premedication night before and day of as needed, morning appointment, minimize waiting, psychosedation during treatment, adequate pain control, variable appointment length, and postoperative pain/anxiety control. Vital sign monitoring is added for medical risk patients (ASA II+)."}, {"q": "For infective endocarditis prophylaxis, the standard oral regimen for a patient who is NOT allergic to penicillin is:", "choices": ["Amoxicillin 500 mg taken 1 hour before the procedure", "Amoxicillin 2 g taken 30–60 minutes before the procedure", "Clindamycin 600 mg taken 30–60 minutes before the procedure", "Azithromycin 250 mg taken 2 hours before the procedure", "Amoxicillin 1 g taken 30–60 minutes before the procedure"], "correct": 1, "explain": "Per the AHA guidelines in the slides (Table 5): the standard oral regimen is Amoxicillin 2 g, single dose, 30–60 minutes before the procedure. For penicillin-allergic patients: cephalexin 2 g, azithromycin/clarithromycin 500 mg, or doxycycline 100 mg. For patients unable to take oral meds: ampicillin 2 g IM or IV, or cefazolin/ceftriaxone 1 g IM or IV. All are single doses given 30–60 minutes before."}, {"q": "For a patient allergic to penicillin who requires IE prophylaxis before a dental procedure, which of the following is an appropriate alternative oral antibiotic?", "choices": ["Amoxicillin 2 g", "Ampicillin 2 g IM", "Cephalexin 2 g OR Azithromycin 500 mg OR Doxycycline 100 mg", "Metronidazole 500 mg", "Vancomycin 1 g IV"], "correct": 2, "explain": "For penicillin-allergic patients, the slides list three oral alternatives: cephalexin 2 g, azithromycin or clarithromycin 500 mg, or doxycycline 100 mg — all as single doses 30–60 minutes before the procedure. Note: cephalexin should NOT be used in patients with history of anaphylaxis or angioedema with penicillin/ampicillin. A/B contain penicillin-class drugs. D and E are not in the IE prophylaxis regimen."}, {"q": "Oxygen cylinders are color-coded which color, and what is the full cylinder pressure at 70°F?", "choices": ["Blue; 750 psi", "Green; 2000 psi", "Blue; 2000 psi", "Green; 750 psi", "White; 1500 psi"], "correct": 1, "explain": "Per the slides: Oxygen = color coded GREEN, full cylinder pressure = 2000 psi at 70 degrees. Nitrous oxide = color coded BLUE, full cylinder pressure = 750 psi at 70 degrees (575 psi at 50 degrees). N₂O cylinders are 95% liquid and 5% vapor. These color codes and pressures are important for identifying cylinders and knowing when they need replacement."}, {"q": "Nitrous oxide cylinders are color-coded which color, and what is the full cylinder pressure at 70°F?", "choices": ["Green; 2000 psi", "Blue; 750 psi", "Blue; 2000 psi", "Green; 750 psi", "Yellow; 1000 psi"], "correct": 1, "explain": "Per the slides: N₂O = color coded BLUE, full cylinder = 750 psi at 70°F (575 psi at 50°F). N₂O is stored as 95% liquid and 5% vapor in the cylinder. Oxygen is GREEN at 2000 psi. The pressure gauge on an N₂O cylinder remains relatively constant (750 psi) until most of the liquid has vaporized, then drops rapidly — unlike O₂ where pressure drops proportionally to content."}, {"q": "The Pin Index Safety System (PISS) is designed to:", "choices": ["Prevent delivery of more than 70% N₂O", "Shut off N₂O if oxygen pressure drops", "Prevent accidental attachment of an N₂O cylinder to the oxygen portal on portable machines", "Prevent accidental attachment of N₂O hoses to the oxygen portal on central systems", "Sound an alarm when gas levels are low"], "correct": 2, "explain": "Per the slides: the Pin Index Safety System 'prevents accidental attachment of N₂O cylinder to O₂ portal with portable machines.' The Diameter Index Safety System (DISS) 'prevents accidental attachment of N₂O hose to O₂ portal' on central systems. These are two separate physical safety systems — PISS for cylinder connections on portable units, DISS for hose connections on central systems. A describes the percentage delivery mechanism. B describes the fail-safe valve."}, {"q": "The Diameter Index Safety System (DISS) is designed to:", "choices": ["Prevent delivery of hypoxic gas mixtures", "Prevent accidental attachment of N₂O hoses to the oxygen portal", "Prevent accidental attachment of cylinders to wrong portals on portable machines", "Measure the flow rate of gases being delivered", "Monitor end-tidal CO₂ levels"], "correct": 1, "explain": "Per the slides, DISS 'prevents accidental attachment of N₂O hose to O₂ portal.' This applies to central (wall-mounted) systems where hoses connect to wall outlets. The Pin Index Safety System (PISS) serves a similar function but for cylinder connections on portable machines. Together, these systems prevent wrong-gas delivery through physical incompatibility of connections."}, {"q": "Which of the following is NOT a safety mechanism on the N₂O/O₂ delivery system?", "choices": ["Oxygen fail-safe mechanism", "Pin index safety system", "Diameter index safety system", "Emergency air inlet", "Automatic drug titration sensor"], "correct": 4, "explain": "Per the slides, N₂O/O₂ safety mechanisms include: oxygen fail-safe, pin index safety system, diameter index safety system, emergency air inlet, non-rebreathing valve, reservoir bag, auxiliary positive-pressure oxygen hookup, and visual/audible alarms. There is no 'automatic drug titration sensor' — titration is performed manually by the clinician based on patient response. A/B/C/D are all real safety mechanisms listed in the slides."}, {"q": "Chronic occupational exposure to N₂O was first reported to cause reproductive problems by the 1967 Vaisman report. The NIOSH recommended maximum exposure level for N₂O in a dental setting is:", "choices": ["10 ppm", "25 ppm", "50 ppm", "100 ppm", "200 ppm"], "correct": 2, "explain": "Per the slides: '1977 NIOSH reviewed scavenging potential of nitrous oxide: OR 25 ppm, Dental setting 50 ppm.' The OR (operating room) standard is stricter at 25 ppm. Scavenging systems are required to minimize trace gas exposure. The 1967 Vaisman report first identified 'reproductive problems in both male and female anesthesiologists in Russia' from chronic N₂O exposure."}, {"q": "Nitrous oxide oxidizes the cobalt form of vitamin B12, preventing it from acting as a coenzyme for which enzyme critical for DNA production?", "choices": ["Cyclooxygenase", "Methionine synthase", "Acetylcholinesterase", "Cytochrome P450", "Carbonic anhydrase"], "correct": 1, "explain": "Per the slides: N₂O 'oxidizes the cobalt form of cobalamin (Vit B12), prevents B12 from acting as a coenzyme for methionine synthase,' which is 'involved with DNA production and subsequent cellular reproduction.' This is why patients with known vitamin B12 deficiency or pernicious anemia should obtain medical advice before N₂O administration, and B12 deficiency is listed as an absolute contraindication."}, {"q": "Regarding N₂O and pregnancy, the slides recommend postponement of N₂O sedation during which trimester due to significant fetal demand for folic acid during organogenesis?", "choices": ["No restrictions in any trimester", "First trimester", "Second trimester", "Third trimester", "All three trimesters"], "correct": 1, "explain": "Per the slides: 'Significant demand for folic acid during organogenesis (first trimester), postponement of nitrous oxide sedation is recommended.' For pregnant dental staff: 'important to know levels, use scavenger systems, make decision if needs to avoid office setting in the first trimester.' N₂O's interference with methionine synthase (via B12 oxidation) disrupts DNA synthesis, posing greatest risk during the first trimester when organogenesis occurs."}, {"q": "For N₂O/O₂ sedation, what monitoring is required during MINIMAL sedation (concentration ≤50%)?", "choices": ["Blood pressure, pulse, and respiratory rate only", "Blood pressure, pulse, respiratory rate, plus pulse oximetry", "Blood pressure, pulse, respiratory rate, pulse oximetry, plus end-tidal CO₂", "Full ECG monitoring, arterial line, and capnography", "No monitoring is required for minimal sedation"], "correct": 0, "explain": "Per the slides, minimal sedation monitoring for N₂O requires: blood pressure, pulse, and respiratory rate. For MODERATE sedation (>50% concentration or added oral agent), additional monitoring includes pulse oximetry and possibly end-tidal CO₂. This tiered approach matches the level of risk — higher concentrations or combined agents require more intensive monitoring. E is wrong — monitoring is always required."}, {"q": "The indications for N₂O/O₂ sedation include all of the following EXCEPT:", "choices": ["Fear and anxiety (adults and pediatric)", "Medically compromised patients (cardiovascular disease, asthma)", "Gagging", "COPD", "Cerebrovascular disease"], "correct": 3, "explain": "COPD is an ABSOLUTE CONTRAINDICATION to N₂O, not an indication. The slide-listed indications are: (1) fear and anxiety (adults and pediatric), (2) medically compromised patients (cardiovascular disease, cerebrovascular disease, asthma), and (3) gagging. COPD patients have chronic air trapping, and N₂O would expand trapped gas and worsen respiratory function."}, {"q": "N₂O/O₂ sedation maintains the patient in which stage of general anesthesia?", "choices": ["Stage I — Analgesia", "Stage II — Delirium", "Stage III — Surgical anesthesia", "Stage IV — Medullary paralysis", "N₂O does not relate to GA staging"], "correct": 0, "explain": "N₂O/O₂ sedation is designed to maintain the patient in Stage I (Analgesia), which is described in the slides as 'appropriate for sedation and analgesia.' The patient remains awake, respiration and eye movements are normal, protective reflexes are intact, and amnesia may or may not be present. Stage II (Delirium) is undesirable and would indicate oversedation with N₂O."}, {"q": "The blood flow pathway through the heart, in correct order, is:", "choices": ["Left atrium → left ventricle → lungs → right atrium → right ventricle → body", "Vena cava → right atrium → right ventricle → pulmonary arteries → lungs → pulmonary veins → left atrium → left ventricle → aorta", "Vena cava → left atrium → left ventricle → lungs → right atrium → right ventricle → aorta", "Aorta → right atrium → right ventricle → left atrium → left ventricle → lungs", "Pulmonary veins → right atrium → right ventricle → aorta → left atrium"], "correct": 1, "explain": "Per the slides: poorly oxygenated blood enters the right atrium via the superior and inferior vena cava, passes to the right ventricle, then into the pulmonary trunk/arteries to the lungs for gas exchange. Well-oxygenated blood returns via 4 pulmonary veins to the left atrium, passes to the left ventricle, then into the aorta for systemic circulation. All other options have the pathway out of order."}, {"q": "The aortic valve is best auscultated at the:", "choices": ["Left 5th intercostal space, midclavicular line", "Right 2nd intercostal space, sternal border", "Left 2nd intercostal space, sternal border", "Left 4th intercostal space, sternal border", "Xiphoid process"], "correct": 1, "explain": "Aortic valve = Right 2nd intercostal space at the sternal border. Pulmonic valve = Left 2nd intercostal space. Tricuspid valve = Left 4th intercostal space (lower left sternal border). Mitral valve = Left 5th intercostal space, midclavicular line (apex). A describes the mitral area. C describes the pulmonic area. D describes the tricuspid area."}, {"q": "When evaluating a patient's pulse before treatment, which heart rate values should be further evaluated before proceeding?", "choices": ["Below 50 or above 90 beats/minute", "Below 60 or above 110 beats/minute", "Below 70 or above 100 beats/minute", "Below 80 or above 120 beats/minute", "Any heart rate is acceptable if the patient feels well"], "correct": 1, "explain": "Per the slides: 'Values below 60 or above 110 b/minute should be evaluated before treatment.' Additionally, the regularity (regular or irregular) of the pulse should be assessed. Bradycardia (<60) may indicate heart block, medication effects, or high vagal tone. Tachycardia (>110) may indicate anxiety, pain, fever, dehydration, cardiac disease, or medication effects."}, {"q": "A hypertensive crisis is defined as a systolic blood pressure of:", "choices": ["180 mmHg or greater and/or diastolic of 110 mmHg or greater", "200 mmHg or greater and/or diastolic of 120 mmHg or greater", "250 mmHg or greater and/or diastolic of 130 mmHg or greater", "160 mmHg or greater and/or diastolic of 100 mmHg or greater", "220 mmHg or greater and/or diastolic of 140 mmHg or greater"], "correct": 2, "explain": "Per the slides: 'A hypertensive crisis is said to exist when the SBP is 250 mmHg or greater and/or the DBP is 130 mmHg or greater.' Hypertensive crises are most likely to occur in patients with chronic, stable hypertension. The goal in management is to avoid rapid changes in blood pressure without compromising cerebral perfusion. It is important to distinguish whether the cause is cardiac or non-cardiac."}, {"q": "Muscle relaxant drugs interfere with impulse transmission at the neuromuscular junction. Succinylcholine is an example of which type of neuromuscular block?", "choices": ["Deficiency block", "Nondepolarizing (competitive) block", "Depolarizing block", "Dual block (desensitization block)", "Central block"], "correct": 2, "explain": "Per the slides, succinylcholine produces a DEPOLARIZING block — 'the drug acts in a manner similar to acetylcholine but for a prolonged period of time.' Nondepolarizing (competitive) block: drug attaches to cholinergic receptors preventing ACh from binding (e.g., curare, pancuronium). Deficiency block: ACh synthesis/transmission is interfered with (neomycin, kanamycin, botulinum toxin). Dual block: depolarization followed by repolarization with nondepolarizing phase."}, {"q": "The main advantage of alfentanil, sufentanil, and remifentanil over fentanyl is:", "choices": ["Greater analgesic potency", "Shorter duration of action", "Less respiratory depression", "Ability to reverse with flumazenil", "Oral bioavailability"], "correct": 1, "explain": "Per the slides: 'Main advantage over fentanyl are the shorter durations of action.' Half-life comparison: fentanyl ~30 minutes, sufentanil ~15 minutes, alfentanil ~10 minutes, remifentanil — very brief (metabolized by nonspecific plasma esterases). This makes them ideal for procedures requiring precise control of analgesia duration. A — while some are more potent, that's not the stated main advantage. C is wrong. D is wrong — all are reversed by naloxone. E is wrong."}, {"q": "Remifentanil has a uniquely brief duration of action because it is metabolized by:", "choices": ["Hepatic cytochrome P450 enzymes", "Renal tubular secretion", "Nonspecific plasma esterases", "Monoamine oxidase", "Acetylcholinesterase"], "correct": 2, "explain": "Per the slides: 'Remifentanil is metabolized by nonspecific plasma esterases and its effects are very brief.' This unique metabolism makes remifentanil's duration independent of hepatic or renal function, and its effects terminate rapidly regardless of infusion duration — unlike fentanyl and other opioids that accumulate with prolonged administration."}, {"q": "Emphysema is a pulmonary condition characterized by which set of physical exam findings?", "choices": ["Decreased breath sounds, increased fremitus, dullness on percussion", "Wheezing, prolonged expiratory phase, tachypnea", "Decreased breath sounds, decreased fremitus, hyperresonance on percussion, barrel chest", "Crackles at lung bases, S3 heart sound, dyspnea", "Absent breath sounds unilaterally, tracheal deviation"], "correct": 2, "explain": "Emphysema is a chronic obstructive pulmonary disease with destruction of alveolar walls and air trapping. Findings include: decreased breath sounds (air trapping reduces transmission), decreased fremitus (hyperinflated lungs transmit vibrations poorly), hyperresonance on percussion (excess air), and barrel chest (increased AP diameter). A describes pneumonia. B describes asthma. D describes CHF. E describes tension pneumothorax."}, {"q": "An echocardiogram is the diagnostic test of choice for evaluating:", "choices": ["Pulmonary embolism", "Heart murmurs", "Cardiac dysrhythmias", "Peripheral vascular disease", "Carotid artery stenosis"], "correct": 1, "explain": "Per the slides: 'Echocardiogram is the diagnostic test of choice for heart murmurs. Echo (ultrasound) cardiogram (heart) = ultrasound of the heart.' It provides information about valvular structure and function, chamber sizes, wall motion, and ejection fraction. A — CT angiography is preferred for PE. C — ECG/Holter monitor for dysrhythmias. D — duplex ultrasound for PVD. E — carotid duplex for carotid stenosis."}, {"q": "The non-rebreathing valve on N₂O/O₂ equipment serves to:", "choices": ["Prevent the patient from rebreathing exhaled gases", "Shut off N₂O when O₂ pressure drops", "Limit N₂O to maximum 70%", "Scavenge waste anesthetic gases", "Measure the concentration of delivered gases"], "correct": 0, "explain": "The non-rebreathing valve ensures that exhaled gases (containing CO₂ and waste N₂O) are directed to the scavenging system rather than being rebreathed by the patient. This is important for both patient safety (preventing CO₂ rebreathing) and occupational safety (directing waste N₂O to the scavenging system). B describes the fail-safe. C describes the percentage delivery mechanism. D describes the scavenging system. E describes the flowmeter."}, {"q": "A medical consult for a dental patient with cardiac history should include inquiries about all of the following EXCEPT:", "choices": ["Current medications and dosages", "Functional capacity and exercise tolerance", "Dental insurance coverage", "Most recent cardiac evaluation and findings", "Clearance for the planned dental procedure"], "correct": 2, "explain": "Per the slides, a medical consult should address: the patient's current medical status, medications, functional capacity, recent evaluations, and whether the patient is cleared for the proposed treatment. Dental insurance coverage is an administrative matter, not a medical consultation question. The consult helps the dentist determine ASA classification, need for prophylaxis, medication modifications, and procedural precautions."}, {"q": "During which type of dental procedures is antibiotic prophylaxis for infective endocarditis recommended?", "choices": ["All dental procedures including routine exams", "Only extractions and implant placement", "Procedures that involve manipulation of gingival tissue, periapical region, or perforation of oral mucosa", "Only procedures lasting longer than 60 minutes", "Only procedures performed under general anesthesia"], "correct": 2, "explain": "Per AHA guidelines in the slides, IE prophylaxis is recommended for dental procedures involving 'manipulation of gingival tissue or the periapical region of teeth or perforation of the oral mucosa' in patients with qualifying cardiac conditions. Routine anesthetic injections through non-infected tissue, taking dental radiographs, and placement of removable prosthodontic appliances do NOT require prophylaxis. The key is tissue manipulation, not procedure type or duration."}, {"q": "Splitting of the S2 heart sound is associated with:", "choices": ["Aortic stenosis", "Mitral regurgitation", "Normal physiologic variant during inspiration", "Congestive heart failure exclusively", "Ventricular septal defect"], "correct": 2, "explain": "Per the slides, splitting of S2 is listed among adventitious heart sounds to understand. Physiologic splitting of S2 occurs during inspiration — increased venous return delays pulmonic valve closure, causing a brief split between aortic (A2) and pulmonic (P2) components. Fixed splitting suggests ASD. Paradoxical splitting suggests LBBB or aortic stenosis. Physiologic splitting is a normal variant and does not indicate pathology."}, {"q": "Which of the following is an absolute contraindication to N₂O/O₂ sedation that was NOT listed in the previous exam questions?", "choices": ["Anxiety", "Asthma", "Suspected or known pernicious anemia or B12 deficiency", "Cardiovascular disease", "Gagging"], "correct": 2, "explain": "Per the slides, absolute contraindications include: pneumothorax, cystic fibrosis, COPD, recent pneumoencephalography, suspected/known pernicious anemia or B12 deficiency, significant bowel obstruction, and current/recovering substance abuse. B12 deficiency is critical because N₂O oxidizes B12, impairing methionine synthase needed for DNA production. Anxiety, asthma, cardiovascular disease, and gagging are INDICATIONS, not contraindications."}, {"q": "Propofol is noted in the slides to have which primary side effect?", "choices": ["Hangover effect", "Pain on injection", "Bronchospasm", "Emergence dysphoria", "Malignant hyperthermia"], "correct": 1, "explain": "Per the slides, propofol is 'noted to have insignificant cardiovascular and respiratory effects. The primary side effect is pain on injection.' Despite this, propofol offers major advantages: rapid induction/emergence, postoperative antiemetic properties, less hangover than barbiturates, and duration paralleling methohexital. A is a barbiturate side effect. C/D/E are not primary propofol concerns."}, {"q": "The slides state that anesthesia exists on a continuum, meaning:", "choices": ["Each sedation level is completely distinct and cannot transition to another", "A patient can easily move from deep sedation to general anesthesia", "Minimal sedation always progresses to moderate sedation", "General anesthesia cannot be reversed", "Once sedated, patients cannot become more deeply sedated"], "correct": 1, "explain": "Per the slides: 'Anesthesia is a continuum: Can easily move from a deep sedation to GA.' This is a critical safety concept — any practitioner providing sedation must be prepared to manage a patient at one level deeper than intended. This is why rescue training, monitoring, and emergency equipment are required at every sedation level. A/C/D/E misrepresent the continuum concept."}];

const letters = ['A','B','C','D','E'];

function buildPractice(){
const c = document.getElementById('practice-view');
let h = `<div class="score-bar"><div><span>Score: </span><span class="score-num" id="score-display">0 / 0</span><span style="margin-left:12px;font-size:12px" id="pct-display"></span></div><button onclick="resetAll()">Reset All</button></div>`;
defined_questions.forEach((q,i)=>{
h += `<div class="q-block" id="qp${i}"><div class="q-header"><div class="q-num">Question ${i+1} of ${defined_questions.length}</div><div class="q-text">${q.q}</div></div><div class="choices">`;
q.choices.forEach((ch,j)=>{
h += `<div class="choice" data-qi="${i}" data-ci="${j}" onclick="selectChoice(${i},${j})"><div class="choice-letter">${letters[j]}</div><div class="choice-text">${ch}</div></div>`;
});
h += `</div><div class="explain-box" id="exp${i}"><div class="explain-label">Explanation</div><div class="explain-text">${q.explain}</div></div></div>`;
});
c.innerHTML = h;
}

function buildKey(){
const c = document.getElementById('key-view');
let h = '';
defined_questions.forEach((q,i)=>{
h += `<div class="q-block answer-key"><div class="q-header"><div class="q-num">Question ${i+1}</div><div class="q-text">${q.q}</div></div><div class="choices">`;
q.choices.forEach((ch,j)=>{
const cls = j === q.correct ? 'correct-show' : '';
h += `<div class="choice ${cls}"><div class="choice-letter">${letters[j]}</div><div class="choice-text">${ch}</div></div>`;
});
h += `</div><div class="explain-box show"><div class="explain-label">Correct: ${letters[q.correct]} — Explanation</div><div class="explain-text">${q.explain}</div></div></div>`;
});
c.innerHTML = h;
}

let answered = {};
let totalCorrect = 0;
let totalAnswered = 0;

function selectChoice(qi, ci){
if(answered[qi] !== undefined) return;
answered[qi] = ci;
const correct = defined_questions[qi].correct;
const block = document.getElementById('qp'+qi);
const choices = block.querySelectorAll('.choice');
choices.forEach((ch,j)=>{
ch.style.cursor = 'default';
if(j === correct) ch.classList.add('correct-show');
if(j === ci && ci !== correct) ch.classList.add('wrong-show');
});
document.getElementById('exp'+qi).classList.add('show');
totalAnswered++;
if(ci === correct) totalCorrect++;
document.getElementById('score-display').textContent = totalCorrect + ' / ' + totalAnswered;
const pct = Math.round((totalCorrect/totalAnswered)*100);
document.getElementById('pct-display').textContent = '(' + pct + '%)';
}

function resetAll(){
answered = {};
totalCorrect = 0;
totalAnswered = 0;
buildPractice();
}

function switchTab(tab){
document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
if(tab === 'practice'){
document.querySelectorAll('.tab')[0].classList.add('active');
document.getElementById('practice-view').classList.remove('hidden');
document.getElementById('key-view').classList.add('hidden');
} else {
document.querySelectorAll('.tab')[1].classList.add('active');
document.getElementById('key-view').classList.remove('hidden');
document.getElementById('practice-view').classList.add('hidden');
}
}

buildPractice();
buildKey();
</script>
