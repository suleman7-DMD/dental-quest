<script>
const defined_questions = [{"q": "Dysphoric emergence reactions associated with ketamine administration can be reduced by pretreatment with which of the following?", "choices": ["Acetaminophen and ibuprofen", "Propofol, benzodiazepines, or barbiturates", "Naloxone and flumazenil", "Atropine and scopolamine", "Epinephrine and diphenhydramine"], "correct": 1, "explain": "Ketamine can produce unpleasant emergence reactions including agitation, vivid dreams, and dysphoria. Per the lecture slides, benzodiazepines (particularly midazolam) are ‘commonly given before ketamine to decrease the incidence of emergence agitation and dysphoria.’ Propofol and barbiturates can also blunt these effects through their CNS-depressant properties. A is wrong — NSAIDs/analgesics have no effect on emergence dysphoria. C is wrong — naloxone reverses opioids and flumazenil reverses benzodiazepines; neither targets ketamine effects. D is wrong — anticholinergics reduce secretions but do not prevent dysphoric emergence. E is wrong — epinephrine and diphenhydramine are for allergic/anaphylactic emergencies."}, {"q": "Which of the following is a well-known side effect of barbiturate administration?", "choices": ["Bronchospasm", "Hangover effect", "Anterograde amnesia", "Analgesia", "Malignant hyperthermia"], "correct": 1, "explain": "Barbiturates are generalized CNS depressants that can produce a ‘hangover’ effect — residual drowsiness, lethargy, and impaired psychomotor function that persists after the sedative effects have worn off. The slides specifically list ‘hangover’ as a side effect of barbiturates. A is wrong — barbiturates do not typically cause bronchospasm. C is wrong — anterograde amnesia is primarily associated with benzodiazepines (especially midazolam). D is wrong — the slides explicitly state ‘barbiturates have no effect on pain.’ E is wrong — malignant hyperthermia is associated with volatile inhalation anesthetics and succinylcholine, not barbiturates."}, {"q": "Rapid intravenous injection of which of the following general anesthetic agents can cause chest wall rigidity?", "choices": ["Midazolam", "Propofol", "Ketamine", "Fentanyl", "Thiopental"], "correct": 3, "explain": "Fentanyl (Sublimaze) is an opioid agonist that, when administered by rapid IV injection, can cause ‘muscle and chest wall rigidity’ as noted directly in the lecture slides. This phenomenon, sometimes called ‘wooden chest syndrome,’ can severely impair ventilation and requires immediate intervention including neuromuscular blocking agents. A is wrong — midazolam is a benzodiazepine that causes sedation and amnesia, not chest wall rigidity. B is wrong — propofol can cause respiratory depression and hypotension but not rigidity. C is wrong — ketamine increases muscle tone but does not cause the characteristic chest wall rigidity seen with opioids. E is wrong — thiopental is a barbiturate that causes CNS depression, not rigidity."}, {"q": "Which of the following is NOT typically associated with acute pain?", "choices": ["Tissue damage", "Anxiety", "Fight-or-flight physiologic response", "Depression", "Tachycardia"], "correct": 3, "explain": "Acute pain is associated with tissue damage, sympathetic nervous system activation (fight-or-flight response producing tachycardia, hypertension, diaphoresis), and anxiety. Depression, however, is characteristically associated with chronic pain, not acute pain. Chronic pain can lead to psychosocial changes including depression, sleep disturbance, and functional impairment. A is wrong — tissue damage is the primary trigger for acute pain. B is wrong — anxiety is a hallmark of acute pain. C is wrong — the sympathetic fight-or-flight response is a classic acute pain feature. E is wrong — tachycardia results from the sympathetic activation in acute pain."}, {"q": "What is the specific pharmacologic antidote (antagonist) for benzodiazepine overdose or reversal?", "choices": ["Naloxone", "Atropine", "Flumazenil", "Epinephrine", "Sugammadex"], "correct": 2, "explain": "Flumazenil is the specific benzodiazepine antagonist used to reverse the sedative, amnestic, and respiratory depressant effects of benzodiazepines. It is contraindicated in patients with allergy to flumazenil, those on chronic benzodiazepine therapy (risk of seizures), and patients with known seizure disorders. A is wrong — naloxone is the opioid antagonist. B is wrong — atropine is an anticholinergic used for bradycardia. D is wrong — epinephrine is used for anaphylaxis and cardiac arrest. E is wrong — sugammadex reverses neuromuscular blocking agents (rocuronium/vecuronium)."}, {"q": "Who provided much of the groundwork for the future of intravenous medication by demonstrating that blood circulates continuously within a closed system?", "choices": ["Crawford Long", "Horace Wells", "William Harvey", "William Morton", "Karl Koller"], "correct": 2, "explain": "William Harvey demonstrated for the first time that blood flows in a continuous, unidirectional circulation within a closed system, and that valves within the heart and veins ensure this unidirectional flow. This foundational understanding of the circulatory system was essential to the later development of intravenous drug delivery. A is wrong — Crawford Long is credited with early ether anesthesia. B is wrong — Horace Wells pioneered nitrous oxide use in dentistry. D is wrong — William Morton demonstrated ether anesthesia publicly. E is wrong — Karl Koller introduced cocaine as a local anesthetic in ophthalmology."}, {"q": "Which of the following is a recognized disadvantage of intravenous (IV) sedation?", "choices": ["Slow onset of action", "Inability to titrate drug dosage", "Venipuncture is necessary", "Complete patient cooperation is required", "Recovery is always immediate"], "correct": 2, "explain": "Per the lecture slides, the disadvantages of IV sedation include: (1) venipuncture is necessary, (2) complications may arise at the venipuncture site, (3) monitoring must be more intensive than other conscious sedation techniques, (4) recovery is not complete — an escort is needed, and (5) most IV agents cannot be reversed. A is wrong — rapid onset is actually an advantage of IV sedation. B is wrong — excellent titrability is a major advantage of IV sedation. D is wrong — patient cooperation is less essential with IV sedation (listed as an advantage). E is wrong — recovery is NOT immediate; an escort is required."}, {"q": "Which of the following is NOT an indication for intravenous sedation?", "choices": ["Medically compromised patients (e.g., epilepsy, previous MI)", "Diminished gagging", "Hepatic disease", "Anxiety", "Need for amnesia"], "correct": 2, "explain": "Hepatic disease is listed as a CONTRAINDICATION for IV sedation — not an indication — because most IV sedation drugs are metabolized by the liver. Impaired hepatic function can lead to prolonged drug effects, accumulation, and toxicity. The indications for IV sedation include anxiety, amnesia, medically compromised patients (angina, hypertension, previous MI, CVA, epilepsy), control of secretions, analgesia, and diminished gagging. A is true — medically compromised patients benefit from the stress-reducing effects of IV sedation. B is true — gagging is diminished with IV sedation. D and E are true — anxiety control and amnesia are primary indications."}, {"q": "What is the primary advantage of midazolam (Versed) over diazepam (Valium) for IV sedation?", "choices": ["Greater analgesic effect", "Longer half-life", "Greater amnesia", "Lower cost", "Less respiratory depression"], "correct": 2, "explain": "The lecture comparison table rates midazolam as +++ for amnesia (anterograde) versus + for diazepam. Additionally, midazolam is 2–3 times more potent than diazepam, produces less pain on IV injection (diazepam uses propylene glycol which is irritating), produces inactive metabolites (vs. active metabolites for diazepam), and has a shorter half-life (1.7–2.4 hrs vs. 31.3 hrs). A is wrong — neither drug provides significant analgesia. B is wrong — midazolam actually has a much shorter half-life, which is advantageous. D is wrong — cost is not a distinguishing clinical advantage discussed in the slides. E is wrong — the slides rate midazolam as + and diazepam as ++ for respiratory depression, but the primary distinguishing advantage emphasized is amnesia."}, {"q": "Which inhalation anesthetic agent is most commonly used in ambulatory dental anesthesia cases?", "choices": ["Halothane", "Enflurane", "Isoflurane", "Sevoflurane", "Desflurane"], "correct": 3, "explain": "The lecture slides state directly that sevoflurane ‘is a commonly used inhalation anesthetic in ambulatory dental anesthesia cases.’ It is noted for its low blood-gas solubility, rapid induction and emergence, minimal airway irritation compared to other agents, and a MAC of 1.71%. A is wrong — halothane is largely obsolete due to hepatotoxicity risk and cardiac sensitization to catecholamines. B is wrong — enflurane is ‘rarely used today.’ C is wrong — isoflurane is used but is more irritating to the airway than sevoflurane. E is wrong — desflurane is not recommended for induction due to its unpleasant odor and airway irritation."}, {"q": "Which of the following IV general anesthetic agents is used in asthmatic patients specifically because of its bronchodilating properties?", "choices": ["Propofol", "Thiopental", "Midazolam", "Ketamine", "Fentanyl"], "correct": 3, "explain": "The lecture slides state directly: Ketamine is ‘used in asthmatic patients because of its bronchodilating properties.’ Ketamine is a dissociative anesthetic that relaxes bronchial smooth muscle, making it particularly advantageous in patients with reactive airway disease or active bronchospasm. A is wrong — propofol does not have specific bronchodilating properties. B is wrong — thiopental (a barbiturate) can cause histamine release and potentially worsen bronchospasm. C is wrong — midazolam is a benzodiazepine without bronchodilating effects. E is wrong — fentanyl is an opioid with no bronchodilating properties."}, {"q": "Which physical examination test is used to assess the adequacy of arterial blood flow through both the radial and ulnar arteries to the hand?", "choices": ["Phalen’s test", "Tinel’s sign", "Allen’s test", "Adson’s test", "Finkelstein’s test"], "correct": 2, "explain": "Allen’s test evaluates the patency of the radial and ulnar arteries and the adequacy of collateral circulation to the hand via the palmar arches. It is performed by having the patient make a fist while the examiner occludes both arteries, then releasing one artery at a time to confirm reperfusion. This is essential before radial artery cannulation or when considering the radial artery for IV access. A is wrong — Phalen’s test evaluates carpal tunnel syndrome. B is wrong — Tinel’s sign tests for nerve regeneration or entrapment. D is wrong — Adson’s test evaluates thoracic outlet syndrome. E is wrong — Finkelstein’s test evaluates de Quervain’s tenosynovitis."}, {"q": "Episodes of sharply demarcated pallor of the fingers that are aggravated by exposure to cold are characteristic of which condition?", "choices": ["Peripheral arterial disease", "Deep vein thrombosis", "Raynaud’s disease", "Buerger’s disease", "Chronic venous insufficiency"], "correct": 2, "explain": "Raynaud’s disease (Raynaud’s phenomenon) involves episodic vasospasm of the small arteries and arterioles of the fingers (and sometimes toes), triggered by cold exposure or emotional stress. It produces the classic triphasic color change: white (pallor from ischemia) → blue (cyanosis) → red (reperfusion hyperemia). The sharply demarcated pallor of the digits is the hallmark finding. A is wrong — PAD typically presents with intermittent claudication and diminished pulses, not episodic pallor with cold triggers. B is wrong — DVT presents with edema, warmth, and calf pain. D is wrong — Buerger’s disease (thromboangiitis obliterans) is associated with smoking and affects small/medium vessels, but presents with ischemic ulcers, not episodic pallor. E is wrong — CVI presents with chronic edema, skin changes, and ulceration."}, {"q": "Chronic edema that is soft with pitting, accompanied by skin pigmentation and possible ulceration, is seen in which condition?", "choices": ["Lymphedema", "Deep vein thrombosis", "Congestive heart failure", "Chronic venous insufficiency", "Nephrotic syndrome"], "correct": 3, "explain": "Chronic venous insufficiency (CVI) results from incompetent venous valves and sustained venous hypertension in the lower extremities. It presents with chronic, soft, pitting edema; hemosiderin deposition causing brown pigmentation of the skin (especially around the medial malleolus); and potentially venous stasis ulceration. A is wrong — lymphedema is typically non-pitting and does not cause hemosiderin pigmentation. B is wrong — DVT is an acute process with sudden swelling, not chronic pigmentation changes. C is wrong — CHF edema is bilateral and pitting but typically without the brown pigmentation or ulceration pattern. E is wrong — nephrotic syndrome edema is generalized and periorbital, not localized with pigmentation."}, {"q": "Which venipuncture site has the greatest proximity to important anatomical structures, making it the LEAST preferred site?", "choices": ["Dorsum of hand", "Ventral forearm", "Dorsal wrist", "Lateral antecubital fossa", "Medial antecubital fossa"], "correct": 4, "explain": "Per the Malamed comparison table (Table 3-1) in the lecture slides, the medial antecubital fossa is the ONLY venipuncture site marked ‘Yes’ for proximity to important anatomical structures (specifically the brachial artery and median nerve). The order of preference from the slides is: (1) dorsum of hand, (2) ventral forearm, (3) lateral antecubital fossa, (4) dorsal wrist, (5) medial antecubital fossa (least preferred). A, B, C, and D are all marked ‘No’ for proximity to important anatomical structures. The medial antecubital fossa is listed last in the preference order specifically because of this risk."}, {"q": "When comparing intramuscular injection sites in adults, which site allows the greatest volume of drug to be injected?", "choices": ["Deltoid", "Vastus lateralis", "Ventrogluteal", "Dorsogluteal", "All sites allow equal volumes"], "correct": 1, "explain": "The Malamed comparison table (Table 10-1) shows that in adults, the vastus lateralis allows the greatest volume of drug to be injected (up to 4–5 mL). The deltoid is the most commonly used site for IM injections but allows a smaller maximum volume (typically 1–2 mL). The vastus lateralis also has the advantage of being appropriate across all age groups (infants, children, and adults). A is wrong — the deltoid allows the smallest maximum volume in adults. C and D are wrong — gluteal sites allow moderate volumes but less than the vastus lateralis. E is wrong — maximum volumes differ significantly among sites."}, {"q": "Which of the following statements about naloxone is TRUE?", "choices": ["It is a benzodiazepine antagonist", "Its duration of action lasts approximately 30 to 90 minutes", "It is given orally for optimal effect", "The maximum adult dose is 5.0 mg", "It has intrinsic analgesic properties"], "correct": 1, "explain": "Naloxone is a pure opioid antagonist with a duration of action of approximately 30–90 minutes, which is shorter than most opioids it is used to reverse. This is clinically critical because renarcotization can occur — the opioid outlasts the antagonist, and the patient may re-sedate after the naloxone wears off. The IV dose is 0.1–0.2 mg at 2–3 minute intervals, with an average reversal dose of 0.4 mg and a maximum of 1.2 mg in adults. A is wrong — flumazenil is the benzodiazepine antagonist; naloxone reverses opioids. C is wrong — naloxone is given IV, IM, or SC. D is wrong — the max total adult dose is 1.2 mg. E is wrong — naloxone has no analgesic properties; it is a pure antagonist."}, {"q": "A patient taking warfarin (Coumadin), digoxin, and lithium requires pain relief after a dental procedure. Which of the following analgesics would be the SAFEST choice?", "choices": ["Meperidine (Demerol)", "Aspirin (ASA)", "Ibuprofen (Motrin)", "Acetaminophen (Tylenol)", "Naproxen (Aleve)"], "correct": 3, "explain": "Acetaminophen is the safest analgesic for this patient. Aspirin and NSAIDs (ibuprofen, naproxen) are contraindicated because they inhibit platelet function and increase bleeding risk in a patient already anticoagulated with warfarin. NSAIDs also increase lithium levels by reducing renal lithium clearance. Meperidine has dangerous drug interactions and CNS side effects. Acetaminophen at therapeutic doses does not significantly affect coagulation, lithium levels, or digoxin metabolism. A is wrong — meperidine has multiple drug interactions and CNS toxicity risk. B is wrong — aspirin irreversibly inhibits platelets and potentiates warfarin’s anticoagulant effect. C and E are wrong — NSAIDs increase bleeding risk with warfarin AND raise lithium levels."}, {"q": "Among the following oral opioid analgesics, which is considered the most potent?", "choices": ["Codeine", "Hydrocodone", "Tramadol", "Oxycodone", "Meperidine"], "correct": 3, "explain": "Oxycodone is considered the most potent of the commonly prescribed oral opioid analgesics listed. It is approximately 1.5 times more potent than morphine on a milligram-per-milligram basis when given orally. The relative potency ranking from least to most: codeine < tramadol < hydrocodone < oxycodone. A is wrong — codeine is a weak opioid, often considered the least potent. B is wrong — hydrocodone is moderately potent but less than oxycodone. C is wrong — tramadol is a weak opioid with additional serotonin-norepinephrine reuptake inhibition. E is wrong — meperidine (oral) is less potent and has unfavorable metabolite accumulation (normeperidine)."}, {"q": "Among inhalation anesthetic agents, which is the LEAST potent (has the highest MAC value)?", "choices": ["Halothane", "Isoflurane", "Sevoflurane", "Nitrous oxide (N₂O)", "Desflurane"], "correct": 3, "explain": "MAC (Minimum Alveolar Concentration) is inversely related to potency — a higher MAC means a less potent agent. N₂O has a MAC of approximately 104%, making it the least potent inhalation anesthetic. It cannot achieve surgical anesthesia on its own at atmospheric pressure. By comparison: halothane MAC ~0.75%, isoflurane ~1.28%, sevoflurane ~1.71%, desflurane ~4.6–6.0%. A is wrong — halothane has the lowest MAC (~0.75%), making it the MOST potent. B is wrong — isoflurane MAC is 1.28%. C is wrong — sevoflurane MAC is 1.71%. E is wrong — desflurane has a high MAC (4.6–6.0%) but is still far below N₂O’s 104%."}, {"q": "Hydroxyzine (Vistaril/Atarax) belongs to which drug class?", "choices": ["Benzodiazepine", "Barbiturate", "Antihistamine", "Opioid agonist", "Anticholinergic"], "correct": 2, "explain": "Hydroxyzine is a first-generation antihistamine (H1-receptor antagonist) with sedative, anxiolytic, antiemetic, and antipruritic properties. It is sometimes used as a premedication for sedation procedures because of its ability to reduce anxiety and nausea without significant respiratory depression. It also potentiates the effects of opioids and other CNS depressants. A is wrong — hydroxyzine is not a benzodiazepine, though it has anxiolytic effects. B is wrong — it is not a barbiturate. D is wrong — it has no opioid agonist activity. E is wrong — while hydroxyzine does have some anticholinergic side effects, its primary classification is as an antihistamine."}, {"q": "A holosystolic (pansystolic) murmur is characteristically heard in which of the following conditions?", "choices": ["Aortic stenosis", "Mitral stenosis", "Ventricular septal defect (VSD)", "Aortic regurgitation", "Pulmonic stenosis"], "correct": 2, "explain": "Per the lecture slides, pansystolic (holosystolic) murmurs are ‘caused by flow from a high pressure chamber to a low pressure chamber’ and are associated with ventricular septal defect (VSD), mitral regurgitation, and tricuspid regurgitation. A VSD produces a holosystolic murmur best heard at the left lower sternal border. A is wrong — aortic stenosis produces a crescendo-decrescendo (ejection) systolic murmur. B is wrong — mitral stenosis produces a diastolic murmur (low-pitched rumble). D is wrong — aortic regurgitation produces a diastolic decrescendo murmur. E is wrong — pulmonic stenosis produces a systolic ejection murmur."}, {"q": "Deep and rapid breathing (hyperpnea) occurring inappropriately is characteristic of which respiratory pattern?", "choices": ["Cheyne-Stokes respiration", "Kussmaul breathing", "Hyperventilation", "Apnea", "Biot’s respiration"], "correct": 2, "explain": "The lecture slides identify hyperventilation as ‘rapid deep breathing.’ Hyperventilation is characterized by a respiratory rate and/or tidal volume that exceeds metabolic demands, leading to excessive CO₂ elimination and respiratory alkalosis. It commonly occurs in anxious dental patients and presents with lightheadedness, tingling in extremities, and perioral numbness. A is wrong — Cheyne-Stokes is a cyclical crescendo-decrescendo pattern with apneic periods. B is partially correct — Kussmaul breathing is also deep and rapid but is specifically associated with metabolic acidosis (e.g., diabetic ketoacidosis), not anxiety-driven breathing. D is wrong — apnea is cessation of breathing. E is wrong — Biot’s respiration is irregular with clusters of breaths and apneic periods."}, {"q": "A patient presents with decreased breath sounds, increased fremitus, egophony, bronchophony, pectoriloquy, and dullness on percussion. These findings are most consistent with which pulmonary condition?", "choices": ["Asthma", "Emphysema", "Pneumothorax", "Pneumonia", "Congestive heart failure"], "correct": 3, "explain": "The lecture slides list the findings for pneumonia as: decreased breath sounds, increased fremitus, egophony, bronchophony, pectoriloquy, and dullness on percussion. Pneumonia is an acute inflammation of the lungs where consolidation (fluid/exudate filling the alveoli) causes enhanced sound transmission — hence increased tactile fremitus and the voice-related findings (egophony, bronchophony, pectoriloquy). A is wrong — asthma presents with wheezes and prolonged expiratory phase. B is wrong — emphysema presents with decreased breath sounds, decreased fremitus, and hyperresonance. C is wrong — pneumothorax presents with absent breath sounds and hyperresonance (opposite of dullness). E is wrong — CHF presents with crackles (rales), not the consolidation findings described."}, {"q": "A patient presents with decreased or absent breath sounds and hyperresonance on percussion. These findings are most consistent with which condition?", "choices": ["Pneumonia", "Pneumothorax", "Congestive heart failure", "Asthma", "Pleural effusion"], "correct": 1, "explain": "The lecture slides describe pneumothorax as: ‘collapse of the lung,’ ‘decreased or absent breath sounds,’ and ‘hyperresonance on percussion.’ Air in the pleural space separates the lung from the chest wall, eliminating sound transmission (absent breath sounds) and creating a hyperresonant percussion note from the air-filled space. A is wrong — pneumonia shows dullness on percussion and increased fremitus. C is wrong — CHF shows crackles and possibly dullness at bases from effusion. D is wrong — asthma shows wheezes with generally preserved breath sounds. E is wrong — pleural effusion shows dullness on percussion (fluid, not air)."}, {"q": "A drug-induced depression of consciousness during which patients respond purposefully to verbal commands, either alone or accompanied by light tactile stimulation, no interventions are required to maintain a patent airway, spontaneous ventilation is adequate, and cardiovascular function is usually maintained. This definition describes which level of sedation?", "choices": ["Minimal sedation (anxiolysis)", "Moderate sedation (conscious sedation)", "Deep sedation", "General anesthesia", "Dissociative anesthesia"], "correct": 1, "explain": "This is the exact definition of moderate sedation (conscious sedation) directly from the lecture slides. The key features are: purposeful response to verbal commands ± light tactile stimulation, no airway interventions needed, adequate spontaneous ventilation, and cardiovascular function usually maintained. A is wrong — minimal sedation retains the patient’s ability to respond normally to verbal command with unaffected ventilatory and cardiovascular function (a higher level of consciousness). C is wrong — deep sedation means patients cannot be easily aroused and respond only to repeated or painful stimulation; spontaneous ventilation may be inadequate. D is wrong — general anesthesia means patients are not arousable even by painful stimulation. E is wrong — dissociative anesthesia (ketamine) is a separate category with a cataleptic state."}, {"q": "How is nitrous oxide (N₂O) primarily eliminated from the body?", "choices": ["Hepatic metabolism followed by renal excretion", "Metabolism by plasma esterases", "Excreted unchanged through the lungs", "Conjugated in the liver and excreted in bile", "Metabolized by the kidneys and excreted in urine"], "correct": 2, "explain": "The lecture slides state: ‘N₂O is not metabolized in the liver, nor does it affect the liver in the presence of liver impairment.’ N₂O is excreted unchanged through the lungs — it undergoes essentially no biotransformation in the body. This is why hepatic disease is NOT a contraindication for N₂O use (unlike IV sedation agents that require hepatic metabolism). A is wrong — N₂O is not metabolized by the liver. B is wrong — plasma esterases metabolize drugs like succinylcholine and ester local anesthetics, not N₂O. D is wrong — there is no hepatic conjugation of N₂O. E is wrong — the kidneys play no role in N₂O elimination."}, {"q": "A patient with acute sinusitis and significant nasal congestion presents for a procedure in which you planned to use nitrous oxide–oxygen sedation. What is the most appropriate course of action?", "choices": ["Proceed with N₂O/O₂ sedation using a higher flow rate", "Administer a nasal decongestant and proceed immediately", "Switch to oral sedation for this appointment", "Reschedule the procedure until the sinusitis has resolved", "Use a full-face mask instead of a nasal hood"], "correct": 3, "explain": "N₂O/O₂ sedation requires adequate nasal breathing since the gas is delivered through a nasal hood. Acute sinusitis and nasal congestion prevent effective gas exchange through the nose, making sedation ineffective and potentially trapping gas in the obstructed sinuses (causing pain upon expansion of trapped gas). The slides state that N₂O/O₂ is contraindicated for patients experiencing acute sinusitis or upper respiratory tract disease. A is wrong — higher flow won’t overcome nasal obstruction. B is wrong — a decongestant alone doesn’t adequately address the contraindication. C is partially reasonable but the best answer is to reschedule. E is wrong — N₂O in dental settings is delivered via nasal hood, not a full-face mask in standard practice."}, {"q": "Which of the following is NOT a contraindication to nitrous oxide–oxygen sedation?", "choices": ["COPD", "Malignant hyperthermia", "Cystic fibrosis", "Pneumothorax", "Significant bowel obstruction"], "correct": 1, "explain": "The lecture slides explicitly state: ‘N₂O/O₂ sedation is NOT considered a trigger for malignant hyperthermia, and can be safely administered to MH-susceptible individuals.’ Malignant hyperthermia is triggered by volatile inhalation anesthetics (sevoflurane, desflurane, isoflurane) and succinylcholine — not by N₂O. COPD, cystic fibrosis, pneumothorax, and significant bowel obstruction are all listed as absolute contraindications. A is wrong — COPD is an absolute contraindication (chronic air trapping + supplemental N₂O is dangerous). C is wrong — cystic fibrosis is an absolute contraindication. D is wrong — pneumothorax is an absolute contraindication (N₂O expands enclosed gas spaces). E is wrong — bowel obstruction is an absolute contraindication (N₂O expands trapped gas in the bowel)."}, {"q": "With modern N₂O/O₂ delivery systems, what is the maximum concentration of nitrous oxide that can be administered?", "choices": ["50%", "60%", "70%", "80%", "90%"], "correct": 2, "explain": "Modern N₂O/O₂ delivery systems are equipped with a percentage gas delivery mechanism that limits N₂O to a maximum of 70% and mandates a minimum of 30% oxygen at all times. This built-in safety feature prevents the practitioner from inadvertently delivering a hypoxic gas mixture to the patient. A and B are wrong — while some practitioners may titrate to these levels, the system maximum allows up to 70%. D and E are wrong — these would leave less than 30% oxygen, which is below the safety minimum and would create a hypoxic mixture."}, {"q": "The oxygen fail-safe mechanism on an N₂O/O₂ delivery system functions by:", "choices": ["Automatically increasing N₂O concentration if oxygen drops", "Sounding an alarm when oxygen levels fall below 50%", "Shutting off the flow of N₂O if oxygen pressure falls below a threshold", "Switching to room air delivery when oxygen tanks are empty", "Reducing the total gas flow rate proportionally"], "correct": 2, "explain": "The oxygen fail-safe mechanism ensures that N₂O is not delivered unless oxygen is flowing. If the oxygen supply pressure drops below a critical threshold, the fail-safe valve automatically shuts off the flow of N₂O or anesthetic gas, preventing delivery of a hypoxic gas mixture. This is one of several built-in safety features along with the pin index safety system and diameter index safety system. A is wrong — this would be the opposite of safe design. B is wrong — an alarm alone without shutoff would not prevent hypoxia. D is wrong — the system doesn’t switch to room air. E is wrong — simply reducing total flow wouldn’t prevent hypoxia."}, {"q": "What is the most common local complication associated with IV sedation (venipuncture)?", "choices": ["Air embolism", "Phlebitis", "Venospasm", "Hematoma", "Nerve injury"], "correct": 3, "explain": "Hematoma formation is the most common local complication of venipuncture. It occurs when blood leaks from the punctured vein into the surrounding tissue, causing swelling and discoloration. This is most commonly caused by through-and-through puncture of the vein, inadequate pressure applied after needle removal, or use of veins in the antecubital fossa where higher pressures exist. A is wrong — air embolism is rare but potentially serious. B is wrong — phlebitis (vein inflammation) can occur but is less common than hematoma. C is wrong — venospasm is a protective mechanism where the vein collapses; it’s less common. E is wrong — nerve injury is an uncommon complication."}, {"q": "During IV sedation, you successfully start an IV and begin working. Partway through the procedure, you reposition the patient to a more upright position and the IV stops running. What is the most likely cause?", "choices": ["Venospasm", "The IV catheter has become dislodged", "The IV infusion bag is now too close to the level of the heart", "The tourniquet was left on the arm", "Air has entered the IV line"], "correct": 2, "explain": "IV fluid flows by gravity. When the patient is repositioned upright, the IV bag may now be at or near the level of the patient’s heart, eliminating the hydrostatic pressure gradient needed for gravity-driven flow. The slides list ‘IV infusion bag too close to the heart level’ as a cause of a non-running IV. Simply raising the IV bag higher will restore flow. A is wrong — venospasm would not be specifically triggered by patient repositioning. B is wrong — simply sitting up shouldn’t dislodge a properly secured catheter. D is wrong — the tourniquet should have been removed immediately after successful cannulation. E is wrong — air entering the line doesn’t stop flow; it causes a different complication."}, {"q": "Which of the following statements about anatomical differences between children and adults is NOT true?", "choices": ["The pediatric larynx is more anterior and cephalad than in adults", "The pediatric tongue is proportionally larger relative to the oral cavity", "The pediatric larynx is more posterior compared to adults", "The narrowest part of the pediatric airway is at the cricoid cartilage", "Children have a proportionally larger head relative to body size"], "correct": 2, "explain": "The pediatric larynx is more ANTERIOR and cephalad (higher), NOT more posterior. This is a critical anatomical difference that affects airway management and intubation technique in children. Additional pediatric differences include: proportionally larger tongue and head, a funnel-shaped larynx (narrowest at the cricoid cartilage rather than the glottis as in adults), and a shorter trachea. A is true — the larynx sits higher and more anteriorly in children. B is true — the tongue is relatively larger, contributing to airway obstruction risk. D is true — unlike adults where the narrowest point is the glottis, in children it’s the cricoid ring. E is true — the head is proportionally larger, affecting positioning."}, {"q": "What is the first-line drug treatment for severe anaphylaxis?", "choices": ["Diphenhydramine (Benadryl) 50 mg IV", "Hydrocortisone 100 mg IV", "Epinephrine 0.3 mL of 1:1,000 IM", "Albuterol nebulizer", "Normal saline IV bolus"], "correct": 2, "explain": "Epinephrine is the first and most critical drug for treating anaphylaxis. The slides specify: ‘immediate administration of 0.3 mL of 1:1,000 epinephrine intramuscularly (0.15 mL for child; 0.075 mL for infant).’ Epinephrine reverses bronchospasm, improves blood pressure via vasoconstriction, and reduces mucosal edema. Delay in epinephrine administration is the primary cause of fatal anaphylaxis. A is wrong — diphenhydramine is adjunctive, not first-line. B is wrong — corticosteroids prevent biphasic reactions but have slow onset and are not first-line. D is wrong — albuterol may help bronchospasm but doesn’t address the systemic anaphylactic response. E is wrong — fluid resuscitation is supportive but secondary to epinephrine."}, {"q": "In the event of an inadvertent intra-arterial injection during IV sedation, you should do all of the following EXCEPT:", "choices": ["Leave the needle in place", "Dilute the intra-arterial drug with normal saline or local anesthetic", "Immediately remove the needle from the artery", "Administer a vasodilator if available", "Contact emergency medical services"], "correct": 2, "explain": "If intra-arterial injection is suspected, you should NOT remove the needle. The needle should be left in place to allow administration of diluting agents (normal saline, local anesthetic) and vasodilators directly into the artery to reduce vasospasm and dilute the injected drug, minimizing tissue ischemia. Removing the needle eliminates your direct access to reverse the damage. A is correct — the needle must stay in place for treatment access. B is correct — diluting the drug reduces concentration and irritation. D is correct — a vasodilator counteracts arterial spasm. E is correct — this is a serious emergency requiring advanced care."}, {"q": "Which oral sedative agent is known for being irritating to the skin and mucosal membranes, has an unpleasant taste, provides no analgesia, and has GI side effects?", "choices": ["Triazolam", "Diazepam", "Chloral hydrate", "Hydroxyzine", "Midazolam"], "correct": 2, "explain": "Chloral hydrate is one of the oldest sedative-hypnotic agents, historically used for pediatric sedation. It is known for its extremely unpleasant taste, irritation to skin and mucosal membranes, GI irritation (nausea, vomiting), and a narrow therapeutic index. It provides sedation and hypnosis but no analgesia. Due to safety concerns and availability of better alternatives, its use has significantly declined. A is wrong — triazolam is a benzodiazepine with no significant mucosal irritation. B is wrong — diazepam may cause GI effects but is not specifically known for mucosal irritation. D is wrong — hydroxyzine is an antihistamine that is generally well tolerated orally. E is wrong — midazolam has a bitter taste but is not primarily known for skin/mucosal irritation."}, {"q": "Which of the following statements about selective COX-2 inhibitors is NOT true?", "choices": ["They provide anti-inflammatory effects similar to traditional NSAIDs", "They have a reduced risk of GI ulceration compared to non-selective NSAIDs", "They decrease the incidence of myocardial infarction", "They selectively inhibit the cyclooxygenase-2 enzyme", "Some have been withdrawn from the market due to cardiovascular concerns"], "correct": 2, "explain": "Selective COX-2 inhibitors do NOT decrease MI incidence — in fact, they INCREASE cardiovascular risk. COX-2 inhibitors (e.g., rofecoxib/Vioxx, celecoxib/Celebrex) inhibit prostacyclin production without affecting thromboxane A₂, shifting the balance toward platelet aggregation and vasoconstriction. Rofecoxib was withdrawn from the market specifically because of increased risk of MI and stroke. A is true — they provide comparable anti-inflammatory effects. B is true — GI sparing is their primary advantage. D is true — selective COX-2 inhibition is their mechanism. E is true — rofecoxib was pulled for cardiovascular events."}, {"q": "A patient presents with an S3 heart sound, crackles at the lung bases, and dyspnea. These findings are most consistent with which condition?", "choices": ["Aortic stenosis", "Mitral valve prolapse", "Congestive heart failure (CHF)", "Pneumothorax", "Pulmonary embolism"], "correct": 2, "explain": "The triad of S3 heart sound, bilateral basilar crackles, and dyspnea is classic for congestive heart failure. The S3 (ventricular gallop) results from rapid ventricular filling in a volume-overloaded, noncompliant ventricle. Crackles at the lung bases reflect pulmonary edema from elevated left-sided filling pressures. Dyspnea occurs from impaired gas exchange due to fluid accumulation in the alveoli. A is wrong — aortic stenosis presents with a crescendo-decrescendo murmur and an S4 (not S3). B is wrong — mitral valve prolapse produces a mid-systolic click and late systolic murmur. D is wrong — pneumothorax has absent breath sounds and hyperresonance, not crackles. E is wrong — PE presents with acute dyspnea and pleuritic chest pain, not bilateral crackles with S3."}, {"q": "What is the primary muscle involved in the process of breathing (inspiration)?", "choices": ["External intercostals", "Sternocleidomastoid", "Diaphragm", "Internal intercostals", "Rectus abdominis"], "correct": 2, "explain": "The lecture slides explicitly label the diaphragm as ‘(Primary)’ for muscles involved in breathing. The diaphragm is a dome-shaped muscle that contracts and flattens during inspiration, increasing thoracic volume and creating negative intrathoracic pressure that draws air into the lungs. It accounts for approximately 75% of the air movement during quiet breathing. A is wrong — external intercostals are accessory muscles that assist by elevating the ribs. B is wrong — the SCM is an accessory muscle used only during labored or forced breathing. D is wrong — internal intercostals assist with forced expiration, not inspiration. E is wrong — rectus abdominis assists with forced expiration."}, {"q": "The exchange of gases in the alveoli depends entirely on the diffusion of gases across membranes and is controlled by the partial pressures of the respective gases on either side of the alveolar membrane. This statement is:", "choices": ["True", "False — gas exchange requires active transport", "False — gas exchange depends on the cardiac output only", "False — gas exchange is controlled by neural signals from the brainstem", "False — gas exchange occurs by osmosis"], "correct": 0, "explain": "This is TRUE. Alveolar gas exchange (external respiration) occurs entirely by passive diffusion driven by partial pressure gradients across the alveolar-capillary membrane. Oxygen moves from the high-PO₂ alveolus into the lower-PO₂ capillary blood, while CO₂ moves in the opposite direction. No active energy-requiring transport mechanisms are involved. B is wrong — gas exchange is purely passive diffusion, not active transport. C is wrong — while cardiac output affects perfusion, the exchange mechanism itself is diffusion. D is wrong — neural signals regulate ventilation rate, not the diffusion mechanism. E is wrong — osmosis refers to water movement, not gas exchange."}, {"q": "The auscultation location for the mitral valve is at the:", "choices": ["Right 2nd intercostal space, sternal border", "Left 2nd intercostal space, sternal border", "Left 4th intercostal space, sternal border", "Left 5th intercostal space, midclavicular line (apex)", "Right 4th intercostal space, sternal border"], "correct": 3, "explain": "The lecture slides state: ‘Mitral — L 5th interspace.’ The mitral valve is auscultated at the cardiac apex, which corresponds to the left 5th intercostal space at the midclavicular line. This is also where the point of maximal impulse (PMI) is typically palpated. A is wrong — the right 2nd interspace is the aortic area. B is wrong — the left 2nd interspace is the pulmonic area. C is wrong — the left 4th interspace at the sternal border is the tricuspid area. E is wrong — the right 4th interspace is not a standard valve auscultation point."}, {"q": "Infective endocarditis (IE) prophylaxis prior to dental procedures should be recommended for patients with all of the following EXCEPT:", "choices": ["Prosthetic cardiac valve", "History of previous infective endocarditis", "Implantable electronic cardiac device (pacemaker)", "Cardiac transplant recipient with valve regurgitation", "Congenital heart disease (unrepaired cyanotic CHD)"], "correct": 2, "explain": "Per the AHA guidelines in the lecture slides, pacemakers and similar implantable electronic devices are specifically listed under ‘AP for dental procedure NOT suggested.’ The conditions that DO require prophylaxis are: prosthetic cardiac valve/material, previous/relapse/recurrent IE, certain congenital heart disease, and cardiac transplant recipients who develop cardiac valvulopathy. A is wrong — prosthetic valves require prophylaxis. B is wrong — prior IE absolutely requires prophylaxis. D is wrong — cardiac transplant with valvulopathy requires prophylaxis. E is wrong — unrepaired cyanotic CHD requires prophylaxis."}, {"q": "A patient develops headache and nausea following nitrous oxide–oxygen sedation. This is most likely caused by diffusion hypoxia. What is the appropriate treatment?", "choices": ["Administer IV ondansetron (Zofran)", "Administer 100% oxygen for 3–5 minutes", "Administer epinephrine IM", "Place the patient in Trendelenburg position", "Discharge the patient with instructions to rest at home"], "correct": 1, "explain": "Headache and nausea after N₂O sedation are classic symptoms of diffusion hypoxia, which occurs at termination of sedation when N₂O rapidly exits the bloodstream and dilutes alveolar oxygen. The slides state prevention is ‘100% O₂ for 3–5 minutes’ post-sedation. This same treatment resolves symptoms if they develop. The ‘hangover’ effect of diffusion hypoxia includes headache, nausea, dizziness, and lethargy. A is wrong — this treats nausea symptomatically but misses the underlying cause. C is wrong — epinephrine is for anaphylaxis, not diffusion hypoxia. D is wrong — Trendelenburg may be used for syncope, not this scenario. E is wrong — you must treat the hypoxia before discharge."}, {"q": "Among the following oral sedation agents, which has the shortest elimination half-life?", "choices": ["Triazolam (Halcion)", "Diazepam (Valium)", "Eszopiclone (Lunesta)", "Lorazepam (Ativan)", "Chlordiazepoxide (Librium)"], "correct": 0, "explain": "Triazolam has the shortest half-life among these agents at approximately 1.5–5.5 hours, making it ideal for short dental sedation procedures. For comparison: diazepam has a very long half-life of ~31.3 hours (plus active metabolites), eszopiclone ~6 hours, lorazepam ~10–20 hours, and chlordiazepoxide ~24–48 hours. The short half-life means rapid onset and recovery. B is wrong — diazepam has one of the longest half-lives (~31.3 hrs) and active metabolites. C is wrong — eszopiclone’s half-life (~6 hrs) exceeds triazolam’s. D is wrong — lorazepam is intermediate-acting. E is wrong — chlordiazepoxide is very long-acting."}, {"q": "During a sedation procedure, your patient begins snoring. What is the most likely cause?", "choices": ["Complete airway obstruction from laryngospasm", "Bronchospasm", "Partial airway obstruction from the tongue falling back", "Pulmonary edema", "Foreign body aspiration"], "correct": 2, "explain": "The slides describe snoring during sedation under ‘Oversedation’ — it indicates partial upper airway obstruction caused by the tongue falling posteriorly against the pharyngeal wall as muscle tone decreases. Management includes: turn off N₂O, place on 100% O₂, and reposition the airway (chin lift/jaw thrust maneuver). Snoring specifically indicates PARTIAL obstruction; complete obstruction would be silent. A is wrong — laryngospasm produces stridor or silence (complete obstruction), not snoring. B is wrong — bronchospasm causes wheezing, not snoring. D is wrong — pulmonary edema causes crackles and dyspnea. E is wrong — foreign body aspiration causes coughing, choking, or stridor."}, {"q": "Which of the following is NOT a typical diagnostic clue of an opioid overdose?", "choices": ["Altered level of consciousness", "Respiratory depression", "Pupillary constriction (miosis)", "Hyperexcitability", "Bradycardia"], "correct": 3, "explain": "The classic opioid overdose triad is: altered/depressed level of consciousness, respiratory depression, and pinpoint pupils (miosis). Opioids are CNS depressants — they cause sedation, not hyperexcitability. Hyperexcitability would suggest stimulant toxicity (amphetamines, cocaine) or withdrawal from CNS depressants, not opioid overdose. A is correct for overdose — decreased consciousness is hallmark. B is correct — respiratory depression is the primary lethal mechanism. C is correct — pinpoint pupils (miosis) are pathognomonic. E is correct — bradycardia occurs from parasympathetic dominance in opioid overdose."}, {"q": "Mandatory monitoring during oral/N₂O sedation includes all of the following EXCEPT:", "choices": ["Blood pressure", "Heart rate", "Heart rhythm", "Pulse oximetry", "Electroencephalography (EEG)"], "correct": 4, "explain": "EEG is NOT part of mandatory monitoring for oral or N₂O sedation. The mandatory monitoring parameters for minimal-to-moderate sedation include blood pressure, heart rate, heart rhythm, respiratory rate, and pulse oximetry. EEG is a specialized neurological monitoring tool with no clinical utility in routine dental sedation monitoring. A is required — blood pressure monitoring is mandatory. B is required — heart rate is a basic vital sign. C is required — rhythm assessment detects dysrhythmias. D is required — pulse oximetry monitors oxygen saturation."}, {"q": "Nitrous oxide was discovered by which scientist?", "choices": ["Horace Wells", "William Morton", "Humphry Davy", "Joseph Priestley", "Crawford Long"], "correct": 3, "explain": "Joseph Priestley discovered nitrous oxide in 1772. Humphry Davy later characterized its analgesic properties and coined the term ‘laughing gas’ in 1799. Horace Wells, a dentist, was the first to use N₂O for dental anesthesia in 1844 after witnessing its effects at a public demonstration. A is wrong — Wells was a dentist who first used N₂O clinically but did not discover it. B is wrong — Morton demonstrated ether anesthesia, not N₂O. C is wrong — Davy studied N₂O’s properties but Priestley discovered it first. E is wrong — Crawford Long was an early ether pioneer."}, {"q": "An appropriate time-oriented anesthetic record including names of all drugs administered, dosages, and monitored physiological parameters must be maintained during which level(s) of sedation?", "choices": ["Minimal sedation only", "Moderate sedation only", "Deep sedation only", "All levels of sedation (minimal, moderate, and deep)", "Only during general anesthesia"], "correct": 3, "explain": "A time-oriented anesthetic record must be maintained for ALL levels of sedation — minimal, moderate, and deep — as well as during general anesthesia. This record should include all drugs administered (including local anesthetics), dosages, routes, times of administration, and all monitored physiological parameters at regular intervals. This is a medicolegal standard of care requirement. A, B, and C are wrong because they each only include one level — the requirement applies across all. E is wrong — the requirement is not limited to GA alone."}, {"q": "Reye’s syndrome, a potentially fatal condition involving hepatic failure and encephalopathy in children, is associated with the use of which medication during a viral illness?", "choices": ["Acetaminophen", "Ibuprofen", "Aspirin", "Naproxen", "Codeine"], "correct": 2, "explain": "Reye’s syndrome is a rare but serious condition associated with aspirin (acetylsalicylic acid) use in children and adolescents during or recovering from a viral illness (particularly influenza or varicella). It presents with acute liver failure and encephalopathy. This is why aspirin is contraindicated in children under 18 with viral illness, and acetaminophen or ibuprofen are preferred as antipyretics in pediatric patients. A is wrong — acetaminophen is safe in children at appropriate doses and is the preferred antipyretic. B is wrong — ibuprofen is not associated with Reye’s syndrome. D is wrong — naproxen is an NSAID but not linked to Reye’s. E is wrong — codeine has other pediatric concerns but not Reye’s syndrome."}, {"q": "In combination analgesic products (e.g., hydrocodone/acetaminophen), which component is the dose-limiting factor?", "choices": ["The opioid component", "The non-opioid (e.g., acetaminophen) component", "Both components equally", "The binding agent in the tablet", "Neither — they can be increased independently"], "correct": 1, "explain": "In combination analgesics, the non-opioid component (typically acetaminophen) is the dose-limiting factor. Acetaminophen has a maximum daily dose of 3,000–4,000 mg, beyond which hepatotoxicity risk increases significantly. Therefore, when escalating the dose of a combination product for pain, you reach the acetaminophen ceiling before the opioid ceiling, limiting the total number of tablets that can be safely prescribed per day. A is wrong — while opioid dosing is also limited, acetaminophen toxicity is reached first in combination products. C is wrong — the non-opioid reaches its ceiling first. D is wrong — the binding agent is pharmacologically inert. E is wrong — they cannot be increased independently when in a fixed combination."}, {"q": "Cardiac dysrhythmias during sedation can be precipitated by all of the following EXCEPT:", "choices": ["Hypoxia", "Endogenous and exogenous catecholamines", "Adequate depth of anesthesia", "Elevated levels of carbon dioxide (hypercarbia)", "Electrolyte imbalances"], "correct": 2, "explain": "Adequate (appropriate) depth of anesthesia is actually PROTECTIVE against dysrhythmias — it does NOT precipitate them. Dysrhythmias are triggered by physiologic stressors including: hypoxia, hypercarbia, catecholamines (both endogenous from stress and exogenous from drug administration), electrolyte imbalances, and light or inadequate anesthesia. The slides report dysrhythmias as the most common intraoperative complication. A is true — hypoxia is a major cause of dysrhythmias. B is true — catecholamines stimulate the myocardium and can trigger arrhythmias. D is true — hypercarbia (elevated CO₂) causes sympathetic stimulation and dysrhythmias. E is true — electrolyte disturbances (especially potassium) directly affect cardiac conduction."}, {"q": "Iatrosedation is best described as:", "choices": ["Administration of oral sedatives to calm a patient", "Use of nitrous oxide–oxygen for anxiolysis", "Non-pharmacologic sedation achieved through doctor-patient trust and communication", "IV administration of a benzodiazepine prior to dental treatment", "Use of hypnotics to induce a light sleep state"], "correct": 2, "explain": "The slides define iatrosedation as ‘doctor-patient communication — bonds of trust and confidence,’ with NO medications involved. It also includes adjuncts like hypnosis, acupuncture, biofeedback, and audio analgesia. Iatrosedation is contrasted with pharmacosedation, which involves medications. A, B, D, and E are all forms of pharmacosedation, not iatrosedation. The key distinction is that iatrosedation uses no drugs — it relies entirely on behavioral and communication-based techniques."}, {"q": "Compared to barbiturates, propofol is associated with:", "choices": ["More severe hangover effect", "Less hangover effect", "Identical hangover effect", "Greater respiratory depression postoperatively", "Longer duration of sedation"], "correct": 1, "explain": "Propofol produces significantly less ‘hangover’ effect compared to barbiturates. The slides list ‘hangover’ as a specific side effect of barbiturates, while propofol is noted for its rapid emergence and recovery. Methohexital’s duration is noted to ‘parallel that of propofol,’ but propofol’s cleaner recovery profile makes it preferable. A is wrong — the opposite is true. C is wrong — propofol has a clearly superior recovery profile. D is wrong — propofol has ‘insignificant cardiovascular and respiratory effects’ per the slides. E is wrong — propofol is known for rapid, short-duration sedation."}, {"q": "According to pre-procedure fasting guidelines, a patient should not eat a light meal for at least how many hours before general anesthesia?", "choices": ["2 hours", "4 hours", "6 hours", "8 hours", "12 hours"], "correct": 2, "explain": "Per the slides (Box 10-3 Preprocedure Fasting Guidelines): clear liquids = 2 hours minimum; non-human milk and light meals = 6 hours minimum. These fasting periods apply to all ages. A light meal typically consists of toast and clear liquids. Meals with fried, fatty foods, or meat may prolong gastric emptying and require longer fasting. A is wrong — 2 hours applies to clear liquids only. B and D are not the specified guideline. E is excessive and not the standard recommendation."}, {"q": "Aspirin exerts its antiplatelet effect by irreversibly binding to which enzyme on the platelet?", "choices": ["Lipoxygenase", "Phospholipase A₂", "Cyclooxygenase (COX)", "Thromboxane synthase", "Adenylyl cyclase"], "correct": 2, "explain": "Aspirin irreversibly acetylates the cyclooxygenase (COX) enzyme on platelets, blocking the production of thromboxane A₂ (a potent platelet aggregator and vasoconstrictor). Because platelets are anucleate and cannot synthesize new COX, aspirin’s antiplatelet effect lasts the entire lifespan of the platelet (~7–10 days). This is why aspirin has prolonged antiplatelet effects compared to other NSAIDs. A is wrong — lipoxygenase produces leukotrienes, not thromboxane. B is wrong — PLA₂ liberates arachidonic acid but is not the target of aspirin. D is wrong — while downstream in the pathway, aspirin targets COX, not thromboxane synthase. E is wrong — adenylyl cyclase is unrelated to the arachidonic acid pathway."}, {"q": "In patients with hypothyroidism, IV sedation drugs are of concern because:", "choices": ["They are metabolized too rapidly", "They have no clinical effect", "Their actions are exaggerated due to increased patient sensitivity", "They cause thyroid storm", "They are converted to toxic metabolites by the thyroid"], "correct": 2, "explain": "Hypothyroid patients are unusually sensitive to sedatives, opioids, tranquilizers, and CNS depressants, including local anesthetics. The actions of most commonly used IV sedation drugs are exaggerated in these patients. Outpatient general anesthesia is contraindicated in patients with uncontrolled hypothyroidism or hyperthyroidism. Thyroid dysfunction is listed as a specific contraindication to IV sedation. A is wrong — metabolism is actually slower, not faster, in hypothyroidism. B is wrong — the drugs work but have an exaggerated effect. D is wrong — thyroid storm is associated with hyperthyroidism, not hypothyroidism. E is wrong — the thyroid does not metabolize sedation drugs."}, {"q": "Which drug is most associated with producing emergence reactions (agitation, confusion, hallucinations)?", "choices": ["Propofol", "Fentanyl", "Scopolamine", "Thiopental", "Acetaminophen"], "correct": 2, "explain": "Per the study material, emergence reactions are most commonly seen with scopolamine (an anticholinergic), and also with diazepam and midazolam. Scopolamine can produce a ‘central anticholinergic syndrome’ with confusion, agitation, hallucinations, and delirium, particularly in elderly patients. A is wrong — propofol has a clean emergence profile. B is wrong — fentanyl causes sedation/respiratory depression, not emergence reactions. D is wrong — thiopental causes sedation/hangover, not emergence agitation. E is wrong — acetaminophen is an analgesic with no CNS emergence effects."}, {"q": "The ‘ceiling effect’ of respiratory depression seen with certain opioids is primarily associated with which class of opioid drugs?", "choices": ["Pure agonists (morphine, fentanyl)", "Pure antagonists (naloxone)", "Agonist-antagonists (nalbuphine, butorphanol)", "Partial agonists (buprenorphine) only", "NSAIDs"], "correct": 2, "explain": "Opioid agonist-antagonists like nalbuphine and butorphanol exhibit a ceiling effect for respiratory depression — beyond a certain dose, additional drug does not produce further respiratory depression. This is a significant safety advantage compared to pure agonists, which can produce dose-dependent respiratory depression without a ceiling. This ceiling effect is due to their mixed receptor activity. A is wrong — pure agonists have no ceiling for respiratory depression. B is wrong — antagonists don’t produce respiratory depression at all. D is partially relevant — buprenorphine also has a ceiling, but the classic teaching emphasizes nalbuphine and butorphanol. E is wrong — NSAIDs don’t cause respiratory depression."}, {"q": "Methohexital (Brevital) is a barbiturate with which notable adverse characteristic that distinguishes it from other barbiturates?", "choices": ["It raises the seizure threshold", "It lowers the seizure threshold", "It has no respiratory effects", "It produces significant analgesia", "It causes malignant hyperthermia"], "correct": 1, "explain": "The slides state: ‘Methohexital lowers seizure threshold, unlike other barbiturates.’ This is a critical distinction — most barbiturates actually raise the seizure threshold and are used as anticonvulsants (e.g., pentobarbital, thiopental). Methohexital is the exception and should be avoided in patients with seizure disorders. Other barbiturate disadvantages include respiratory depression, hypotension, no analgesia, and painful injection. A is wrong — the opposite is true; other barbiturates raise the threshold, but methohexital lowers it. C is wrong — all barbiturates cause some respiratory depression. D is wrong — barbiturates have NO analgesic effect. E is wrong — MH is associated with volatile anesthetics and succinylcholine."}, {"q": "Only two routes of drug administration allow for true titration (achieving peak clinical effect in real time). These are:", "choices": ["Oral and rectal", "Intramuscular and subcutaneous", "Inhalation and intravenous", "Sublingual and transdermal", "Oral and intramuscular"], "correct": 2, "explain": "Titration means adjusting the drug dose incrementally while observing the clinical effect in real time. Only inhalation (e.g., N₂O) and intravenous routes provide sufficiently rapid onset to permit true titration — the peak clinical action is reached in a time span that allows the clinician to adjust the dose before oversedation occurs. All other routes have delayed and unpredictable absorption. A is wrong — oral and rectal have slow, unpredictable absorption. B is wrong — IM/SC onset is too delayed (15–30 minutes). D is wrong — sublingual and transdermal are not titratable in real-time. E is wrong — oral and IM both lack rapid enough onset."}, {"q": "Which of the following is NOT a physical property of OXYGEN?", "choices": ["Odorless", "Colorless", "Sweet-smelling", "Supports combustion", "Non-flammable but supports burning"], "correct": 2, "explain": "Sweet-smelling is a physical property of NITROUS OXIDE, not oxygen. The slides list N₂O’s properties as: nonirritating, sweet-smelling, and colorless. Oxygen is colorless, odorless, tasteless, and supports combustion. The slides also note to ‘avoid oil and grease’ with oxygen cylinders due to explosion risk. A is correct for O₂ — oxygen is odorless. B is correct for O₂ — oxygen is colorless. D and E are correct — oxygen supports combustion but is not itself flammable."}, {"q": "General anesthesia staging (Guedel’s classification) is based on which of the following parameters?", "choices": ["Respiration status, eyeball activity, pupillary changes, eyelid reflex, swallowing, response to surgical stimulation, and pharyngeal reflexes", "Blood pressure, heart rate, and oxygen saturation only", "Level of consciousness and ability to follow verbal commands only", "EEG waveform patterns exclusively", "Pupillary changes and respiratory rate only"], "correct": 0, "explain": "Per the slides, GA staging is based on ALL of the following: respiration status, eyeball activity, pupillary changes, eyelid reflex, swallowing, response to surgical stimulation, and pharyngeal reflexes. These parameters define the four stages: Stage I (Analgesia), Stage II (Delirium), Stage III (Surgical anesthesia), and Stage IV (Medullary paralysis). B is wrong — these are monitoring parameters, not staging criteria. C is wrong — this describes sedation levels, not GA staging. D is wrong — EEG can monitor anesthesia depth but is not Guedel’s classification system. E is too incomplete."}, {"q": "Stage IV of general anesthesia is also known as:", "choices": ["Analgesia", "Delirium", "Surgical anesthesia", "Medullary paralysis", "Conscious sedation"], "correct": 3, "explain": "Stage IV is medullary paralysis, also termed ‘reversible death.’ It is characterized by onset of respiratory arrest and loss of effective circulation. The stages in order are: Stage I = Analgesia (appropriate), Stage II = Delirium (undesirable), Stage III = Surgical anesthesia (unconscious, no response to surgical stimulus, regular respiration, muscular tone lost), Stage IV = Medullary paralysis. A is wrong — Stage I. B is wrong — Stage II. C is wrong — Stage III. E is wrong — conscious sedation is not a GA stage; it’s a separate sedation category."}, {"q": "A patient is asleep, respirations are regular, muscular tone is lost, and the patient does not respond to surgical stimulation. Which stage of general anesthesia is this patient in?", "choices": ["Stage I — Analgesia", "Stage II — Delirium", "Stage III — Surgical anesthesia", "Stage IV — Medullary paralysis", "Deep sedation (not a GA stage)"], "correct": 2, "explain": "Stage III (Surgical Anesthesia) is defined by: unconscious patient, no response to surgical stimulus, regular respiration, and loss of muscular tone. This is the target stage for surgical procedures under general anesthesia. It is critical to maintain this stage without progressing to Stage IV (medullary paralysis/respiratory arrest). A is wrong — Stage I patients are awake with normal reflexes. B is wrong — Stage II shows irregular respiration, nystagmus, and increased muscle tone. D is wrong — Stage IV involves respiratory arrest and circulatory collapse. E is wrong — deep sedation patients still respond to painful stimulation."}, {"q": "The Verrill sign, used as a clinical endpoint during IV sedation, refers to:", "choices": ["Burning sensation in the hand after drug administration", "Halfway ptosis (drooping) of the upper eyelid", "Complete loss of the corneal reflex", "Slurred speech", "Loss of muscular coordination"], "correct": 1, "explain": "The Verrill sign is defined as approximately 50% (halfway) ptosis of the upper eyelid. It is used as a clinical indicator during IV sedation that the patient has reached an appropriate level of sedation. When the upper eyelid droops to approximately the midpoint of the pupil, the sedation endpoint has been reached and drug administration should be slowed or stopped. A is wrong — burning sensation may indicate extravasation or phlebitis. C is wrong — loss of corneal reflex indicates deep anesthesia, not moderate sedation. D is wrong — slurred speech may be a sign of sedation but is not the Verrill sign. E is wrong — loss of coordination is a general CNS depression sign, not the specific Verrill sign."}, {"q": "Which of the following is a COX-2 selective inhibitor?", "choices": ["Dolobid (diflunisal)", "Celebrex (celecoxib)", "Naproxen", "Naproxen sodium", "Aspirin"], "correct": 1, "explain": "Celebrex (celecoxib) is the primary COX-2 selective inhibitor currently available on the US market. Dolobid (diflunisal), naproxen, naproxen sodium, and aspirin are all non-selective NSAIDs that inhibit both COX-1 and COX-2 enzymes. COX-2 selectivity provides the advantage of reduced GI side effects but carries increased cardiovascular risk. A is wrong — diflunisal is a non-selective NSAID related to aspirin. C and D are wrong — naproxen/naproxen sodium are non-selective NSAIDs. E is wrong — aspirin is a non-selective, irreversible COX inhibitor."}, {"q": "Which of the following IV agents has postoperative antiemetic properties?", "choices": ["Ketamine", "Propofol", "Methohexital (Brevital)", "Fentanyl", "Meperidine (Demerol)"], "correct": 1, "explain": "The slides list propofol’s indications as: induction of anesthesia, maintenance of anesthesia, and postoperative antiemetic. This is a unique and clinically valuable property — propofol reduces postoperative nausea and vomiting (PONV), making it advantageous for outpatient procedures where rapid, nausea-free recovery is desired. A is wrong — ketamine can actually increase nausea. C is wrong — methohexital has no antiemetic properties. D is wrong — fentanyl and other opioids are emetogenic (cause nausea). E is wrong — meperidine is also emetogenic."}, {"q": "Cyclooxygenase (COX) enzymes play a key role in which phase of the pain mechanism?", "choices": ["Transduction", "Conduction", "Transmission", "Central modulation", "Perception"], "correct": 0, "explain": "Transduction is the conversion of a noxious stimulus into an electrical signal at the peripheral nerve ending. COX enzymes (especially COX-2) are induced at the site of tissue injury, converting arachidonic acid into prostaglandins that sensitize peripheral nociceptors, lowering their activation threshold. NSAIDs block COX at this transduction step, reducing peripheral sensitization. B is wrong — conduction is the propagation of the action potential along the nerve fiber. C is wrong — transmission refers to synaptic relay of pain signals in the spinal cord. D is wrong — modulation involves descending inhibitory pathways. E is wrong — perception is the conscious experience of pain in the cortex."}, {"q": "Following IV administration, diazepam reaches a peak blood level in approximately:", "choices": ["30 seconds", "1 minute", "2 to 3 minutes", "5 to 7 minutes", "10 minutes"], "correct": 2, "explain": "IV diazepam reaches peak blood levels in approximately 2 to 3 minutes after injection. This is important for titration — the clinician must wait for peak effect before administering additional doses. Giving repeated doses too quickly before peak effect is reached can result in inadvertent oversedation. A and B are too fast — while the drug enters the bloodstream immediately, peak blood levels take longer. D and E are too slow for peak IV blood levels."}, {"q": "Nociceptive A-delta nerve fibers are characterized by which of the following properties?", "choices": ["Slow conducting fibers that produce dull, aching pain", "Relatively fast conducting fibers that mediate the initial sharp sensation of pain", "Unmyelinated fibers responsible for autonomic responses", "Fibers that transmit only temperature sensation", "Fibers that do not respond to noxious stimuli"], "correct": 1, "explain": "A-delta fibers are relatively fast-conducting, thinly myelinated fibers that mediate the initial, sharp, well-localized ‘first pain’ sensation. They are distinct from C-fibers, which are slow-conducting, unmyelinated fibers responsible for the dull, aching, burning ‘second pain.’ Understanding fiber types is important for understanding how local anesthetics and analgesics work at different levels. A is wrong — this describes C-fibers, not A-delta fibers. C is wrong — A-delta fibers are myelinated somatic sensory fibers, not autonomic. D is wrong — A-delta fibers respond to multiple noxious stimuli, not just temperature. E is wrong — A-delta fibers are nociceptors by definition."}, {"q": "The blood-gas solubility coefficient of nitrous oxide is 0.47 at 37°C. This means that:", "choices": ["N₂O is highly soluble in blood and equilibrates slowly", "N₂O is only slightly soluble in blood, so alveolar concentration rises rapidly, and blood tension of the gas rises rapidly", "N₂O cannot cross the alveolar membrane", "N₂O requires hepatic activation before becoming effective", "Higher doses are needed to achieve any clinical effect"], "correct": 1, "explain": "A low blood-gas solubility coefficient (0.47) means N₂O is only slightly soluble in blood. Because little N₂O dissolves into the blood, the alveolar concentration rises rapidly, and the tension (partial pressure) of the gas in the blood also rises rapidly. This accounts for N₂O’s rapid onset of clinical effect and rapid recovery when discontinued — the gas equilibrates quickly in both directions. A is wrong — 0.47 indicates LOW solubility, not high. C is wrong — N₂O readily crosses the alveolar membrane by diffusion. D is wrong — N₂O is not metabolized by the liver. E is wrong — the rapid rise in tension actually means quick clinical onset."}, {"q": "Regarding nitrous oxide use during pregnancy, which of the following statements is/are correct? (1) N₂O crosses the placenta producing CNS depression in the fetus equal to the mother (2) If delivered with adequate oxygen (>20%), N₂O/O₂ is the recommended sedation technique during pregnancy (3) Medical consultation with the patient’s physician is suggested before use", "choices": ["1 only", "2 only", "3 only", "All of the above", "None of the above"], "correct": 3, "explain": "All three statements are correct per the slides. N₂O does cross the placenta and affects the fetus. Despite this, when delivered with adequate O₂, it is considered the recommended sedation technique during pregnancy (preferable to IV sedation or oral sedation drugs that may be teratogenic). Medical consultation is always recommended before using any sedation in a pregnant patient. Each individual statement is supported by the lecture content, making D the comprehensive correct answer."}, {"q": "In older patients receiving IV diazepam, the primary reason for the apparent increased sensitivity requiring dose reduction is:", "choices": ["Poor absorption from the small intestine", "Decreased protein binding of the drug", "Increased protein binding of the drug", "Poor cerebral circulation", "Accelerated hepatic metabolism"], "correct": 1, "explain": "In elderly patients, decreased plasma protein (albumin) levels result in decreased protein binding of diazepam. This means more free (unbound) drug is available to exert clinical effects, producing greater apparent sensitivity. Additionally, the rate of hepatic biotransformation is decreased in older patients. These combined factors necessitate reducing the IV diazepam dose in the elderly. A is wrong — absorption is not the primary issue with IV administration. C is wrong — the opposite occurs; binding is decreased, not increased. D is wrong — while cerebral circulation may be reduced, decreased protein binding is the most important factor. E is wrong — hepatic metabolism is actually decreased, not accelerated."}, {"q": "In analgesic studies, 650 mg of aspirin has been consistently shown to be more effective than placebo or what dose of codeine alone?", "choices": ["7.5 mg", "15 mg", "30 mg", "60 mg", "120 mg"], "correct": 2, "explain": "Studies have shown that 650 mg of aspirin is more effective than 30 mg of codeine alone for post-extraction pain relief. This demonstrates that non-opioid analgesics can be highly effective for dental pain and supports the principle that opioids are not always superior. This is a foundation for the multimodal analgesia approach and first-line use of NSAIDs in dental pain management. A and B are subtherapeutic doses of codeine. D is wrong — 60 mg codeine would show greater efficacy, making the comparison less favorable for aspirin. E is wrong — 120 mg is above standard codeine dosing."}, {"q": "Which of the following is NOT a full (complete) opioid agonist?", "choices": ["Propoxyphene napsylate (Darvon N)", "Codeine SO4 or PO4 (Tylenol 3)", "Dihydrocodeine (Synalgos DC)", "Oxycodone (Percodan, Tylox, Percocet)", "Pentazocine (Talwin)"], "correct": 4, "explain": "Pentazocine (Talwin) is an opioid agonist-antagonist, NOT a pure agonist. Full agonists include morphine, codeine, hydrocodone, oxycodone, propoxyphene, meperidine, and methadone. Agonist-antagonists include pentazocine, nalbuphine, and butorphanol. The distinction is clinically important because agonist-antagonists have a ceiling effect and can precipitate withdrawal in opioid-dependent patients. A through D are all full opioid agonists. E is the only agonist-antagonist in the list."}, {"q": "The beta (β) half-life of a drug is an indicator of:", "choices": ["The rate of drug absorption from the GI tract", "The rate of drug distribution from blood to tissues", "The rate at which a drug undergoes biotransformation and elimination", "The drug’s receptor binding affinity", "The drug’s onset of action"], "correct": 2, "explain": "The β-half-life reflects the rate of drug elimination from the body through biotransformation (metabolism) and excretion. It is distinct from the α-half-life, which reflects redistribution from blood to tissues. For diazepam, the β-half-life is 31.3 hours (long elimination), while for midazolam it is 1.7–2.4 hours (short elimination), explaining their different recovery profiles. A is wrong — absorption rate is not measured by β-half-life. B is wrong — this describes the α-half-life (redistribution phase). D is wrong — receptor binding is measured by affinity constants, not half-life. E is wrong — onset relates to absorption and distribution, not elimination half-life."}, {"q": "Between 45 and 60 minutes after receiving IV diazepam, a patient appears fully recovered. This apparent recovery is due to:", "choices": ["Complete hepatic biotransformation of the drug", "The alpha (α) half-life (redistribution from blood to tissues)", "Complete renal elimination of the drug", "Receptor desensitization in the brain", "Binding of the drug by plasma proteins"], "correct": 1, "explain": "The apparent recovery at 45–60 minutes is due to the α-half-life — the redistribution of diazepam from the brain (blood) to peripheral tissues (fat, muscle). The drug has NOT been eliminated or metabolized — it has simply moved out of the CNS to other tissue compartments. This is why a ‘rebound’ or ‘second peak’ effect can occur later when the drug re-enters the bloodstream. A is wrong — diazepam’s β-half-life is 31.3 hours; it is far from fully metabolized. C is wrong — renal elimination is not complete at this timepoint. D is wrong — receptor desensitization is not the mechanism. E is wrong — protein binding doesn’t explain the apparent recovery."}, {"q": "Diazepam (Valium) is indicated for management of all of the following EXCEPT:", "choices": ["Anxiety disorders", "Alcohol withdrawal symptoms", "Convulsive disorders", "Narrow-angle glaucoma", "Skeletal muscle spasm"], "correct": 3, "explain": "The slides list ‘acute narrow glaucoma and wide angle glaucoma’ as contraindications for diazepam. Diazepam and other benzodiazepines are contraindicated in narrow-angle glaucoma because their anticholinergic-like effects can precipitate an acute angle-closure crisis by causing pupillary dilation. A is correct — anxiety is a primary indication. B is correct — BZDs are standard for alcohol withdrawal. C is correct — diazepam is an effective anticonvulsant. E is correct — skeletal muscle relaxation is a recognized BZD property."}, {"q": "Which of the following are characteristics of inhaled general anesthetic agents?", "choices": ["Vasoconstrictors and bronchodilators", "Myocardial depressants, respiratory depressants, and bronchodilators", "Vasoconstrictors and respiratory stimulants", "Myocardial stimulants and bronchoconstrictors", "Respiratory stimulants and vasodilators"], "correct": 1, "explain": "Inhaled anesthetics are myocardial depressants (they decrease cardiac contractility and output), respiratory depressants (they reduce ventilatory drive), and bronchodilators (several agents like isoflurane, sevoflurane, and ketamine relax bronchial smooth muscle). They are NOT vasoconstrictors — most cause vasodilation and decreased blood pressur
