<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>MISSION CONTROL // CLINIC OPS APR\u2013MAY 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Spline+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --font-display: "Space Grotesk", sans-serif;
  --font-body: "Spline Sans", sans-serif;
  --font-mono: "IBM Plex Mono", monospace;
  --canvas: #f7f5ef;
  --surface: #ffffff;
  --surface-alt: #f4f6f0;
  --surface-strong: #ecf0e7;
  --ink: #17212b;
  --ink-soft: #2f3a45;
  --muted: #62707c;
  --line: rgba(23, 33, 43, 0.12);
  --line-strong: rgba(23, 33, 43, 0.2);
  --teal: #1a7f79;
  --teal-soft: rgba(26, 127, 121, 0.12);
  --teal-bg: rgba(26, 127, 121, 0.06);
  --moss: #5f8b5a;
  --amber: #d8a357;
  --amber-soft: rgba(216, 163, 87, 0.15);
  --clay: #c86b4b;
  --clay-soft: rgba(200, 107, 75, 0.12);
  --navy: #1c3d5a;
  --navy-soft: rgba(28, 61, 90, 0.1);
  --purple: #7c6bb1;
  --purple-soft: rgba(124, 107, 177, 0.1);
  --shadow-soft: 0 18px 36px rgba(23, 33, 43, 0.08);
  --shadow-cut: 0 2px 0 rgba(23, 33, 43, 0.08);
  --radius-sm: 8px;
  --radius-md: 12px;
  --ease-snappy: cubic-bezier(0.3, 0.8, 0.2, 1);
  --dur-fast: 140ms;
  --hour-height: 64px;
}
html { font-size: 17px; }
body {
  background:
    linear-gradient(0deg, rgba(255,255,255,0.7), rgba(255,255,255,0.7)),
    radial-gradient(900px 600px at 10% -10%, rgba(26,127,121,0.14), transparent 55%),
    radial-gradient(800px 500px at 90% -10%, rgba(216,163,87,0.12), transparent 60%),
    var(--canvas);
  color: var(--ink);
  font-family: var(--font-body);
  min-height: 100vh;
  overflow-x: hidden;
  line-height: 1.5;
}
body::after {
  content: '';
  position: fixed; inset: 0;
  background-image:
    linear-gradient(90deg, rgba(23,33,43,0.04) 1px, transparent 1px),
    linear-gradient(0deg, rgba(23,33,43,0.04) 1px, transparent 1px);
  background-size: 120px 120px;
  opacity: 0.5;
  pointer-events: none; z-index: 9999;
}
body::before {
  display: none;
}
.wrapper { max-width: 1600px; margin: 0 auto; padding: 16px 20px 40px; position: relative; z-index: 1; }

/* ── Header ── */
.header {
  border: 1px solid var(--line);
  box-shadow: var(--shadow-soft);
  padding: 16px 24px;
  margin-bottom: 20px;
  background: var(--surface);
  border-radius: var(--radius-md);
  position: relative;
}
.header::before, .header::after {
  display: none;
}
.header-top { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 8px; }
.header-title {
  font-family: var(--font-display); font-weight: 700; font-size: 1.5rem;
  color: var(--ink); letter-spacing: 0.05em;
}
.header-title .sep { opacity: 0.3; color: var(--muted); }
.header-btns { display: flex; gap: 8px; }
.btn-new-op, .btn-reset {
  font-family: var(--font-display); font-size: 0.7rem; padding: 8px 16px;
  cursor: pointer; letter-spacing: 0.1em; border-radius: 999px; transition: all 0.2s;
  font-weight: 600; text-transform: uppercase;
}
.btn-new-op {
  background: var(--teal); border: 1px solid transparent; color: #fff;
  box-shadow: var(--shadow-cut);
}
.btn-new-op:hover { transform: translateY(-1px); box-shadow: 0 8px 18px rgba(23,33,43,0.16); }
.btn-reset {
  background: var(--surface-alt); border: 1px solid var(--line-strong); color: var(--ink-soft);
  box-shadow: var(--shadow-cut);
}
.btn-reset:hover { transform: translateY(-1px); box-shadow: 0 8px 18px rgba(23,33,43,0.16); }
.header-sub {
  display: flex; gap: 32px; flex-wrap: wrap; font-size: 0.85rem; color: var(--muted); letter-spacing: 0.02em;
}
.header-sub span { display: inline-flex; align-items: center; gap: 6px; }
.header-sub .val { color: var(--teal); font-weight: 600; }
.header-sub .val-crit { color: var(--clay); font-weight: 600; }
.blink {
  display: inline-block; width: 6px; height: 6px; border-radius: 50%;
  background: var(--teal);
  animation: blink 1.5s ease-in-out infinite;
}
.blink-warn { background: var(--amber); }
@keyframes blink { 0%,100% { opacity:1; } 50% { opacity:0.2; } }

/* ── Panel ── */
.panel {
  border: 1px solid var(--line); background: var(--surface);
  border-radius: var(--radius-md); box-shadow: var(--shadow-soft);
  position: relative; margin-bottom: 20px; overflow: hidden;
}
.panel::before, .panel::after {
  display: none;
}
.panel-title {
  font-family: var(--font-display); font-weight: 600; font-size: 0.75rem;
  color: var(--muted); letter-spacing: 0.2em; padding: 12px 16px 10px;
  border-bottom: 1px solid var(--line); background: var(--surface);
  text-transform: uppercase;
  display: flex; justify-content: space-between; align-items: center;
}
.panel-title .tag { font-family: var(--font-mono); font-size: 0.75rem; color: var(--muted); letter-spacing: 0; }

/* ── Weeks ── */
.weeks { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
@media (max-width: 1100px) { .weeks { grid-template-columns: 1fr; } }

/* ── Day Grid ── */
.week-grid { display: grid; grid-template-columns: 44px repeat(5,1fr); gap: 0; padding: 0 8px 12px; }
.day-header {
  font-family: var(--font-display); font-size: 0.7rem; font-weight: 600;
  text-align: center; padding: 10px 2px; letter-spacing: 0.1em;
  color: var(--teal); border-bottom: 1px solid var(--line); position: relative;
  text-transform: uppercase;
}
.day-header .date { display: block; font-family: var(--font-mono); font-size: 0.8rem; color: var(--muted); margin-top: 2px; letter-spacing: 0; }
.day-add-btn {
  display: inline-block; width: 14px; height: 14px; line-height: 12px; text-align: center;
  font-size: 12px; font-weight: bold; color: var(--teal); border: 1px solid var(--line);
  border-radius: var(--radius-sm); cursor: pointer; margin-left: 3px; opacity: 0; transition: opacity 0.2s; vertical-align: middle;
}
.day-header:hover .day-add-btn { opacity: 1; }
.day-add-btn:hover { background: var(--teal-soft); color: var(--teal); }
.time-header { font-size: 0.7rem; padding: 10px 0; text-align: right; padding-right: 6px; color: var(--muted); border-bottom: 1px solid var(--line); }
.time-col { padding-right: 4px; position: relative; }
.time-label { position: absolute; right: 4px; font-size: 0.65rem; color: var(--muted); transform: translateY(-50%); white-space: nowrap; font-family: var(--font-mono); }
.day-col { position: relative; border-left: 1px solid var(--line); }
.hour-line { position: absolute; left: 0; right: 0; height: 1px; background: var(--line); }
.hour-line.half { background: rgba(23,33,43,0.06); }

/* ── Events ── */
.ev {
  position: absolute; left: 3px; right: 3px; border-radius: var(--radius-sm);
  padding: 4px 6px; font-size: 0.7rem; line-height: 1.35; overflow: hidden;
  z-index: 2; border-left: 3px solid; cursor: pointer;
  transition: box-shadow 0.3s, transform 0.15s;
  animation: fadeSlideIn 0.6s ease-out both;
  font-family: var(--font-body);
}
.ev:hover { z-index: 10; transform: scale(1.03); }
.ev-name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 14px; }
.ev-time { font-size: 0.52rem; opacity: 0.7; white-space: nowrap; font-family: var(--font-mono); }
.ev-detail { font-size: 0.48rem; opacity: 0.65; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ev-x {
  position: absolute; top: 2px; right: 2px; width: 14px; height: 14px;
  display: none; align-items: center; justify-content: center;
  font-size: 9px; color: var(--clay); cursor: pointer; border-radius: 4px;
  background: rgba(255,255,255,0.9); z-index: 20; line-height: 1;
}
.ev:hover .ev-x { display: flex; }
.ev-x:hover { background: var(--clay); color: #fff; }

.ev-rotation-bg {
  background: var(--surface-strong);
  border-color: var(--line-strong); color: var(--muted); z-index: 0; border-left-width: 2px; opacity: 0.7;
}
.ev-rotation-bg .ev-name { font-size: 0.7rem; }
.ev-patient { background: var(--teal-bg); border-color: var(--teal); color: var(--teal); }
.ev-patient:hover { box-shadow: 0 4px 12px rgba(26,127,121,0.2); }
.ev-lab { background: var(--navy-soft); border-color: var(--navy); color: var(--navy); }
.ev-lab:hover { box-shadow: 0 4px 12px rgba(28,61,90,0.2); }
.ev-meeting { background: var(--amber-soft); border-color: var(--amber); color: #a07830; }
.ev-meeting:hover { box-shadow: 0 4px 12px rgba(216,163,87,0.25); }
.ev-wa { background: rgba(95,139,90,0.1); border-color: var(--moss); color: var(--moss); }
.ev-wa:hover { box-shadow: 0 4px 12px rgba(95,139,90,0.2); }
.ev-deadline {
  background: var(--clay-soft); border-color: var(--clay); color: var(--clay);
  animation: fadeSlideIn 0.6s ease-out both, pulseAlert 3s ease-in-out infinite;
}
.ev-exam { background: rgba(200,107,75,0.14); border-color: var(--clay); color: #a8523a; }
.ev-exam:hover { box-shadow: 0 4px 12px rgba(200,107,75,0.25); }
.ev-conflict {
  box-shadow: 0 0 0 1px rgba(200,107,75,0.3);
  outline: 1px dashed rgba(200,107,75,0.4); outline-offset: 1px;
}
@keyframes pulseAlert { 0%,100% { box-shadow: 0 2px 8px rgba(200,107,75,0.15); } 50% { box-shadow: 0 4px 16px rgba(200,107,75,0.3); } }
@keyframes fadeSlideIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }

/* ── Bottom ── */
.bottom-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
@media (max-width: 900px) { .bottom-grid { grid-template-columns: 1fr; } }
.beyond-item {
  display: flex; gap: 10px; padding: 9px 16px; border-bottom: 1px solid var(--line);
  font-size: 0.85rem; align-items: center; cursor: pointer; transition: background 0.15s;
}
.beyond-item:last-child { border-bottom: none; }
.beyond-item:hover { background: var(--teal-bg); }
.beyond-date { font-family: var(--font-display); font-size: 0.75rem; color: var(--teal); white-space: nowrap; min-width: 44px; letter-spacing: 0.05em; font-weight: 600; }
.beyond-text { color: var(--ink); line-height: 1.5; flex: 1; }
.beyond-text .hl { color: var(--amber); font-weight: 600; }
.beyond-x {
  width: 16px; height: 16px; display: none; align-items: center; justify-content: center;
  font-size: 9px; color: var(--clay); cursor: pointer; border-radius: 4px; background: var(--surface-alt); flex-shrink: 0;
}
.beyond-item:hover .beyond-x { display: flex; }
.beyond-x:hover { background: var(--clay); color: #fff; }
.beyond-add-btn {
  font-family: var(--font-display); font-size: 0.65rem; padding: 3px 10px;
  background: transparent; border: 1px solid var(--line); color: var(--teal);
  cursor: pointer; border-radius: 999px; transition: all 0.2s; margin-left: 8px;
  font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em;
}
.beyond-add-btn:hover { background: var(--teal-soft); }

/* ── Conflicts ── */
.conflict-item {
  padding: 10px 12px; margin: 0 16px 8px; border: 1px solid; border-radius: var(--radius-sm);
  font-size: 0.82rem; line-height: 1.5; position: relative; overflow: hidden;
}
.conflict-item:first-child { margin-top: 10px; }
.conflict-item:last-child { margin-bottom: 14px; }
.conflict-item::before { content: ''; position: absolute; top: 0; left: 0; bottom: 0; width: 3px; }
.conflict-high { border-color: rgba(200,107,75,0.3); background: rgba(200,107,75,0.06); }
.conflict-high::before { background: var(--clay); }
.conflict-high .conflict-sev { color: var(--clay); }
.conflict-med { border-color: rgba(216,163,87,0.3); background: rgba(216,163,87,0.08); }
.conflict-med::before { background: var(--amber); }
.conflict-med .conflict-sev { color: #a07830; }
.conflict-low { border-color: rgba(26,127,121,0.2); background: var(--teal-bg); }
.conflict-low::before { background: var(--teal); }
.conflict-low .conflict-sev { color: var(--teal); }
.conflict-sev { font-family: var(--font-display); font-size: 0.7rem; letter-spacing: 0.08em; margin-bottom: 3px; font-weight: 600; text-transform: uppercase; }
.conflict-desc { color: var(--ink-soft); }
.conflict-action { margin-top: 4px; color: var(--amber); font-size: 0.72rem; }

/* ── Legend ── */
.legend { display: flex; flex-wrap: wrap; gap: 16px; padding: 12px 16px; font-size: 0.75rem; border-top: 1px solid var(--line); color: var(--ink-soft); }
.legend-item { display: inline-flex; align-items: center; gap: 5px; }
.legend-swatch { width: 10px; height: 10px; border-radius: 4px; border-left: 3px solid; }

/* ── Status Bar ── */
.status-bar {
  position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface);
  border-top: 1px solid var(--line); padding: 4px 20px;
  display: flex; justify-content: space-between; font-size: 0.7rem; color: var(--muted); z-index: 100;
  font-family: var(--font-mono);
}
.status-bar .active { color: var(--teal); }

/* ── Tooltip ── */
.tooltip {
  display: none; position: fixed; background: var(--surface); border: 1px solid var(--line);
  box-shadow: var(--shadow-soft); padding: 10px 14px; font-size: 0.72rem;
  max-width: 280px; z-index: 1000; line-height: 1.6; pointer-events: none;
  border-radius: var(--radius-sm);
}
.tooltip.show { display: block; }
.tooltip-title { color: var(--teal); font-weight: 600; margin-bottom: 4px; }
.tooltip-time { color: var(--navy); font-size: 0.65rem; font-family: var(--font-mono); }
.tooltip-detail { color: var(--ink-soft); margin-top: 4px; }

/* ── Modal ── */
.modal-overlay {
  display: none; position: fixed; inset: 0; background: rgba(23,33,43,0.5);
  backdrop-filter: blur(4px);
  z-index: 5000; align-items: center; justify-content: center;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--surface); border: 1px solid var(--line);
  box-shadow: 0 24px 48px rgba(23,33,43,0.2);
  border-radius: var(--radius-md);
  width: 440px; max-width: 95vw; animation: modalIn 0.25s ease-out; overflow: hidden;
}
@keyframes modalIn { from { opacity:0; transform:scale(0.95) translateY(10px); } to { opacity:1; transform:scale(1) translateY(0); } }
.modal-title {
  font-family: var(--font-display); font-size: 0.75rem; color: var(--teal);
  padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--surface-alt);
  letter-spacing: 0.15em; text-transform: uppercase; font-weight: 600;
}
.modal-form { padding: 16px; display: grid; grid-template-columns: 90px 1fr; gap: 10px; align-items: center; }
.modal-form label { font-size: 0.65rem; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; font-family: var(--font-display); font-weight: 600; }
.modal-form input, .modal-form select, .modal-form textarea {
  background: var(--surface-alt); border: 1px solid var(--line); color: var(--ink);
  font-family: var(--font-body); font-size: 0.8rem; padding: 7px 10px; outline: none;
  border-radius: var(--radius-sm); width: 100%;
}
.modal-form textarea { resize: vertical; min-height: 40px; }
.modal-form input:focus, .modal-form select:focus, .modal-form textarea:focus {
  border-color: var(--teal); box-shadow: 0 0 0 3px var(--teal-soft);
}
.modal-form select option { background: var(--surface); color: var(--ink); }
.modal-form .checkbox-row { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; margin-top: 4px; }
.modal-form .checkbox-row input { width: auto; }
.modal-form .checkbox-row label { font-size: 0.65rem; color: var(--amber); cursor: pointer; }
.modal-actions { padding: 12px 16px; border-top: 1px solid var(--line); display: flex; gap: 10px; }
.btn-confirm, .btn-abort, .btn-delete-modal {
  font-family: var(--font-display); font-size: 0.7rem; padding: 8px 20px;
  cursor: pointer; letter-spacing: 0.08em; border-radius: 999px; transition: all 0.15s;
  font-weight: 600; text-transform: uppercase;
}
.btn-confirm { background: var(--teal); border: 1px solid transparent; color: #fff; box-shadow: var(--shadow-cut); }
.btn-confirm:hover { transform: translateY(-1px); box-shadow: 0 8px 18px rgba(23,33,43,0.16); }
.btn-abort { background: var(--surface-alt); border: 1px solid var(--line); color: var(--muted); }
.btn-abort:hover { border-color: var(--amber); color: #a07830; }
.btn-delete-modal { background: rgba(200,107,75,0.08); border: 1px solid rgba(200,107,75,0.3); color: var(--clay); margin-left: auto; }
.btn-delete-modal:hover { background: rgba(200,107,75,0.15); transform: translateY(-1px); }

/* ── Confirm Dialog ── */
.confirm-overlay {
  display: none; position: fixed; inset: 0; background: rgba(23,33,43,0.5);
  backdrop-filter: blur(4px);
  z-index: 6000; align-items: center; justify-content: center;
}
.confirm-overlay.open { display: flex; }
.confirm-box {
  background: var(--surface); border: 1px solid var(--line);
  box-shadow: 0 24px 48px rgba(23,33,43,0.2); padding: 20px 24px; max-width: 400px;
  text-align: center; animation: modalIn 0.2s ease-out; border-radius: var(--radius-md);
}
.confirm-msg { color: var(--ink); font-size: 0.8rem; margin-bottom: 16px; line-height: 1.5; }
.confirm-msg strong { color: var(--clay); }
.confirm-actions { display: flex; gap: 10px; justify-content: center; }

/* ── Boot ── */
.boot-overlay {
  position: fixed; inset: 0; background: var(--canvas); z-index: 10000;
  display: flex; align-items: center; justify-content: center; flex-direction: column;
  font-family: var(--font-mono); color: var(--teal); transition: opacity 0.5s;
}
.boot-overlay.done { opacity: 0; pointer-events: none; }
.boot-text { font-size: 0.8rem; line-height: 1.8; text-align: left; max-width: 500px; }
.boot-line { opacity: 0; }
.boot-line.show { opacity: 1; }

/* ── Export Button ── */
.btn-export {
  font-family: var(--font-display); font-size: 0.65rem; padding: 8px 16px;
  cursor: pointer; letter-spacing: 0.1em; border-radius: 999px; transition: all 0.2s;
  background: var(--navy-soft); border: 1px solid rgba(28,61,90,0.3); color: var(--navy);
  font-weight: 600; text-transform: uppercase; box-shadow: var(--shadow-cut);
}
.btn-export:hover { transform: translateY(-1px); box-shadow: 0 8px 18px rgba(23,33,43,0.16); }
.btn-export.exporting { opacity: 0.5; pointer-events: none; }

/* ── Checklist Module ── */
.checklist-panel { margin-bottom: 20px; }
.checklist-add-row {
  display: flex; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--line);
}
.checklist-add-row input {
  flex: 1; background: var(--surface-alt); border: 1px solid var(--line);
  color: var(--ink); font-family: var(--font-body); font-size: 0.8rem;
  padding: 7px 10px; outline: none; border-radius: var(--radius-sm);
}
.checklist-add-row input:focus { border-color: var(--teal); box-shadow: 0 0 0 3px var(--teal-soft); }
.checklist-add-row input::placeholder { color: var(--muted); }
.checklist-add-btn {
  font-family: var(--font-display); font-size: 0.75rem; padding: 7px 16px;
  background: var(--teal); border: 1px solid transparent; color: #fff;
  cursor: pointer; border-radius: 999px; transition: all 0.15s; white-space: nowrap;
  font-weight: 600; box-shadow: var(--shadow-cut);
}
.checklist-add-btn:hover { transform: translateY(-1px); box-shadow: 0 8px 18px rgba(23,33,43,0.16); }
.checklist-items { padding: 0; }
.checklist-item {
  display: flex; align-items: center; gap: 10px; padding: 10px 16px;
  border-bottom: 1px solid var(--line); font-size: 0.85rem; transition: background 0.15s;
}
.checklist-item:hover { background: var(--teal-bg); }
.checklist-item:last-child { border-bottom: none; }
.checklist-check {
  width: 16px; height: 16px; border: 1px solid var(--line-strong); background: transparent;
  cursor: pointer; border-radius: 4px; display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; color: var(--teal); font-size: 11px; transition: all 0.15s;
}
.checklist-check:hover { background: var(--teal-soft); border-color: var(--teal); }
.checklist-check.done { background: var(--teal-soft); border-color: var(--teal); }
.checklist-item-text { flex: 1; color: var(--ink); line-height: 1.4; }
.checklist-item-text.done { text-decoration: line-through; opacity: 0.4; }
.checklist-item-x {
  width: 16px; height: 16px; display: none; align-items: center; justify-content: center;
  font-size: 9px; color: var(--clay); cursor: pointer; border-radius: 4px;

var events = [];

function loadEvents() {

  events = JSON.parse(JSON.stringify(DEFAULT_EVENTS));

}

function renderStats() {
  var total = events.length;
  var conflicts = events.filter(function(e){ return e.conflict; }).length;
  var el = document.getElementById('headerStats');
  while (el.firstChild) el.removeChild(el.firstChild);

  var items = [
    { pre: '', icon: 'blink', label: 'STATUS:', val: 'ACTIVE', cls: 'val' },
    { label: 'PERIOD:', val: 'APR 7 \u2013 MAY 8, 2026', cls: 'val' },
    { label: 'CONFLICTS:', val: conflicts + ' DETECTED', cls: 'val-crit', icon2: 'blink blink-warn' },
    { label: 'BLOCKS:', val: total + ' SCHEDULED', cls: 'val' },
  ];
  items.forEach(function(it) {
    var sp = document.createElement('span');
    if (it.icon) { var b = document.createElement('span'); b.className = it.icon; sp.appendChild(b); }
    sp.appendChild(document.createTextNode(' ' + it.label + ' '));
    var v = document.createElement('span'); v.className = it.cls; v.textContent = it.val; sp.appendChild(v);
    if (it.icon2) { var b2 = document.createElement('span'); b2.className = it.icon2; sp.appendChild(document.createTextNode(' ')); sp.appendChild(b2); }
    el.appendChild(sp);
  });
}

function renderWeeks() {
  var container = document.getElementById('weeksContainer');
  while (container.firstChild) container.removeChild(container.firstChild);

  WEEK_DEFS.forEach(function(wdef) {
    var dates = getWeekDates(wdef.mon);
    var weekEvents = events.filter(function(ev) { return dates.indexOf(ev.date) !== -1; });

    var panel = document.createElement('div');
    panel.className = 'panel';

    var title = document.createElement('div');
    title.className = 'panel-title';
    title.textContent = wdef.label;
    var tag = document.createElement('span');
    tag.className = 'tag';
    tag.textContent = wdef.tag;
    title.appendChild(tag);
    panel.appendChild(title);

    var grid = document.createElement('div');
    grid.className = 'week-grid';

    // Time header cell
    var th = document.createElement('div');
    th.className = 'time-header';
    grid.appendChild(th);

    // Day headers with + buttons
    dates.forEach(function(dateIso, i) {
      var dh = document.createElement('div');
      dh.className = 'day-header';
      dh.appendChild(document.createTextNode(DAY_NAMES[i]));
      var ds = document.createElement('span');
      ds.className = 'date';
      ds.textContent = displayDate(dateIso);
      dh.appendChild(ds);
      var addBtn = document.createElement('span');
      addBtn.className = 'day-add-btn';
      addBtn.textContent = '+';
      addBtn.title = 'Add event on ' + displayDate(dateIso);
      addBtn.addEventListener('click', (function(d) { return function(e) { e.stopPropagation(); openModal('add', null, d); }; })(dateIso));
      dh.appendChild(addBtn);
      grid.appendChild(dh);
    });

    // Time labels column
    var timeCol = document.createElement('div');
    timeCol.className = 'time-col';
    timeCol.style.height = (TOTAL_HOURS * HOUR_PX) + 'px';
    for (var h = START_HOUR; h <= END_HOUR; h++) {
      var lbl = document.createElement('div');
      lbl.className = 'time-label';
      lbl.style.top = ((h - START_HOUR) * HOUR_PX) + 'px';
      var ap = h >= 12 ? 'p' : 'a';
      var hh = h > 12 ? h - 12 : h;
      lbl.textContent = hh + ap;
      timeCol.appendChild(lbl);
    }
    grid.appendChild(timeCol);

    // Day columns
    dates.forEach(function(dateIso, dayIdx) {
      var dayEvts = weekEvents.filter(function(ev) { return ev.date === dateIso; });
      dayEvts.sort(function(a,b) { return (a.sh*60+a.sm) - (b.sh*60+b.sm); });

      var col = document.createElement('div');
      col.className = 'day-col';
      col.style.height = (TOTAL_HOURS * HOUR_PX) + 'px';

      // Click empty space to add
      col.addEventListener('click', (function(d) {
        return function(e) { if (e.target === col) openModal('add', null, d); };
      })(dateIso));

      for (var hr = 0; hr <= TOTAL_HOURS; hr++) {
        var line = document.createElement('div');
        line.className = 'hour-line';
        line.style.top = (hr * HOUR_PX) + 'px';
        col.appendChild(line);
        if (hr < TOTAL_HOURS) {
          var half = document.createElement('div');
          half.className = 'hour-line half';
          half.style.top = (hr * HOUR_PX + HOUR_PX / 2) + 'px';
          col.appendChild(half);
        }
      }

      dayEvts.forEach(function(ev, evIdx) {
        col.appendChild(createEventBlock(ev, dayIdx, evIdx));
      });

      grid.appendChild(col);
    });

    panel.appendChild(grid);
    container.appendChild(panel);
  });
}

function createEventBlock(ev, dayIdx, evIdx) {
  var top = timeToY(ev.sh, ev.sm);
  var height = durationPx(ev.sh, ev.sm, ev.eh, ev.em);
  if (height < 28) height = 28;

  var el = document.createElement('div');
  el.className = 'ev ev-' + ev.type;
  if (ev.conflict) el.className += ' ev-conflict';
  el.style.top = top + 'px';
  el.style.height = height + 'px';
  el.style.animationDelay = (dayIdx * 0.08 + evIdx * 0.05) + 's';

  var timeStr = fmtTime(ev.sh, ev.sm) + '\u2013' + fmtTime(ev.eh, ev.em);

  // X delete button
  var xBtn = document.createElement('span');
  xBtn.className = 'ev-x';
  xBtn.textContent = '\u2715';
  xBtn.addEventListener('click', (function(evt) { return function(e) { e.stopPropagation(); showDeleteConfirm(evt.id, evt.name); }; })(ev));
  el.appendChild(xBtn);

  var nameDiv = document.createElement('div');
  nameDiv.className = 'ev-name';
  nameDiv.textContent = ev.name;
  el.appendChild(nameDiv);

  if (height > 30) {
    var timeDiv = document.createElement('div');
    timeDiv.className = 'ev-time';
    timeDiv.textContent = timeStr;
    el.appendChild(timeDiv);
  }
  if (height > 50) {
    var detDiv = document.createElement('div');
    detDiv.className = 'ev-detail';
    detDiv.textContent = (ev.detail || '').split('\u2014')[0].trim();
    el.appendChild(detDiv);
  }

  // Click to edit
  el.addEventListener('click', (function(evt) { return function() { openModal('edit', evt); }; })(ev));

  // Tooltip
  el.addEventListener('mouseenter', (function(evt, ts) {
    return function() {
      document.getElementById('ttTitle').textContent = evt.name;
      document.getElementById('ttTime').textContent = ts;
      document.getElementById('ttDetail').textContent = evt.detail || '';
      document.getElementById('tooltip').classList.add('show');
    };
  })(ev, timeStr));
  el.addEventListener('mousemove', function(e) {
    var tt = document.getElementById('tooltip');
    var x = e.clientX + 12, y = e.clientY + 12;
    if (x + 280 > window.innerWidth) x = e.clientX - 290;
    if (y + 100 > window.innerHeight) y = e.clientY - 110;
    tt.style.left = x + 'px'; tt.style.top = y + 'px';
  });
  el.addEventListener('mouseleave', function() { document.getElementById('tooltip').classList.remove('show'); });

  return el;
}

function renderBeyond() {
  var allWeekDates = [];
  WEEK_DEFS.forEach(function(w) { allWeekDates = allWeekDates.concat(getWeekDates(w.mon)); });
  var beyondEvts = events.filter(function(ev) { return allWeekDates.indexOf(ev.date) === -1; });
  beyondEvts.sort(function(a,b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : (a.sh*60+a.sm) - (b.sh*60+b.sm); });

  // Group by date
  var grouped = {};
  beyondEvts.forEach(function(ev) {

    grouped[ev.date].push(ev);

  var dateKeys = Object.keys(grouped).sort();

  var panel = document.getElementById('beyondPanel');
  while (panel.firstChild) panel.removeChild(panel.firstChild);

  var title = document.createElement('div');
  title.className = 'panel-title';
  title.textContent = 'BEYOND // UPCOMING OPS';
  var tag = document.createElement('span');
  tag.className = 'tag';
  tag.textContent = dateKeys.length > 0 ? displayDate(dateKeys[0]) + ' \u2013 ' + displayDate(dateKeys[dateKeys.length-1]) : 'NONE';

      var textSpan = document.createElement('span');

      if (ev.detail) textSpan.textContent += ' (' + ev.detail + ')';

      xBtn.textContent = '\u2715';

      row.appendChild(xBtn);

      panel.appendChild(row);
    });

  if (dateKeys.length === 0) {
    var empty = document.createElement('div');
    empty.style.cssText = 'padding: 16px; color: var(--text-dim); font-size: 0.7rem; text-align: center;';

function renderChecklist() {
  var panel = document.getElementById('checklistPanel');
  while (panel.firstChild) panel.removeChild(panel.firstChild);

  var title = document.createElement('div');
  title.className = 'panel-title';
  title.textContent = 'ADDITIONAL MUST-COMPLETE CHECKLIST';
  var tag = document.createElement('span');
  tag.className = 'tag';
  var doneCount = checklist.filter(function(c) { return c.done; }).length;
  tag.textContent = doneCount + '/' + checklist.length + ' DONE';
  title.appendChild(tag);
  panel.appendChild(title);

  // Add row with section selector
  var addRow = document.createElement('div');
  addRow.className = 'checklist-add-row';
  var addSec = document.createElement('select');
  addSec.id = 'clAddSection';
  SECTION_ORDER.forEach(function(s) {
    var opt = document.createElement('option');
    opt.value = s; opt.textContent = s;
    addSec.appendChild(opt);
  });
  addRow.appendChild(addSec);
  var addInput = document.createElement('input');
  addInput.type = 'text';
  addInput.placeholder = 'Add task...';
  addInput.id = 'clAddInput';
  addInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') addChecklistItem();
  });
  addRow.appendChild(addInput);
  var addBtn = document.createElement('button');
  addBtn.className = 'checklist-add-btn';
  addBtn.textContent = '+ ADD';
  addBtn.addEventListener('click', addChecklistItem);
  addRow.appendChild(addBtn);
  panel.appendChild(addRow);

  // Group by section
  var grouped = {};
  SECTION_ORDER.forEach(function(s) { grouped[s] = []; });
  checklist.forEach(function(item) {
    var sec = item.section || 'MUST TODAY';
    if (!grouped[sec]) grouped[sec] = [];
    grouped[sec].push(item);
  });

  SECTION_ORDER.forEach(function(sec) {
    var items = grouped[sec];
    if (items.length === 0) return;

    var secDone = items.filter(function(i) { return i.done; }).length;

    // Section header
    var secHeader = document.createElement('div');
    secHeader.className = 'checklist-section ' + (SECTION_CSS[sec] || '');
    secHeader.textContent = sec;
    var secCount = document.createElement('span');
    secCount.className = 'sec-count';
    secCount.textContent = secDone + '/' + items.length;
    secHeader.appendChild(secCount);
    panel.appendChild(secHeader);

    // Items in this section
    items.forEach(function(item) {
      var row = document.createElement('div');
      row.className = 'checklist-item';

      var check = document.createElement('span');
      check.className = 'checklist-check' + (item.done ? ' done' : '');
      check.textContent = item.done ? '\u2713' : '';
      check.addEventListener('click', (function(id) {
        return function() { toggleChecklistItem(id); };
      })(item.id));
      row.appendChild(check);

      var text = document.createElement('span');
      text.className = 'checklist-item-text' + (item.done ? ' done' : '');
      text.textContent = item.text;
      row.appendChild(text);

      var xBtn = document.createElement('span');
      xBtn.className = 'checklist-item-x';
      xBtn.textContent = '\u2715';
      xBtn.addEventListener('click', (function(id) {
        return function() { deleteChecklistItem(id); };
      })(item.id));
      row.appendChild(xBtn);

      panel.appendChild(row);
    });
  });
}

function addChecklistItem() {
  var input = document.getElementById('clAddInput');
  var secSelect = document.getElementById('clAddSection');
  var text = input.value.trim();
  if (!text) return;
  var section = secSelect ? secSelect.value : 'MUST TODAY';
  checklist.push({ id: genId(), section: section, text: text, done: false });
  saveChecklist();
  renderChecklist();
  setTimeout(function() { document.getElementById('clAddInput').focus(); }, 10);
}

function toggleChecklistItem(id) {
  for (var i = 0; i < checklist.length; i++) {
    if (checklist[i].id === id) { checklist[i].done = !checklist[i].done; break; }
  }
  saveChecklist();
  renderChecklist();
}

function deleteChecklistItem(id) {
  checklist = checklist.filter(function(c) { return c.id !== id; });
  saveChecklist();
  renderChecklist();
}

function exportToPNG() {
  var btn = document.getElementById('btnExport');
  btn.classList.add('exporting');
  btn.textContent = 'EXPORTING...';

  // Export mode kills animations, pseudo-elements, and interactive UI via CSS
  document.body.classList.add('export-mode');

  // Small delay to let browser repaint with export-mode styles
  setTimeout(function() {
    var wrapper = document.getElementById('mainContent');
    html2canvas(wrapper, {
      backgroundColor: '#f7f5ef',
      scale: 2,
      useCORS: true,
      logging: false,
      scrollX: 0,
      scrollY: 0,
      width: wrapper.scrollWidth,
      height: wrapper.scrollHeight,
      onclone: function(clonedDoc) {
        // Force all events visible in cloned DOM
        var evs = clonedDoc.querySelectorAll('.ev, .blink');
        for (var i = 0; i < evs.length; i++) {
          evs[i].style.opacity = '1';
          evs[i].style.transform = 'none';
          evs[i].style.animation = 'none';
        }
      }
    }).then(function(canvas) {
      var link = document.createElement('a');
      link.download = 'mission-control-schedule.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
      document.body.classList.remove('export-mode');
      btn.classList.remove('exporting');
      btn.textContent = '\u21A1 EXPORT PNG';
    }).catch(function(err) {
      console.error('Export failed:', err);
      document.body.classList.remove('export-mode');
      btn.classList.remove('exporting');
      btn.textContent = '\u21A1 EXPORT PNG';
    });
  }, 100);
}

// ═══════════════════════════════════════════════
//  MODAL CRUD
// ═══════════════════════════════════════════════
function openModal(mode, ev, preDate) {
  document.getElementById('tooltip').classList.remove('show');
  editingId = null;
  var titleEl = document.getElementById('modalTitle');
  var delBtn = document.getElementById('btnDeleteModal');

  if (mode === 'edit' && ev) {
    editingId = ev.id;
    titleEl.textContent = '\u25B6 EDIT OPERATION';
    document.getElementById('evName').value = ev.name;
    document.getElementById('evDate').value = ev.date;
    document.getElementById('evStart').value = timeInputVal(ev.sh, ev.sm);
    document.getElementById('evEnd').value = timeInputVal(ev.eh, ev.em);
    document.getElementById('evType').value = ev.type;
    document.getElementById('evDetail').value = ev.detail || '';
    document.getElementById('evConflict').checked = ev.conflict || false;
    delBtn.style.display = '';
  } else {
    titleEl.textContent = '\u25B6 NEW OPERATION';
    document.getElementById('evName').value = '';
    document.getElementById('evDate').value = preDate || '';
    document.getElementById('evStart').value = '08:30';
    document.getElementById('evEnd').value = '11:30';
    document.getElementById('evType').value = 'patient';
    document.getElementById('evDetail').value = '';
    document.getElementById('evConflict').checked = false;
    delBtn.style.display = 'none';
  }

  document.getElementById('modalOverlay').classList.add('open');
  document.getElementById('evName').focus();
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  editingId = null;
}

function saveEvent() {
  var name = document.getElementById('evName').value.trim();
  var date = document.getElementById('evDate').value;
  var startVal = document.getElementById('evStart').value;
  var endVal = document.getElementById('evEnd').value;
  var type = document.getElementById('evType').value;
  var detail = document.getElementById('evDetail').value.trim();
  var conflict = document.getElementById('evConflict').checked;

  if (!name || !date || !startVal || !endVal) return;

  var start = parseTimeInput(startVal);
  var end = parseTimeInput(endVal);

  if (editingId) {
    for (var i = 0; i < events.length; i++) {
      if (events[i].id === editingId) {
        events[i].name = name;
        events[i].date = date;
        events[i].sh = start.h; events[i].sm = start.m;
        events[i].eh = end.h; events[i].em = end.m;
        events[i].type = type;
        events[i].detail = detail;
        events[i].conflict = conflict;
        break;
      }
    }
  } else {
    events.push({
      id: genId(), date: date,
      sh: start.h, sm: start.m, eh: end.h, em: end.m,
      name: name, detail: detail, type: type, conflict: conflict
    });
  }

  saveEvents();
  closeModal();
  renderAll();
}

function deleteEvent(id) {
  events = events.filter(function(e) { return e.id !== id; });
  saveEvents();
  renderAll();
}

function showDeleteConfirm(id, name) {
  pendingDeleteId = id;
  var msg = document.getElementById('confirmMsg');
  msg.textContent = '';
  msg.appendChild(document.createTextNode('CONFIRM DELETION OF '));
  var strong = document.createElement('strong');
  strong.textContent = '"' + name + '"';
  msg.appendChild(strong);
  msg.appendChild(document.createTextNode('?'));
  document.getElementById('confirmOverlay').classList.add('open');
}

function closeConfirm() {
  document.getElementById('confirmOverlay').classList.remove('open');
  pendingDeleteId = null;
}

// ── Wire up buttons ──
document.getElementById('btnSave').addEventListener('click', saveEvent);
document.getElementById('btnAbort').addEventListener('click', closeModal);
document.getElementById('btnDeleteModal').addEventListener('click', function() {
  if (editingId) {
    closeModal();
    var ev = events.find(function(e) { return e.id === editingId; });
    showDeleteConfirm(editingId, ev ? ev.name : '');
  }
});
document.getElementById('btnConfirmYes').addEventListener('click', function() {
  if (pendingDeleteId) deleteEvent(pendingDeleteId);
  closeConfirm();
});
document.getElementById('btnConfirmNo').addEventListener('click', closeConfirm);
document.getElementById('btnNewOp').addEventListener('click', function() { openModal('add', null, ''); });
document.getElementById('btnExport').addEventListener('click', exportToPNG);
document.getElementById('btnReset').addEventListener('click', function() {
  pendingDeleteId = '__RESET__';
  var msg = document.getElementById('confirmMsg');
  msg.textContent = '';
  msg.appendChild(document.createTextNode('RESET ALL DATA TO DEFAULTS? '));
  var strong = document.createElement('strong');
  strong.textContent = 'THIS CANNOT BE UNDONE.';
  msg.appendChild(strong);
  document.getElementById('confirmOverlay').classList.add('open');
  // Override confirm handler for reset (resetEvents also clears checklist)
  document.getElementById('btnConfirmYes').onclick = function() {
    resetEvents();
    closeConfirm();
    // Restore normal handler
    document.getElementById('btnConfirmYes').onclick = function() {
      if (pendingDeleteId) deleteEvent(pendingDeleteId);
      closeConfirm();
    };
  };
});

// Keyboard shortcuts
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    if (document.getElementById('confirmOverlay').classList.contains('open')) closeConfirm();
    else if (document.getElementById('modalOverlay').classList.contains('open')) closeModal();
  }
  if (e.key === 'Enter' && document.getElementById('modalOverlay').classList.contains('open')) {
    if (e.target.tagName !== 'TEXTAREA') saveEvent();
  }
});

// Close modals on overlay click
document.getElementById('modalOverlay').addEventListener('click', function(e) { if (e.target === this) closeModal(); });
document.getElementById('confirmOverlay').addEventListener('click', function(e) { if (e.target === this) closeConfirm(); });

// ═══════════════════════════════════════════════
//  BOOT & CLOCK
// ═══════════════════════════════════════════════
var bootLines = [
  '> INITIALIZING MISSION CONTROL v2.0...',
  '> LOADING SCHEDULE DATABASE...',
  '> SCANNING FOR CONFLICTS...',
  '> RENDERING TIMELINE GRID...',
  '> SYSTEM ONLINE \u25A0',
];

function bootSequence() {
  var overlay = document.getElementById('bootOverlay');
  var textEl = document.getElementById('bootText');
  var lineIdx = 0, charIdx = 0, currentLine = null;
  function typeLine() {
    if (lineIdx >= bootLines.length) {
      setTimeout(function() {
        overlay.classList.add('done');
        var main = document.getElementById('mainContent');
        main.style.transition = 'opacity 0.8s';
        main.style.opacity = '1';
        setTimeout(function() { overlay.remove(); }, 600);
      }, 300);
      return;
    }
    if (charIdx === 0) {
      currentLine = document.createElement('div');
      currentLine.className = 'boot-line show';
      textEl.appendChild(currentLine);
    }
    var text = bootLines[lineIdx];
    if (charIdx < text.length) {
      currentLine.textContent = text.substring(0, charIdx + 1);
      charIdx++;
      setTimeout(typeLine, text[charIdx-1] === '.' ? 30 : 10);
    } else {
      lineIdx++; charIdx = 0;
      setTimeout(typeLine, 100);
    }
  }
  typeLine();
}

function updateClock() {
  var now = new Date();
  document.getElementById('statusClock').textContent =
    String(now.getHours()).padStart(2,'0') + ':' +
    String(now.getMinutes()).padStart(2,'0') + ':' +
    String(now.getSeconds()).padStart(2,'0') + ' EST';
}

// ── Init ──
document.addEventListener('DOMContentLoaded', function() {
  loadEvents();
  loadChecklist();
  renderAll();
  updateClock();
  setInterval(updateClock, 1000);
  bootSequence();
});
</script>
