<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MISSION CONTROL // CLINIC OPS APRIL 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg-deep: #050a0e;
  --bg-panel: #0a1118;
  --bg-card: #0f1923;
  --green: #00ff41;
  --green-dim: #00cc33;
  --green-muted: #0a3a1a;
  --green-glow: rgba(0,255,65,0.15);
  --cyan: #00e5ff;
  --cyan-dim: #0097a7;
  --amber: #ffb300;
  --amber-dim: #ff8f00;
  --red: #ff1744;
  --magenta: #e040fb;
  --purple: #b388ff;
  --text: #cfd8dc;
  --text-dim: #78909c;
  --border: #1a2a35;
  --border-bright: #1e3a4a;
  --hour-height: 64px;
}
html { font-size: 17px; }
body {
  background: var(--bg-deep);
  color: var(--text);
  font-family: 'Share Tech Mono', 'Courier New', monospace;
  min-height: 100vh;
  overflow-x: hidden;
}
body::after {
  content: '';
  position: fixed; inset: 0;
  background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.08) 2px, rgba(0,0,0,0.08) 4px);
  pointer-events: none; z-index: 9999;
}
body::before {
  content: '';
  position: fixed; inset: 0;
  background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.6) 100%);
  pointer-events: none; z-index: 9998;
}
.wrapper { max-width: 1600px; margin: 0 auto; padding: 16px 20px 40px; }

/* ── Header ── */
.header {
  border: 1px solid var(--green);
  box-shadow: 0 0 15px var(--green-glow), inset 0 0 15px rgba(0,255,65,0.03);
  padding: 16px 24px;
  margin-bottom: 20px;
  background: linear-gradient(180deg, rgba(0,255,65,0.04) 0%, transparent 100%);
  position: relative;
}
.header::before, .header::after {
  content: '//'; position: absolute; color: var(--green-dim); opacity: 0.3; font-size: 11px;
}
.header::before { top: 4px; left: 8px; }
.header::after { bottom: 4px; right: 8px; }
.header-top { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 8px; }
.header-title {
  font-family: 'Orbitron', monospace; font-weight: 900; font-size: 1.5rem;
  color: var(--green); text-shadow: 0 0 20px var(--green-glow); letter-spacing: 3px;
}
.header-title .sep { opacity: 0.4; }
.header-btns { display: flex; gap: 8px; }
.btn-new-op, .btn-reset {
  font-family: 'Orbitron', monospace; font-size: 0.65rem; padding: 8px 16px;
  cursor: pointer; letter-spacing: 2px; border-radius: 2px; transition: all 0.2s;
}
.btn-new-op {
  background: rgba(0,255,65,0.08); border: 1px solid var(--green-dim); color: var(--green);
}
.btn-new-op:hover { background: rgba(0,255,65,0.18); box-shadow: 0 0 15px var(--green-glow); }
.btn-reset {
  background: rgba(255,179,0,0.06); border: 1px solid rgba(255,179,0,0.3); color: var(--amber);
}
.btn-reset:hover { background: rgba(255,179,0,0.15); box-shadow: 0 0 10px rgba(255,179,0,0.2); }
.header-sub {
  display: flex; gap: 32px; flex-wrap: wrap; font-size: 0.9rem; color: var(--text-dim); letter-spacing: 1px;
}
.header-sub span { display: inline-flex; align-items: center; gap: 6px; }
.header-sub .val { color: var(--green); }
.header-sub .val-crit { color: var(--red); }
.blink {
  display: inline-block; width: 6px; height: 6px; border-radius: 50%;
  background: var(--green); box-shadow: 0 0 6px var(--green);
  animation: blink 1.5s ease-in-out infinite;
}
.blink-warn { background: var(--amber); box-shadow: 0 0 6px var(--amber); }
@keyframes blink { 0%,100% { opacity:1; } 50% { opacity:0.2; } }

/* ── Panel ── */
.panel {
  border: 1px solid var(--border-bright); background: var(--bg-panel);
  position: relative; margin-bottom: 20px;
}
.panel::before {
  content: ''; position: absolute; top: -1px; left: 12px;
  width: 8px; height: 8px; border-top: 1px solid var(--green-dim); border-left: 1px solid var(--green-dim); z-index: 2;
}
.panel::after {
  content: ''; position: absolute; bottom: -1px; right: 12px;
  width: 8px; height: 8px; border-bottom: 1px solid var(--green-dim); border-right: 1px solid var(--green-dim); z-index: 2;
}
.panel-title {
  font-family: 'Orbitron', monospace; font-weight: 700; font-size: 0.85rem;
  color: var(--green); letter-spacing: 2px; padding: 12px 16px 10px;
  border-bottom: 1px solid var(--border); background: rgba(0,255,65,0.03);
  text-shadow: 0 0 10px var(--green-glow);
  display: flex; justify-content: space-between; align-items: center;
}
.panel-title .tag { font-family: 'Share Tech Mono', monospace; font-size: 0.75rem; color: var(--text-dim); letter-spacing: 0; }

/* ── Weeks ── */
.weeks { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
@media (max-width: 1100px) { .weeks { grid-template-columns: 1fr; } }

/* ── Day Grid ── */
.week-grid { display: grid; grid-template-columns: 44px repeat(5,1fr); gap: 0; padding: 0 8px 12px; }
.day-header {
  font-family: 'Orbitron', monospace; font-size: 0.7rem; font-weight: 700;
  text-align: center; padding: 10px 2px; letter-spacing: 1px;
  color: var(--cyan); border-bottom: 1px solid var(--border); position: relative;
}
.day-header .date { display: block; font-family: 'Share Tech Mono', monospace; font-size: 0.8rem; color: var(--text-dim); margin-top: 2px; letter-spacing: 0; }
.day-add-btn {
  display: inline-block; width: 14px; height: 14px; line-height: 12px; text-align: center;
  font-size: 12px; font-weight: bold; color: var(--green-dim); border: 1px solid var(--green-muted);
  border-radius: 2px; cursor: pointer; margin-left: 3px; opacity: 0; transition: opacity 0.2s; vertical-align: middle;
}
.day-header:hover .day-add-btn { opacity: 1; }
.day-add-btn:hover { background: var(--green-muted); color: var(--green); }
.time-header { font-size: 0.7rem; padding: 10px 0; text-align: right; padding-right: 6px; color: var(--text-dim); border-bottom: 1px solid var(--border); }
.time-col { padding-right: 4px; position: relative; }
.time-label { position: absolute; right: 4px; font-size: 0.65rem; color: var(--text-dim); transform: translateY(-50%); white-space: nowrap; }
.day-col { position: relative; border-left: 1px solid rgba(26,42,53,0.6); }
.hour-line { position: absolute; left: 0; right: 0; height: 1px; background: rgba(26,42,53,0.5); }
.hour-line.half { background: rgba(26,42,53,0.25); }

/* ── Events ── */
.ev {
  position: absolute; left: 3px; right: 3px; border-radius: 3px;
  padding: 4px 6px; font-size: 0.7rem; line-height: 1.35; overflow: hidden;
  z-index: 2; border-left: 3px solid; cursor: pointer;
  transition: box-shadow 0.3s, transform 0.15s;
  animation: fadeSlideIn 0.6s ease-out both;
}
.ev:hover { z-index: 10; transform: scale(1.03); }
.ev-name { font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 14px; }
.ev-time { font-size: 0.52rem; opacity: 0.8; white-space: nowrap; }
.ev-detail { font-size: 0.48rem; opacity: 0.75; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ev-x {
  position: absolute; top: 2px; right: 2px; width: 14px; height: 14px;
  display: none; align-items: center; justify-content: center;
  font-size: 9px; color: var(--red); cursor: pointer; border-radius: 2px;
  background: rgba(0,0,0,0.6); z-index: 20; line-height: 1;
}
.ev:hover .ev-x { display: flex; }
.ev-x:hover { background: var(--red); color: #fff; }

.ev-rotation-bg {
  background: repeating-linear-gradient(-45deg, rgba(0,255,65,0.03), rgba(0,255,65,0.03) 4px, transparent 4px, transparent 8px);
  border-color: var(--green-muted); color: var(--green-dim); z-index: 0; border-left-width: 2px; opacity: 0.7;
}
.ev-rotation-bg .ev-name { font-size: 0.7rem; }
.ev-patient { background: rgba(0,229,255,0.08); border-color: var(--cyan); color: var(--cyan); }
.ev-patient:hover { box-shadow: 0 0 12px rgba(0,229,255,0.3); }
.ev-lab { background: rgba(224,64,251,0.08); border-color: var(--magenta); color: var(--magenta); }
.ev-lab:hover { box-shadow: 0 0 12px rgba(224,64,251,0.3); }
.ev-meeting { background: rgba(255,179,0,0.08); border-color: var(--amber); color: var(--amber-dim); }
.ev-meeting:hover { box-shadow: 0 0 12px rgba(255,179,0,0.2); }
.ev-wa { background: rgba(179,136,255,0.08); border-color: var(--purple); color: var(--purple); }
.ev-wa:hover { box-shadow: 0 0 12px rgba(179,136,255,0.3); }
.ev-deadline {
  background: rgba(255,23,68,0.1); border-color: var(--red); color: var(--red);
  animation: fadeSlideIn 0.6s ease-out both, pulseRed 3s ease-in-out infinite;
}
.ev-exam { background: rgba(255,23,68,0.12); border-color: var(--red); color: #ff8a80; }
.ev-exam:hover { box-shadow: 0 0 12px rgba(255,23,68,0.3); }
.ev-conflict {
  box-shadow: 0 0 8px rgba(255,23,68,0.3), inset 0 0 8px rgba(255,23,68,0.05);
  outline: 1px dashed rgba(255,23,68,0.4); outline-offset: 1px;
}
@keyframes pulseRed { 0%,100% { box-shadow: 0 0 4px rgba(255,23,68,0.2); } 50% { box-shadow: 0 0 12px rgba(255,23,68,0.5); } }
@keyframes fadeSlideIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }

/* ── Bottom ── */
.bottom-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
@media (max-width: 900px) { .bottom-grid { grid-template-columns: 1fr; } }
.beyond-item {
  display: flex; gap: 10px; padding: 9px 16px; border-bottom: 1px solid var(--border);
  font-size: 0.85rem; align-items: center; cursor: pointer; transition: background 0.15s;
}
.beyond-item:last-child { border-bottom: none; }
.beyond-item:hover { background: rgba(0,229,255,0.04); }
.beyond-date { font-family: 'Orbitron', monospace; font-size: 0.75rem; color: var(--cyan); white-space: nowrap; min-width: 44px; letter-spacing: 1px; }
.beyond-text { color: var(--text); line-height: 1.5; flex: 1; }
.beyond-text .hl { color: var(--amber); }
.beyond-x {
  width: 16px; height: 16px; display: none; align-items: center; justify-content: center;
  font-size: 9px; color: var(--red); cursor: pointer; border-radius: 2px; background: rgba(0,0,0,0.5); flex-shrink: 0;
}
.beyond-item:hover .beyond-x { display: flex; }
.beyond-x:hover { background: var(--red); color: #fff; }
.beyond-add-btn {
  font-family: 'Share Tech Mono', monospace; font-size: 0.65rem; padding: 3px 10px;
  background: transparent; border: 1px solid var(--green-muted); color: var(--green-dim);
  cursor: pointer; border-radius: 2px; transition: all 0.2s; margin-left: 8px;
}
.beyond-add-btn:hover { background: var(--green-muted); color: var(--green); }

/* ── Conflicts ── */
.conflict-item {
  padding: 10px 12px; margin: 0 16px 8px; border: 1px solid; border-radius: 3px;
  font-size: 0.82rem; line-height: 1.5; position: relative; overflow: hidden;
}
.conflict-item:first-child { margin-top: 10px; }
.conflict-item:last-child { margin-bottom: 14px; }
.conflict-item::before { content: ''; position: absolute; top: 0; left: 0; bottom: 0; width: 3px; }
.conflict-high { border-color: rgba(255,23,68,0.3); background: rgba(255,23,68,0.04); }
.conflict-high::before { background: var(--red); }
.conflict-high .conflict-sev { color: var(--red); }
.conflict-med { border-color: rgba(255,179,0,0.3); background: rgba(255,179,0,0.04); }
.conflict-med::before { background: var(--amber); }
.conflict-med .conflict-sev { color: var(--amber); }
.conflict-low { border-color: rgba(0,229,255,0.2); background: rgba(0,229,255,0.03); }
.conflict-low::before { background: var(--cyan-dim); }
.conflict-low .conflict-sev { color: var(--cyan); }
.conflict-sev { font-family: 'Orbitron', monospace; font-size: 0.7rem; letter-spacing: 1px; margin-bottom: 3px; }
.conflict-desc { color: var(--text); }
.conflict-action { margin-top: 4px; color: var(--amber); font-size: 0.72rem; }

/* ── Legend ── */
.legend { display: flex; flex-wrap: wrap; gap: 16px; padding: 12px 16px; font-size: 0.75rem; border-top: 1px solid var(--border); }
.legend-item { display: inline-flex; align-items: center; gap: 5px; }
.legend-swatch { width: 10px; height: 10px; border-radius: 2px; border-left: 3px solid; }

/* ── Status Bar ── */
.status-bar {
  position: fixed; bottom: 0; left: 0; right: 0; background: var(--bg-panel);
  border-top: 1px solid var(--border-bright); padding: 4px 20px;
  display: flex; justify-content: space-between; font-size: 0.7rem; color: var(--text-dim); z-index: 100; letter-spacing: 1px;
}
.status-bar .active { color: var(--green); }

/* ── Tooltip ── */
.tooltip {
  display: none; position: fixed; background: var(--bg-card); border: 1px solid var(--green-dim);
  box-shadow: 0 0 20px rgba(0,255,65,0.15); padding: 10px 14px; font-size: 0.72rem;
  max-width: 280px; z-index: 1000; line-height: 1.6; pointer-events: none;
}
.tooltip.show { display: block; }
.tooltip-title { color: var(--green); font-weight: bold; margin-bottom: 4px; }
.tooltip-time { color: var(--cyan); font-size: 0.65rem; }
.tooltip-detail { color: var(--text); margin-top: 4px; }

/* ── Modal ── */
.modal-overlay {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85);
  z-index: 5000; align-items: center; justify-content: center;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--bg-panel); border: 1px solid var(--green);
  box-shadow: 0 0 40px var(--green-glow), 0 0 80px rgba(0,255,65,0.05);
  width: 440px; max-width: 95vw; animation: modalIn 0.25s ease-out;
}
@keyframes modalIn { from { opacity:0; transform:scale(0.95) translateY(10px); } to { opacity:1; transform:scale(1) translateY(0); } }
.modal-title {
  font-family: 'Orbitron', monospace; font-size: 0.75rem; color: var(--green);
  padding: 12px 16px; border-bottom: 1px solid var(--border); background: rgba(0,255,65,0.03);
  letter-spacing: 2px; text-shadow: 0 0 10px var(--green-glow);
}
.modal-form { padding: 16px; display: grid; grid-template-columns: 90px 1fr; gap: 10px; align-items: center; }
.modal-form label { font-size: 0.65rem; color: var(--text-dim); letter-spacing: 1px; text-transform: uppercase; }
.modal-form input, .modal-form select, .modal-form textarea {
  background: var(--bg-deep); border: 1px solid var(--border-bright); color: var(--green);
  font-family: 'Share Tech Mono', monospace; font-size: 0.75rem; padding: 7px 10px; outline: none;
  border-radius: 2px; width: 100%; color-scheme: dark;
}
.modal-form textarea { resize: vertical; min-height: 40px; }
.modal-form input:focus, .modal-form select:focus, .modal-form textarea:focus {
  border-color: var(--green-dim); box-shadow: 0 0 8px var(--green-glow);
}
.modal-form select option { background: var(--bg-deep); color: var(--text); }
.modal-form .checkbox-row { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; margin-top: 4px; }
.modal-form .checkbox-row input { width: auto; }
.modal-form .checkbox-row label { font-size: 0.65rem; color: var(--amber); cursor: pointer; }
.modal-actions { padding: 12px 16px; border-top: 1px solid var(--border); display: flex; gap: 10px; }
.btn-confirm, .btn-abort, .btn-delete-modal {
  font-family: 'Share Tech Mono', monospace; font-size: 0.7rem; padding: 8px 20px;
  cursor: pointer; letter-spacing: 1px; border-radius: 2px; transition: all 0.15s;
}
.btn-confirm { background: rgba(0,255,65,0.1); border: 1px solid var(--green-dim); color: var(--green); }
.btn-confirm:hover { background: rgba(0,255,65,0.2); box-shadow: 0 0 12px var(--green-glow); }
.btn-abort { background: transparent; border: 1px solid var(--border-bright); color: var(--text-dim); }
.btn-abort:hover { border-color: var(--amber); color: var(--amber); }
.btn-delete-modal { background: rgba(255,23,68,0.08); border: 1px solid rgba(255,23,68,0.3); color: var(--red); margin-left: auto; }
.btn-delete-modal:hover { background: rgba(255,23,68,0.2); box-shadow: 0 0 10px rgba(255,23,68,0.3); }

/* ── Confirm Dialog ── */
.confirm-overlay {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85);
  z-index: 6000; align-items: center; justify-content: center;
}
.confirm-overlay.open { display: flex; }
.confirm-box {
  background: var(--bg-panel); border: 1px solid var(--red);
  box-shadow: 0 0 30px rgba(255,23,68,0.2); padding: 20px 24px; max-width: 400px;
  text-align: center; animation: modalIn 0.2s ease-out;
}
.confirm-msg { color: var(--text); font-size: 0.8rem; margin-bottom: 16px; line-height: 1.5; }
.confirm-msg strong { color: var(--red); }
.confirm-actions { display: flex; gap: 10px; justify-content: center; }

/* ── Boot ── */
.boot-overlay {
  position: fixed; inset: 0; background: var(--bg-deep); z-index: 10000;
  display: flex; align-items: center; justify-content: center; flex-direction: column;
  font-family: 'Share Tech Mono', monospace; color: var(--green); transition: opacity 0.5s;
}
.boot-overlay.done { opacity: 0; pointer-events: none; }
.boot-text { font-size: 0.8rem; line-height: 1.8; text-align: left; max-width: 500px; }
.boot-line { opacity: 0; }
.boot-line.show { opacity: 1; }

/* ── Export Button ── */
.btn-export {
  font-family: 'Orbitron', monospace; font-size: 0.65rem; padding: 8px 16px;
  cursor: pointer; letter-spacing: 2px; border-radius: 2px; transition: all 0.2s;
  background: rgba(0,229,255,0.08); border: 1px solid var(--cyan-dim); color: var(--cyan);
}
.btn-export:hover { background: rgba(0,229,255,0.18); box-shadow: 0 0 15px rgba(0,229,255,0.2); }
.btn-export.exporting { opacity: 0.5; pointer-events: none; }

/* ── Checklist Module ── */
.checklist-panel { margin-bottom: 20px; }
.checklist-add-row {
  display: flex; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--border);
}
.checklist-add-row input {
  flex: 1; background: var(--bg-deep); border: 1px solid var(--border-bright);
  color: var(--green); font-family: 'Share Tech Mono', monospace; font-size: 0.75rem;
  padding: 7px 10px; outline: none; border-radius: 2px;
}
.checklist-add-row input:focus { border-color: var(--green-dim); box-shadow: 0 0 8px var(--green-glow); }
.checklist-add-row input::placeholder { color: var(--text-dim); }
.checklist-add-btn {
  font-family: 'Share Tech Mono', monospace; font-size: 0.75rem; padding: 7px 16px;
  background: rgba(0,255,65,0.08); border: 1px solid var(--green-dim); color: var(--green);
  cursor: pointer; border-radius: 2px; transition: all 0.15s; white-space: nowrap;
}
.checklist-add-btn:hover { background: rgba(0,255,65,0.18); box-shadow: 0 0 10px var(--green-glow); }
.checklist-items { padding: 0; }
.checklist-item {
  display: flex; align-items: center; gap: 10px; padding: 10px 16px;
  border-bottom: 1px solid var(--border); font-size: 0.85rem; transition: background 0.15s;
}
.checklist-item:hover { background: rgba(0,255,65,0.03); }
.checklist-item:last-child { border-bottom: none; }
.checklist-check {
  width: 16px; height: 16px; border: 1px solid var(--green-dim); background: transparent;
  cursor: pointer; border-radius: 2px; display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; color: var(--green); font-size: 11px; transition: all 0.15s;
}
.checklist-check:hover { background: var(--green-muted); }
.checklist-check.done { background: var(--green-muted); border-color: var(--green); }
.checklist-item-text { flex: 1; color: var(--text); line-height: 1.4; }
.checklist-item-text.done { text-decoration: line-through; opacity: 0.5; }
.checklist-item-x {
  width: 16px; height: 16px; display: none; align-items: center; justify-content: center;
  font-size: 9px; color: var(--red); cursor: pointer; border-radius: 2px;
  background: rgba(0,0,0,0.5); flex-shrink: 0;
}
.checklist-item:hover .checklist-item-x { display: flex; }
.checklist-item-x:hover { background: var(--red); color: #fff; }
.checklist-empty {
  padding: 16px; color: var(--text-dim); font-size: 0.7rem; text-align: center;
}
.checklist-section {
  font-family: 'Orbitron', monospace; font-size: 0.72rem; letter-spacing: 2px;
  padding: 12px 16px 8px; border-bottom: 1px solid var(--border);
  display: flex; justify-content: space-between; align-items: center;
}
.checklist-section .sec-count { font-family: 'Share Tech Mono', monospace; font-size: 0.7rem; letter-spacing: 0; }
.sec-must-today { color: var(--red); background: rgba(255,23,68,0.04); }
.sec-up-next { color: var(--amber); background: rgba(255,179,0,0.04); }
.sec-this-week { color: var(--cyan); background: rgba(0,229,255,0.04); }
.sec-this-month { color: var(--green); background: rgba(0,255,65,0.04); }

function getWeekDates(monIso) {
  var p = monIso.split('-').map(Number);
  var d = new Date(p[0], p[1]-1, p[2]);
  var out = [];
  for (var i = 0; i < 5; i++) {
    var dd = new Date(d.getFullYear(), d.getMonth(), d.getDate() + i);
    out.push(dd.getFullYear() + '-' + String(dd.getMonth()+1).padStart(2,'0') + '-' + String(dd.getDate()).padStart(2,'0'));
  }
  return out;
}

function displayDate(iso) {
  var p = iso.split('-').map(Number);

      timeCol.appendChild(lbl);
    }
    grid.appendChild(timeCol);

    // Day columns
    dates.forEach(function(dateIso, dayIdx) {
      var dayEvts = weekEvents.filter(function(ev) { return ev.date === dateIso; });
      dayEvts.sort(function(a,b) { return (a.sh*60+a.sm) - (b.sh*60+b.sm); });

      var col = document.createElement('div');
      col.className = 'day-col';
      col.style.height = (TOTAL_HOURS * HOUR_PX) + 'px';

      // Click empty space to add
      col.addEventListener('click', (function(d) {
        return function(e) { if (e.target === col) openModal('add', null, d); };
      })(dateIso));

      for (var hr = 0; hr <= TOTAL_HOURS; hr++) {
        var line = document.createElement('div');
        line.className = 'hour-line';
        line.style.top = (hr * HOUR_PX) + 'px';
        col.appendChild(line);
        if (hr < TOTAL_HOURS) {
          var half = document.createElement('div');
          half.className = 'hour-line half';
          half.style.top = (hr * HOUR_PX + HOUR_PX / 2) + 'px';
          col.appendChild(half);
        }
      }

      dayEvts.forEach(function(ev, evIdx) {
        col.appendChild(createEventBlock(ev, dayIdx, evIdx));
      });

      grid.appendChild(col);
    });

    panel.appendChild(grid);
    container.appendChild(panel);
  });
}

function createEventBlock(ev, dayIdx, evIdx) {
  var top = timeToY(ev.sh, ev.sm);
  var height = durationPx(ev.sh, ev.sm, ev.eh, ev.em);
  if (height < 28) height = 28;

  var el = document.createElement('div');
  el.className = 'ev ev-' + ev.type;
  if (ev.conflict) el.className += ' ev-conflict';
  el.style.top = top + 'px';
  el.style.height = height + 'px';
  el.style.animationDelay = (dayIdx * 0.08 + evIdx * 0.05) + 's';

  var timeStr = fmtTime(ev.sh, ev.sm) + '\u2013' + fmtTime(ev.eh, ev.em);

  // X delete button
  var xBtn = document.createElement('span');
  xBtn.className = 'ev-x';
  xBtn.textContent = '\u2715';
  xBtn.addEventListener('click', (function(evt) { return function(e) { e.stopPropagation(); showDeleteConfirm(evt.id, evt.name); }; })(ev));
  el.appendChild(xBtn);

  var nameDiv = document.createElement('div');
  nameDiv.className = 'ev-name';
  nameDiv.textContent = ev.name;
  el.appendChild(nameDiv);

  if (height > 30) {
    var timeDiv = document.createElement('div');
    timeDiv.className = 'ev-time';
    timeDiv.textContent = timeStr;
    el.appendChild(timeDiv);
  }
  if (height > 50) {
    var detDiv = document.createElement('div');
    detDiv.className = 'ev-detail';
    detDiv.textContent = (ev.detail || '').split('\u2014')[0].trim();
    el.appendChild(detDiv);
  }

  // Click to edit
  el.addEventListener('click', (function(evt) { return function() { openModal('edit', evt); }; })(ev));

  // Tooltip
  el.addEventListener('mouseenter', (function(evt, ts) {
    return function() {
      document.getElementById('ttTitle').textContent = evt.name;
      document.getElementById('ttTime').textContent = ts;
      document.getElementById('ttDetail').textContent = evt.detail || '';
      document.getElementById('tooltip').classList.add('show');
    };
  })(ev, timeStr));
  el.addEventListener('mousemove', function(e) {
    var tt = document.getElementById('tooltip');
    var x = e.clientX + 12, y = e.clientY + 12;
    if (x + 280 > window.innerWidth) x = e.clientX - 290;
    if (y + 100 > window.innerHeight) y = e.clientY - 110;
    tt.style.left = x + 'px'; tt.style.top = y + 'px';
  });
  el.addEventListener('mouseleave', function() { document.getElementById('tooltip').classList.remove('show'); });

  return el;
}

function renderBeyond() {
  var allWeekDates = [];
  WEEK_DEFS.forEach(function(w) { allWeekDates = allWeekDates.concat(getWeekDates(w.mon)); });
  var beyondEvts = events.filter(function(ev) { return allWeekDates.indexOf(ev.date) === -1; });
  beyondEvts.sort(function(a,b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : (a.sh*60+a.sm) - (b.sh*60+b.sm); });

  // Group by date
  var grouped = {};
  beyondEvts.forEach(function(ev) {
    if (!grouped[ev.date]) grouped[ev.date] = [];
    grouped[ev.date].push(ev);
  });
  var dateKeys = Object.keys(grouped).sort();

  var panel = document.getElementById('beyondPanel');
  while (panel.firstChild) panel.removeChild(panel.firstChild);

  var title = document.createElement('div');
  title.className = 'panel-title';
  title.textContent = 'BEYOND // UPCOMING OPS';
  var tag = document.createElement('span');
  tag.className = 'tag';
  tag.textContent = dateKeys.length > 0 ? displayDate(dateKeys[0]) + ' \u2013 ' + displayDate(dateKeys[dateKeys.length-1]) : 'NONE';
  title.appendChild(tag);
  var addBtn = document.createElement('button');
  addBtn.className = 'beyond-add-btn';
  addBtn.textContent = '+ ADD';
  addBtn.addEventListener('click', function() { openModal('add', null, ''); });
  title.appendChild(addBtn);
  panel.appendChild(title);

  dateKeys.forEach(function(dateIso) {
    grouped[dateIso].forEach(function(ev) {
      var row = document.createElement('div');
      row.className = 'beyond-item';
      row.addEventListener('click', (function(evt) { return function() { openModal('edit', evt); }; })(ev));

      var dateSpan = document.createElement('span');
      dateSpan.className = 'beyond-date';
      dateSpan.textContent = displayDate(dateIso);
      row.appendChild(dateSpan);

      var textSpan = document.createElement('span');
      textSpan.className = 'beyond-text';
      textSpan.textContent = fmtTime(ev.sh, ev.sm) + ' \u2014 ' + ev.name;
      if (ev.detail) textSpan.textContent += ' (' + ev.detail + ')';
      row.appendChild(textSpan);

      var xBtn = document.createElement('span');
      xBtn.className = 'beyond-x';
      xBtn.textContent = '\u2715';
      xBtn.addEventListener('click', (function(evt) { return function(e) { e.stopPropagation(); showDeleteConfirm(evt.id, evt.name); }; })(ev));
      row.appendChild(xBtn);

      panel.appendChild(row);
    });
  });

  if (dateKeys.length === 0) {
    var empty = document.createElement('div');
    empty.style.cssText = 'padding: 16px; color: var(--text-dim); font-size: 0.7rem; text-align: center;';
    empty.textContent = 'NO UPCOMING OPS';
    panel.appendChild(empty);
  }
}

function renderConflicts() {
  var conflictEvts = events.filter(function(e) { return e.conflict; });
  var panel = document.getElementById('conflictsPanel');
  while (panel.firstChild) panel.removeChild(panel.firstChild);

  var title = document.createElement('div');
  title.className = 'panel-title';
  title.style.cssText = 'color:var(--red); text-shadow: 0 0 10px rgba(255,23,68,0.3);';
  title.textContent = 'CONFLICTS // ALERT';
  var tag = document.createElement('span');
  tag.className = 'tag';
  tag.style.color = 'var(--red)';
  tag.textContent = conflictEvts.length + ' ACTIVE';
  title.appendChild(tag);
  panel.appendChild(title);

  if (conflictEvts.length === 0) {
    var ok = document.createElement('div');
    ok.style.cssText = 'padding: 16px; color: var(--green); font-size: 0.7rem; text-align: center;';
    ok.textContent = 'NO CONFLICTS DETECTED';
    panel.appendChild(ok);
    return;
  }

  conflictEvts.forEach(function(ev) {
    var item = document.createElement('div');
    item.className = 'conflict-item conflict-med';
    var sev = document.createElement('div');
    sev.className = 'conflict-sev';
    sev.textContent = '\u25C6 ' + displayDate(ev.date) + ' \u2014 ' + ev.name;
    item.appendChild(sev);
    var desc = document.createElement('div');
    desc.className = 'conflict-desc';
    desc.textContent = ev.detail || 'Flagged as conflict';
    item.appendChild(desc);
    panel.appendChild(item);
  });
}

function buildLegend() {
  var items = [
    { label: 'Rotation', border: '#0a3a1a', bg: 'rgba(0,255,65,0.06)' },
    { label: 'Patient', border: '#00e5ff', bg: 'rgba(0,229,255,0.08)' },
    { label: 'Lab/Sim', border: '#e040fb', bg: 'rgba(224,64,251,0.08)' },
    { label: 'Meeting', border: '#ffb300', bg: 'rgba(255,179,0,0.08)' },
    { label: 'WA (no pt)', border: '#b388ff', bg: 'rgba(179,136,255,0.08)' },
    { label: 'Deadline/Exam', border: '#ff1744', bg: 'rgba(255,23,68,0.1)' },
  ];
  var container = document.getElementById('legendContainer');
  if (container.childElementCount > 0) return; // only build once
  items.forEach(function(item) {
    var span = document.createElement('span');
    span.className = 'legend-item';
    var sw = document.createElement('span');
    sw.className = 'legend-swatch';
    sw.style.borderColor = item.border;
    sw.style.background = item.bg;
    span.appendChild(sw);
    span.appendChild(document.createTextNode(' ' + item.label));
    container.appendChild(span);
  });
}

function renderChecklist() {
  var panel = document.getElementById('checklistPanel');
  while (panel.firstChild) panel.removeChild(panel.firstChild);

  var title = document.createElement('div');
  title.className = 'panel-title';
  title.textContent = 'ADDITIONAL MUST-COMPLETE CHECKLIST';
  var tag = document.createElement('span');
  tag.className = 'tag';
  var doneCount = checklist.filter(function(c) { return c.done; }).length;
  tag.textContent = doneCount + '/' + checklist.length + ' DONE';
  title.appendChild(tag);
  panel.appendChild(title);

  // Add row with section selector
  var addRow = document.createElement('div');
  addRow.className = 'checklist-add-row';
  var addSec = document.createElement('select');
  addSec.id = 'clAddSection';
  SECTION_ORDER.forEach(function(s) {
    var opt = document.createElement('option');
    opt.value = s; opt.textContent = s;
    addSec.appendChild(opt);
  });
  addRow.appendChild(addSec);
  var addInput = document.createElement('input');
  addInput.type = 'text';
  addInput.placeholder = 'Add task...';
  addInput.id = 'clAddInput';
  addInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') addChecklistItem();
  });
  addRow.appendChild(addInput);
  var addBtn = document.createElement('button');
  addBtn.className = 'checklist-add-btn';
  addBtn.textContent = '+ ADD';
  addBtn.addEventListener('click', addChecklistItem);
  addRow.appendChild(addBtn);
  panel.appendChild(addRow);

  // Group by section
  var grouped = {};
  SECTION_ORDER.forEach(function(s) { grouped[s] = []; });
  checklist.forEach(function(item) {
    var sec = item.section || 'MUST TODAY';
    if (!grouped[sec]) grouped[sec] = [];
    grouped[sec].push(item);
  });

  SECTION_ORDER.forEach(function(sec) {
    var items = grouped[sec];
    if (items.length === 0) return;

    var secDone = items.filter(function(i) { return i.done; }).length;

    // Section header
    var secHeader = document.createElement('div');
    secHeader.className = 'checklist-section ' + (SECTION_CSS[sec] || '');
    secHeader.textContent = sec;
    var secCount = document.createElement('span');
    secCount.className = 'sec-count';
    secCount.textContent = secDone + '/' + items.length;
    secHeader.appendChild(secCount);
    panel.appendChild(secHeader);

    // Items in this section
    items.forEach(function(item) {
      var row = document.createElement('div');
      row.className = 'checklist-item';

      var check = document.createElement('span');
      check.className = 'checklist-check' + (item.done ? ' done' : '');
      check.textContent = item.done ? '\u2713' : '';
      check.addEventListener('click', (function(id) {
        return function() { toggleChecklistItem(id); };
      })(item.id));
      row.appendChild(check);

      var text = document.createElement('span');
      text.className = 'checklist-item-text' + (item.done ? ' done' : '');
      text.textContent = item.text;
      row.appendChild(text);

      var xBtn = document.createElement('span');
      xBtn.className = 'checklist-item-x';
      xBtn.textContent = '\u2715';
      xBtn.addEventListener('click', (function(id) {
        return function() { deleteChecklistItem(id); };
      })(item.id));
      row.appendChild(xBtn);

      panel.appendChild(row);
    });
  });
}

function addChecklistItem() {
  var input = document.getElementById('clAddInput');
  var secSelect = document.getElementById('clAddSection');
  var text = input.value.trim();
  if (!text) return;
  var section = secSelect ? secSelect.value : 'MUST TODAY';
  checklist.push({ id: genId(), section: section, text: text, done: false });
  saveChecklist();
  renderChecklist();
  setTimeout(function() { document.getElementById('clAddInput').focus(); }, 10);
}

function toggleChecklistItem(id) {
  for (var i = 0; i < checklist.length; i++) {
    if (checklist[i].id === id) { checklist[i].done = !checklist[i].done; break; }
  }
  saveChecklist();
  renderChecklist();
}

function deleteChecklistItem(id) {
  checklist = checklist.filter(function(c) { return c.id !== id; });
  saveChecklist();
  renderChecklist();
}

// ═══════════════════════════════════════════════
//  EXPORT TO PNG
// ═══════════════════════════════════════════════
function exportToPNG() {
  var btn = document.getElementById('btnExport');
  btn.classList.add('exporting');
  btn.textContent = 'EXPORTING...';

  // Export mode kills animations, pseudo-elements, and interactive UI via CSS
  document.body.classList.add('export-mode');

  // Small delay to let browser repaint with export-mode styles
  setTimeout(function() {
    var wrapper = document.getElementById('mainContent');
    html2canvas(wrapper, {
      backgroundColor: '#050a0e',
      scale: 2,
      useCORS: true,
      logging: false,
      scrollX: 0,
      scrollY: 0,
      width: wrapper.scrollWidth,
      height: wrapper.scrollHeight,
      onclone: function(clonedDoc) {
        // Force all events visible in cloned DOM
        var evs = clonedDoc.querySelectorAll('.ev, .blink');
        for (var i = 0; i < evs.length; i++) {
          evs[i].style.opacity = '1';
          evs[i].style.transform = 'none';
          evs[i].style.animation = 'none';
        }
      }
    }).then(function(canvas) {
      var link = document.createElement('a');
      link.download = 'mission-control-schedule.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
      document.body.classList.remove('export-mode');
      btn.classList.remove('exporting');
      btn.textContent = '\u21A1 EXPORT PNG';
    }).catch(function(err) {
      console.error('Export failed:', err);
      document.body.classList.remove('export-mode');
      btn.classList.remove('exporting');
      btn.textContent = '\u21A1 EXPORT PNG';
    });
  }, 100);
}

// ═══════════════════════════════════════════════
//  MODAL CRUD
// ═══════════════════════════════════════════════
function openModal(mode, ev, preDate) {
  document.getElementById('tooltip').classList.remove('show');
  editingId = null;
  var titleEl = document.getElementById('modalTitle');
  var delBtn = document.getElementById('btnDeleteModal');

  if (mode === 'edit' && ev) {
    editingId = ev.id;
    titleEl.textContent = '\u25B6 EDIT OPERATION';
    document.getElementById('evName').value = ev.name;
    document.getElementById('evDate').value = ev.date;
    document.getElementById('evStart').value = timeInputVal(ev.sh, ev.sm);
    document.getElementById('evEnd').value = timeInputVal(ev.eh, ev.em);
    document.getElementById('evType').value = ev.type;
    document.getElementById('evDetail').value = ev.detail || '';
    document.getElementById('evConflict').checked = ev.conflict || false;
    delBtn.style.display = '';
  } else {
    titleEl.textContent = '\u25B6 NEW OPERATION';
    document.getElementById('evName').value = '';
    document.getElementById('evDate').value = preDate || '';
    document.getElementById('evStart').value = '08:30';
    document.getElementById('evEnd').value = '11:30';
    document.getElementById('evType').value = 'patient';
    document.getElementById('evDetail').value = '';
    document.getElementById('evConflict').checked = false;
    delBtn.style.display = 'none';
  }

  document.getElementById('modalOverlay').classList.add('open');
  document.getElementById('evName').focus();
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  editingId = null;
}

function saveEvent() {
  var name = document.getElementById('evName').value.trim();
  var date = document.getElementById('evDate').value;
  var startVal = document.getElementById('evStart').value;
  var endVal = document.getElementById('evEnd').value;
  var type = document.getElementById('evType').value;
  var detail = document.getElementById('evDetail').value.trim();
  var conflict = document.getElementById('evConflict').checked;

  if (!name || !date || !startVal || !endVal) return;

  var start = parseTimeInput(startVal);
  var end = parseTimeInput(endVal);

  if (editingId) {
    for (var i = 0; i < events.length; i++) {
      if (events[i].id === editingId) {
        events[i].name = name;
        events[i].date = date;
        events[i].sh = start.h; events[i].sm = start.m;
        events[i].eh = end.h; events[i].em = end.m;
        events[i].type = type;
        events[i].detail = detail;
        events[i].conflict = conflict;
        break;
      }
    }
  } else {
    events.push({
      id: genId(), date: date,
      sh: start.h, sm: start.m, eh: end.h, em: end.m,
      name: name, detail: detail, type: type, conflict: conflict
    });
  }

  saveEvents();
  closeModal();
  renderAll();
}

function deleteEvent(id) {
  events = events.filter(function(e) { return e.id !== id; });
  saveEvents();
  renderAll();
}

function showDeleteConfirm(id, name) {
  pendingDeleteId = id;
  var msg = document.getElementById('confirmMsg');
  msg.textContent = '';
  msg.appendChild(document.createTextNode('CONFIRM DELETION OF '));
  var strong = document.createElement('strong');
  strong.textContent = '"' + name + '"';
  msg.appendChild(strong);
  msg.appendChild(document.createTextNode('?'));
  document.getElementById('confirmOverlay').classList.add('open');
}

function closeConfirm() {
  document.getElementById('confirmOverlay').classList.remove('open');
  pendingDeleteId = null;
}

// ── Wire up buttons ──
document.getElementById('btnSave').addEventListener('click', saveEvent);
document.getElementById('btnAbort').addEventListener('click', closeModal);
document.getElementById('btnDeleteModal').addEventListener('click', function() {
  if (editingId) {
    closeModal();
    var ev = events.find(function(e) { return e.id === editingId; });
    showDeleteConfirm(editingId, ev ? ev.name : '');
  }
});
document.getElementById('btnConfirmYes').addEventListener('click', function() {
  if (pendingDeleteId) deleteEvent(pendingDeleteId);
  closeConfirm();
});
document.getElementById('btnConfirmNo').addEventListener('click', closeConfirm);
document.getElementById('btnNewOp').addEventListener('click', function() { openModal('add', null, ''); });
document.getElementById('btnExport').addEventListener('click', exportToPNG);
document.getElementById('btnReset').addEventListener('click', function() {
  pendingDeleteId = '__RESET__';
  var msg = document.getElementById('confirmMsg');
  msg.textContent = '';
  msg.appendChild(document.createTextNode('RESET ALL DATA TO DEFAULTS? '));
  var strong = document.createElement('strong');
  strong.textContent = 'THIS CANNOT BE UNDONE.';
  msg.appendChild(strong);
  document.getElementById('confirmOverlay').classList.add('open');
  // Override confirm handler for reset (resetEvents also clears checklist)
  document.getElementById('btnConfirmYes').onclick = function() {
    resetEvents();
    closeConfirm();
    // Restore normal handler
    document.getElementById('btnConfirmYes').onclick = function() {
      if (pendingDeleteId) deleteEvent(pendingDeleteId);
      closeConfirm();
    };
  };
});

// Keyboard shortcuts
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    if (document.getElementById('confirmOverlay').classList.contains('open')) closeConfirm();
    else if (document.getElementById('modalOverlay').classList.contains('open')) closeModal();
  }
  if (e.key === 'Enter' && document.getElementById('modalOverlay').classList.contains('open')) {
    if (e.target.tagName !== 'TEXTAREA') saveEvent();
  }
});

// Close modals on overlay click
document.getElementById('modalOverlay').addEventListener('click', function(e) { if (e.target === this) closeModal(); });
document.getElementById('confirmOverlay').addEventListener('click', function(e) { if (e.target === this) closeConfirm(); });

// ═══════════════════════════════════════════════
//  BOOT & CLOCK
// ═══════════════════════════════════════════════
var bootLines = [
  '> INITIALIZING MISSION CONTROL v2.0...',
  '> LOADING SCHEDULE DATABASE...',
  '> SCANNING FOR CONFLICTS...',
  '> RENDERING TIMELINE GRID...',
  '> SYSTEM ONLINE \u25A0',
];

function bootSequence() {
  var overlay = document.getElementById('bootOverlay');
  var textEl = document.getElementById('bootText');
  var lineIdx = 0, charIdx = 0, currentLine = null;
  function typeLine() {
    if (lineIdx >= bootLines.length) {
      setTimeout(function() {
        overlay.classList.add('done');
        var main = document.getElementById('mainContent');
        main.style.transition = 'opacity 0.8s';
        main.style.opacity = '1';
        setTimeout(function() { overlay.remove(); }, 600);
      }, 300);
      return;
    }
    if (charIdx === 0) {
      currentLine = document.createElement('div');
      currentLine.className = 'boot-line show';
      textEl.appendChild(currentLine);
    }
    var text = bootLines[lineIdx];
    if (charIdx < text.length) {
      currentLine.textContent = text.substring(0, charIdx + 1);
      charIdx++;
      setTimeout(typeLine, text[charIdx-1] === '.' ? 30 : 10);
    } else {
      lineIdx++; charIdx = 0;
      setTimeout(typeLine, 100);
    }
  }
  typeLine();
}

function updateClock() {
  var now = new Date();
  document.getElementById('statusClock').textContent =
    String(now.getHours()).padStart(2,'0') + ':' +
    String(now.getMinutes()).padStart(2,'0') + ':' +
    String(now.getSeconds()).padStart(2,'0') + ' EST';
}

// ── Init ──
document.addEventListener('DOMContentLoaded', function() {
  loadEvents();
  loadChecklist();
  renderAll();
  updateClock();
  setInterval(updateClock, 1000);
  bootSequence();
});
