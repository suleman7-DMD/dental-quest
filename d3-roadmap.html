<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting to Graduation Roadmap...</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3a5f 0%, #2d1b4e 100%);
            min-height: 100vh;
            color: #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .redirect-box {
            text-align: center;
            background: rgba(30, 41, 59, 0.9);
            border-radius: 16px;
            padding: 32px;
            border: 1px solid #334155;
            max-width: 400px;
        }
        h2 { color: #60a5fa; margin-bottom: 12px; }
        p { color: #94a3b8; margin-bottom: 16px; }
        a { color: #60a5fa; }
    </style>
</head>
<body>
    <div class="redirect-box">
        <h2>Redirecting...</h2>
        <p>The D3 Roadmap has been upgraded to the <strong>Graduation Roadmap</strong>.</p>
        <p>If you are not redirected automatically, <a href="graduation-roadmap.html">click here</a>.</p>
    </div>
    <script>
        // ONE-TIME MIGRATION: Copy data from old localStorage key to new key
        // This ensures any data saved by the old d3-roadmap.html isn't lost
        (function() {
            try {
                var OLD_KEY = 'd3RoadmapData';
                var NEW_KEY = 'graduationRoadmapData';
                var oldData = localStorage.getItem(OLD_KEY);
                var newData = localStorage.getItem(NEW_KEY);

                if (oldData && !newData) {
                    // New key has no data — migrate old data forward
                    localStorage.setItem(NEW_KEY, oldData);
                    console.log('[D3-REDIRECT] Migrated localStorage from', OLD_KEY, 'to', NEW_KEY);
                } else if (oldData && newData) {
                    // Both exist — keep whichever is newer (by lastSaved timestamp)
                    try {
                        var oldParsed = JSON.parse(oldData);
                        var newParsed = JSON.parse(newData);
                        if ((oldParsed.lastSaved || 0) > (newParsed.lastSaved || 0)) {
                            localStorage.setItem(NEW_KEY, oldData);
                            console.log('[D3-REDIRECT] Old data was newer — migrated to new key');
                        }
                    } catch(e) {}
                }

                // Also migrate backup key
                var oldBackup = localStorage.getItem('d3RoadmapBackup');
                if (oldBackup && !localStorage.getItem('graduationRoadmapBackup')) {
                    localStorage.setItem('graduationRoadmapBackup', oldBackup);
                }
            } catch(e) {
                console.error('[D3-REDIRECT] Migration error:', e);
            }

            // Redirect to the new app
            window.location.replace('graduation-roadmap.html');
        })();
    </script>
</body>
</html>
