<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dental Student Quest</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    
    <style>
        /* [STYLES REMAIN THE SAME AS YOUR ORIGINAL CODE] */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; color: #333; zoom: 0.70; }
        .container { max-width: 1400px; margin: 0 auto; }
        .header { text-align: center; color: white; margin-bottom: 30px; animation: fadeIn 1s ease-in; }
        .header h1 { font-size: 3em; margin-bottom: 10px; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
        .data-controls { margin-top: 20px; display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; }
        .data-btn { padding: 10px 20px; border: 2px solid white; border-radius: 10px; background: rgba(255, 255, 255, 0.2); color: white; font-weight: 600; cursor: pointer; transition: all 0.3s ease; backdrop-filter: blur(10px); font-size: 0.95em; }
        .stats-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: white; border-radius: 15px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); animation: slideUp 0.5s ease-out; }
        .level-display { font-size: 2.5em; font-weight: bold; color: #667eea; text-align: center; margin: 10px 0; }
        .main-content { display: grid; grid-template-columns: 1fr 350px; gap: 20px; margin-bottom: 20px; }
        .tasks-section { background: white; border-radius: 15px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .timer-section { background: white; border-radius: 15px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); position: sticky; top: 20px; height: fit-content; }
        .category-tabs { display: flex; gap: 10px; margin-bottom: 25px; flex-wrap: wrap; }
        .category-tab { padding: 12px 20px; border: none; border-radius: 10px; cursor: pointer; font-size: 0.95em; font-weight: 600; transition: all 0.3s ease; background: #f0f0f0; color: #666; }
        .category-tab.active { box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        .category-tab.dotoday { background: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%); color: white; }
        .add-task-form { display: flex; gap: 10px; margin-bottom: 20px; }
        .task-list { display: flex; flex-direction: column; gap: 12px; }
        .task-item { background: #f8f9fa; border-radius: 12px; padding: 18px; display: flex; align-items: center; gap: 15px; }
        .timer-clock { font-size: 4em; font-weight: bold; color: #667eea; text-align: center; margin: 20px 0; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 2000; align-items: center; justify-content: center; }
        .modal-overlay.show { display: flex; }
        .modal-content { background: white; border-radius: 15px; padding: 30px; max-width: 500px; width: 90%; }
        /* Add other necessary styles from original here... */
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-top: 10px; }
        .calendar-day { aspect-ratio: 1; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 0.85em; padding: 5px; cursor: pointer; border: 1px solid #ddd; }
        .calendar-day.has-pill { background: #d4edda; border-color: #28a745; color: #155724; }
        .calendar-day.no-pill-weekday { background: #f8d7da; border-color: #dc3545; color: #721c24; }
        .calendar-day.refill { background: #667eea; color: white; }
    </style>
</head>
<body>
    <div class="toast-notification" id="toast" style="position:fixed; bottom:20px; right:20px; background:white; padding:15px; border-radius:10px; display:none; z-index:9999;">
        <span id="toastIcon">✅</span> <span id="toastMessage"></span>
    </div>

    <div class="container">
        <div class="header">
            <h1>🦷 Dental Student Quest</h1>
            <p>Level up your life, one task at a time</p>
            <div class="data-controls">
                <button class="data-btn" onclick="createCheckpoint()">💾 Checkpoint</button>
                <button class="data-btn" onclick="document.getElementById('checkpointFile').click()">📂 Restore</button>
                <button class="data-btn" onclick="openNotebook()">📓 Notebook</button>
                <button class="data-btn" onclick="openCalendar()" style="background: #10b981;">📅 Calendar</button>
                <button class="data-btn" onclick="openFinancials()" style="background: #3b82f6;">💰 Financials</button>
                <input type="file" id="checkpointFile" style="display: none;" onchange="restoreCheckpoint(event)">
            </div>
        </div>

        <div class="stats-container">
            <div class="stat-card"><h3>XP Gained</h3><div class="level-display" id="totalXPGained">0</div></div>
            <div class="stat-card"><h3>Tasks Today</h3><div class="level-display" id="tasksToDoToday">0</div></div>
            <div class="stat-card"><h3>Tasks Remaining</h3><div class="level-display" id="tasksRemaining">0</div></div>
        </div>

        <div class="main-content">
            <div class="tasks-section">
                <div class="category-tabs">
                    <button class="category-tab dotoday active" data-category="dotoday">🔴 Do Today</button>
                    <button class="category-tab" data-category="financial">💰 Financial</button>
                    <button class="category-tab" data-category="health">❤️ Health</button>
                    <button class="category-tab" data-category="academic">📚 Academic</button>
                </div>
                <div class="add-task-form">
                    <input type="text" id="taskInput" class="data-btn" style="flex:1; color:black; background:white;" placeholder="New task...">
                    <button class="data-btn" onclick="addTask()" style="background:#764ba2;">+ Add</button>
                </div>
                <div id="taskList" class="task-list"></div>
                
                <div id="medicationTracker" style="display:none; margin-top:20px;">
                    <div id="status30mg" class="stat-card" style="margin-bottom:10px;" onclick="toggleCalendar('30mg')">30mg Status...</div>
                    <div id="calendar30mg" style="display:none;" class="calendar-grid"></div>
                </div>
            </div>

            <div class="timer-section">
                <div class="timer-clock" id="timerClock">25:00</div>
                <button class="data-btn" style="width:100%; color:black;" onclick="startTimer()">Start Session</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="calendarModal" onclick="closeCalendar()">
        <div class="modal-content" style="max-width:800px; max-height:90vh; overflow-y:auto;" onclick="event.stopPropagation()">
            <h2 id="currentMonthDisplay">Calendar</h2>
            <div id="masterCalendarGrid"></div>
            <button class="data-btn" style="color:black;" onclick="openAddCountdown()">+ Add Countdown</button>
            <div id="countdownsList"></div>
        </div>
    </div>

    <script>
        // === FIREBASE CONFIG ===
        const firebaseConfig = {
            apiKey: "AIzaSyCq0zU4Gm2kXKHDaCHzRD70p1B2NRXxKJc",
            authDomain: "dental-student-quest.firebaseapp.com",
            databaseURL: "https://dental-student-quest-default-rtdb.firebaseio.com",
            projectId: "dental-student-quest",
            storageBucket: "dental-student-quest.firebasestorage.app",
            messagingSenderId: "894381493570",
            appId: "1:894381493570:web:857d7d8fe247ef985e4cdb"
        };

        let tasks = [], stats = { totalXPGained: 0, totalTasks: 0, categoryXPGained: {} };
        let medications = { '30mg': { pills: 30, refillDate: null }, '20mg': { pills: 30, refillDate: null } };
        let calendarNotes = {}, pillAssignments = { '30mg': {}, '20mg': {} }, calendarEvents = [];
        let financials = { masterLiquidity: { currentCash: 0 }, committedBills: [], creditCards: [], actionItems: [] };
        let currentCategory = 'dotoday', firebaseInitialized = false, database, currentUser;

        // === CORE SYNC ENGINE ===
        function initializeFirebase() {
            try {
                if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
                database = firebase.database();
                let userPin = localStorage.getItem('dentalAppPin') || prompt('Enter PIN to Sync Cloud:');
                if (userPin) {
                    localStorage.setItem('dentalAppPin', userPin);
                    const hashedPin = 'user_' + btoa(userPin).replace(/=/g, '');
                    currentUser = { uid: hashedPin };
                    firebaseInitialized = true;

                    // LIVE LISTENER: Browser B updates when Browser A saves
                    database.ref('users/' + currentUser.uid + '/appData').on('value', (snapshot) => {
                        const data = snapshot.val();
                        if (data) {
                            tasks = data.tasks || [];
                            stats = data.stats || stats;
                            medications = data.medications || medications;
                            calendarEvents = data.calendarEvents || [];
                            pillAssignments = data.pillAssignments || { '30mg': {}, '20mg': {} };
                            calendarNotes = data.calendarNotes || {};
                            financials = data.financials || financials;
                            
                            updateStats();
                            renderTasks();
                            updateMedicationDisplay();
                            if(document.getElementById('calendarModal').classList.contains('show')) renderMasterCalendar();
                        }
                    });
                }
            } catch (e) { console.error("Firebase Error", e); }
        }

        function saveData() {
            const data = { tasks, stats, medications, calendarNotes, pillAssignments, calendarEvents, financials };
            localStorage.setItem('dentalStudentQuestData', JSON.stringify(data));
            if (firebaseInitialized && currentUser) {
                database.ref('users/' + currentUser.uid + '/appData').set(data)
                .catch(err => console.error("Cloud Save Failed", err));
            }
        }

        // === MASTER CALENDAR & COUNTDOWNS ===
        function saveCountdown() {
            const desc = prompt("Event Name:"), date = prompt("Date (YYYY-MM-DD):");
            if (desc && date) {
                calendarEvents.push({ id: Date.now().toString(), description: desc, dateStr: date, category: 'life' });
                saveData(); // Cloud Push
                renderMasterCalendar();
            }
        }

        function handleCalendarDayClick(event, medType, dateStr, displayDate, isRefillDay, totalPills) {
            if (isRefillDay) return;
            pillAssignments[medType][dateStr] = !pillAssignments[medType][dateStr];
            saveData(); // Cloud Push
            updateMedicationDisplay();
        }

        // === TASK LOGIC ===
        function addTask() {
            const input = document.getElementById('taskInput');
            if (!input.value) return;
            tasks.push({ id: Date.now(), text: input.value, category: currentCategory === 'dotoday' ? 'life' : currentCategory, completed: false, doToday: currentCategory === 'dotoday' });
            input.value = '';
            saveData();
            renderTasks();
        }

        function toggleTask(id) {
            const task = tasks.find(t => t.id === id);
            if (task) {
                task.completed = !task.completed;
                if(task.completed) stats.totalXPGained += 20;
                else stats.totalXPGained -= 20;
                saveData();
                renderTasks();
                updateStats();
            }
        }

        // === UI HELPERS ===
        function showToast(msg) {
            const t = document.getElementById('toast');
            document.getElementById('toastMessage').innerText = msg;
            t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 3000);
        }

        function updateStats() {
            document.getElementById('totalXPGained').innerText = stats.totalXPGained;
            document.getElementById('tasksRemaining').innerText = tasks.filter(t => !t.completed).length;
            document.getElementById('tasksToDoToday').innerText = tasks.filter(t => t.doToday && !t.completed).length;
        }

        function renderTasks() {
            const list = document.getElementById('taskList');
            const filtered = tasks.filter(t => currentCategory === 'dotoday' ? (t.doToday && !t.completed) : (t.category === currentCategory && !t.completed));
            list.innerHTML = filtered.map(t => `
                <div class="task-item">
                    <input type="checkbox" onchange="toggleTask(${t.id})">
                    <span style="flex:1">${t.text}</span>
                    <button onclick="deleteTask(${t.id})" style="background:none; border:none; cursor:pointer;">🗑️</button>
                </div>
            `).join('');
        }

        function openCalendar() { document.getElementById('calendarModal').classList.add('show'); renderMasterCalendar(); }
        function closeCalendar() { document.getElementById('calendarModal').classList.remove('show'); }

        // Start App
        initializeFirebase();
    </script>
</body>
</html>
